name: gemma-adjacency-prototype

# Ad-hoc PROTOTYPE for the "adjacency-reorder" thermal fix.
#
# Claim: the ranked score is a ratio (baseline/candidate); thermal drift only
# leaks in because the two TIMED windows are minutes apart (correctness bundled
# between them). If the two timed windows are ADJACENT, both sit at the same
# thermal state and the drift divides out -- no cooldown needed.
#
# Test: run --local-iterate windows back-to-back, timestamped, and analyze the
# PREFILL ratio-vs-gap: prefill[i]/prefill[i+g]. Prefill is the identical official
# single cold 512-token forward in every mode, so this is the real scored prefill.
# If the ratio CV grows monotonically with the gap between the two measurements,
# the adjacency mechanism is confirmed (residual ~ drift_rate x gap) -> measuring
# baseline and candidate ADJACENT collapses the thermal residual in the ratio.
#
# LIMITATION: the fast timing-only path (benchmark.sh + CORRECTNESS_STEPS=0) needs
# a benchmark oracle the public golden lacks, so each --local-iterate window is
# ~5 min (correctness bundled). Smallest measurable gap ~= today's BUNDLED spacing;
# the sub-2-min ADJACENT point is reached by extrapolating the fitted drift.
# (decode here is 16-step/setup-charged => noisy; prefill is the clean verdict.)
# Baked Gemma cache => no re-download. NOT CI/scoring.
on:
  # Registered now; dispatch-only so it never auto-fires. Pilot then scale via
  # `gh workflow run`. Verbose first window per machine is an inline pilot.
  workflow_dispatch:
    inputs:
      machines:
        description: 'JSON array of machine indices, e.g. "[1,2,3]".'
        required: false
        default: "[1,2,3]"
        type: string
      passes:
        description: 'Timing-only windows per machine (back-to-back).'
        required: false
        default: "15"
        type: string

concurrency:
  group: gemma-adjacency-prototype-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    name: "adjacency machine ${{ matrix.machine }}"
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(inputs.machines || '[1,2,3]') }}
    runs-on: tenki-macos-latest-xlarge
    timeout-minutes: 120
    env:
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH: correctness_prompts/public_longcopy_gate_english_512_256.json
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: /Users/runner/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Host identity
        run: |
          set -uo pipefail
          {
            echo "machine=${{ matrix.machine }}"
            echo "model=$(sysctl -n hw.model 2>/dev/null || true)"
            echo "os=$(sw_vers -productVersion 2>/dev/null || true)"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee host.txt

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_BASE_URL: https://huggingface.co/mlx-community/gemma-4-31b-4bit/resolve/main
          MLXFAST_REFERENCE_DOWNLOAD_JOBS: "12"
          MLXFAST_REFERENCE_MIN_FREE_GIB: "40"
          MLXFAST_REFERENCE_POST_DOWNLOAD_FULL_VERIFY: "0"
          MLXFAST_REFERENCE_HASH_VERIFY: "0"
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_REFERENCE_DIR}/config.json" ]]; then
            echo "::error::baked Gemma checkpoint missing at ${MLXFAST_REFERENCE_DIR}; refusing to download" >&2
            exit 1
          fi
          ./setup.sh

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" \
            --output weights

      - name: Sample windows back-to-back
        env:
          MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
          MLXFAST_SKIP_TRANSFORM: "1"
          MLXFAST_WEIGHTS_PATH: weights
          PASSES: ${{ inputs.passes || '15' }}
        run: |
          set -uo pipefail
          echo "machine ${{ matrix.machine }}: ${PASSES} --local-iterate windows (clean official cold prefill)"
          # NOTE: the fast timing-only path (benchmark.sh + CORRECTNESS_STEPS=0)
          # is blocked -- the public golden has no benchmark oracle. --local-iterate
          # works with the public golden and its PREFILL is the identical official
          # single cold 512-token forward (only decode differs: 16-step, setup-
          # charged, noisy -> use prefill for the ratio-vs-gap verdict). Each window
          # is ~5 min (correctness bundled), so the smallest achievable gap ~= the
          # current BUNDLED spacing; larger gaps come free by skipping windows.
          # columns: index epoch_seconds decode_s_per_tok prefill_s_per_tok
          : > "samples-${{ matrix.machine }}.txt"
          for i in $(seq 1 "${PASSES}"); do
            ./benchmark.sh --local-iterate >/dev/null 2>&1 || true
            ts=$(date +%s)
            read -r dec pre < <(python3 - <<'PY'
          import json
          try:
              m = json.load(open("score.local-iterate.json"))["metrics"]
              print(m.get("decode_seconds_per_token",""), m.get("prefill_seconds_per_token",""))
          except Exception:
              print("", "")
          PY
          )
            echo "${i} ${ts} ${dec} ${pre}" | tee -a "samples-${{ matrix.machine }}.txt"
          done
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a host.txt
          cp host.txt "host-${{ matrix.machine }}.txt"

      - name: Upload machine samples
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-adjacency-prototype-${{ github.run_id }}-machine-${{ matrix.machine }}
          path: |
            samples-${{ matrix.machine }}.txt
            host-${{ matrix.machine }}.txt
          if-no-files-found: error
          retention-days: 14

  combine:
    name: combine
    needs: [sample]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download samples
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: gemma-adjacency-prototype-${{ github.run_id }}-machine-*
          path: samples
          merge-multiple: false
      - name: Ratio-vs-gap (does adjacency collapse the residual?)
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${GITHUB_STEP_SUMMARY}"
          import glob, os, re, statistics as st, math
          by = {}   # idx -> list of (elapsed_min, decode, prefill)
          for fp in sorted(glob.glob("samples/**/samples-*.txt", recursive=True)):
              idx = re.sub(r"^samples-(.+)\.txt$", r"\1", os.path.basename(fp))
              rows, t0 = [], None
              for line in open(fp):
                  parts = line.split()
                  if len(parts) < 4: continue
                  try:
                      e = float(parts[1]); d = float(parts[2]); p = float(parts[3])
                  except ValueError:
                      continue
                  if d <= 0 or p <= 0: continue
                  if t0 is None: t0 = e
                  rows.append(((e - t0)/60.0, d, p))
              if len(rows) >= 2: by[idx] = rows

          def cv(xs):
              m = st.mean(xs); return (st.pstdev(xs)/m*100.0) if m else float("nan")

          print("## Adjacency prototype: ratio-vs-gap between two timed windows")
          print()
          print("Both windows are the SAME code, so the ratio should be 1.0; its spread is")
          print("pure measurement residual (thermal + transient). Small gap = adjacency-reorder.")
          print()
          # per-machine sanity table
          print("| machine | n | decode mean | prefill mean | window spacing (min) |")
          print("|---|---|---|---|---|")
          spac = []
          for idx in sorted(by):
              r = by[idx]; d=[x[1] for x in r]; p=[x[2] for x in r]
              gaps=[r[i+1][0]-r[i][0] for i in range(len(r)-1)]
              if gaps: spac.append(st.mean(gaps))
              print(f"| {idx} | {len(r)} | {st.mean(d):.5f} | {st.mean(p):.5f} | {st.mean(gaps) if gaps else float('nan'):.2f} |")
          med_spacing = st.median(spac) if spac else float("nan")
          print()
          print(f"Median window spacing: **{med_spacing:.2f} min**  (=> gap g windows ~= {med_spacing:.2f}*g min apart)")
          print()
          print("### Residual as a function of window gap")
          print()
          print("| gap g | ~gap (min) | decode ratio mean|dev| | decode ratio CV | prefill ratio mean|dev| | prefill ratio CV |")
          print("|---|---|---|---|---|---|---|")
          maxg = min(7, max((len(r) for r in by.values()), default=1)-1)
          rows_out=[]
          for g in range(1, maxg+1):
              dr, pr, gmins = [], [], []
              for idx in by:
                  r = by[idx]
                  for i in range(len(r)-g):
                      dr.append(r[i][1]/r[i+g][1])
                      pr.append(r[i][2]/r[i+g][2])
                      gmins.append(r[i+g][0]-r[i][0])
              if not dr: continue
              dd = st.mean([abs(x-1)*100 for x in dr]); pd = st.mean([abs(x-1)*100 for x in pr])
              gm = st.median(gmins)
              rows_out.append((g, gm, dd, cv(dr), pd, cv(pr)))
              print(f"| {g} | {gm:.1f} | {dd:.1f}% | {cv(dr):.1f}% | {pd:.1f}% | {cv(pr):.1f}% |")
          print()
          if rows_out:
              print("### Verdict (PREFILL — the clean, scored axis)")
              print()
              # fit prefill mean|dev| ~ slope * gap_min through the origin (residual
              # from zero gap is ~0 by definition). rows_out: (g, gm, dd, dcv, pd, pcv)
              num = sum(r[1]*r[4] for r in rows_out); den = sum(r[1]*r[1] for r in rows_out)
              slope = num/den if den else float("nan")   # % residual per minute of gap
              def pred(gap): return slope*gap
              small = min(rows_out, key=lambda r: r[1])
              bundled = min(rows_out, key=lambda r: abs(r[1]-7.0))
              grows = rows_out[-1][4] > rows_out[0][4]
              print(f"- prefill residual grows with gap: {small[1]:.0f} min -> **{small[4]:.1f}%** ... {rows_out[-1][1]:.0f} min -> **{rows_out[-1][4]:.1f}%**")
              print(f"- fitted drift: **{slope:.2f}% residual per minute** of gap between the two measurements")
              print()
              print("| scenario | gap (min) | predicted prefill residual |")
              print("|---|---|---|")
              print(f"| TODAY bundled (measured @{bundled[1]:.0f}m) | ~7 | ~{bundled[4]:.1f}% (measured), {pred(7):.1f}% (fit) |")
              print(f"| ADJACENT reorder (extrapolated) | ~1.5 | **~{pred(1.5):.1f}%** |")
              print()
              print("- **" + ("ADJACENCY WORKS: prefill residual grows ~linearly with the gap, so measuring "
                              "baseline+candidate adjacent (~1.5 min) instead of bundled (~7 min) cuts the "
                              f"thermal residual ~{(pred(7)/pred(1.5) if pred(1.5) else 0):.0f}x."
                              if grows else
                              "INCONCLUSIVE: prefill residual does not clearly grow with gap here (transient-dominated?).") + "**")
          print()
          print("> Same code both sides => ratio~1.0 expected; we measure only the residual")
          print("> pairing cannot cancel. Sub-2-min adjacent point is extrapolated (window floor")
          print("> is ~5 min). Decode ratio columns are 16-step/noisy here; decode drift is")
          print("> measured cleanly by gemma-decode-consistency (~0.6-0.8%/min).")
          PY
      - name: Upload combined
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-adjacency-prototype-${{ github.run_id }}-combined
          path: samples
          if-no-files-found: warn
          retention-days: 14
