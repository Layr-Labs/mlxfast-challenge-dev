name: gemma-vm-noise-probe

# DIAGNOSTIC (dispatch-only, NOT scored). Measures the STRUCTURE of tenki decode
# timing noise at the OFFICIAL 128-step cadence (the cadence the acceptance band
# actually gates on) to decide the band strategy (median-of-N vs same-VM pairing
# vs widen). On each of several FRESH VMs it loads the reference once and runs the
# OFFICIAL timed decode window (128 steps, 512-token seed) K times back-to-back:
#   - WITHIN-VM jitter  = spread of the K repeats on one VM (median-of-N fixes this)
#   - BETWEEN-VM offset = spread of the per-VM medians across VMs (only same-VM
#     pairing cancels this; median-of-N does NOT)
#   - WARMING           = run 1 (coldest) vs runs 2..K (warm), decode AND prefill.
# Timing only: MLXFAST_BENCHMARK_{CORRECTNESS_STEPS=0,CHECK_GATES=0}. Uses the raw
# private timed oracle (R2) like the baseline job, but the ONLY things printed or
# uploaded are seconds-per-token numbers -- never any golden/token content. Reuses
# the registered gemma-freshvm.yml dispatch path.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "timed decode repeats per VM"
        default: "8"

concurrency:
  group: gemma-vm-noise-probe-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: "vm noise probe 128-step (fresh vm ${{ matrix.vm }})"
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2, 3, 4, 5, 6]
    runs-on: tenki-macos-latest-xlarge
    timeout-minutes: 90
    environment: benchmark-private-prompts
    env:
      MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
      MLXFAST_PRIVATE_PROMPTS_R2_PRESENT: ${{ (secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_BUCKET_ENDPOINT != '' && secrets.R2_SECRET_ACCESS_KEY != '') && '1' || '0' }}
      # Raw timed oracle (same as the baseline job): 512-token seed + 128 decode.
      MLXFAST_CORRECTNESS_GOLDEN_R2_PATH: correctness_prompts/golden_prompt_benchmark_transcription_gate_english_512_256-gemma.json
      MLXFAST_CORRECTNESS_GOLDEN_PATH: /tmp/mlxfast-probe-${{ github.run_id }}-${{ github.run_attempt }}/oracle.json
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: /Users/runner/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
      MLXFAST_TRUSTED_BENCHMARK_REF: ${{ github.ref }}
      # Timing only: measure the timed prompt, never the base case or gates.
      MLXFAST_BENCHMARK_CORRECTNESS_STEPS: "0"
      MLXFAST_BENCHMARK_CHECK_GATES: "0"
      MLXFAST_BENCHMARK_SKIP_TIMED: "0"
      REPEATS: ${{ inputs.repeats }}
      OUT_DIR: probe-out
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Host identity + VM freshness
        run: |
          set -uo pipefail
          boot=$(sysctl -n kern.boottime 2>/dev/null | grep -oE 'sec = [0-9]+' | grep -oE '[0-9]+' | head -1)
          now=$(date +%s)
          echo "vm=${{ matrix.vm }} uptime_s=$(( now - ${boot:-now} )) (small => fresh VM)"
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true

      - name: Check correctness golden source
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${MLXFAST_CORRECTNESS_GOLDEN_PATH}")"
          if [[ "${MLXFAST_PRIVATE_PROMPTS_R2_PRESENT}" != "1" ]]; then
            echo "::error::probe requires private R2 secrets for the 128-step timed oracle" >&2
            exit 1
          fi

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_BASE_URL: https://huggingface.co/mlx-community/gemma-4-31b-4bit/resolve/main
          MLXFAST_REFERENCE_DOWNLOAD_JOBS: "12"
          MLXFAST_REFERENCE_MIN_FREE_GIB: "40"
          MLXFAST_REFERENCE_POST_DOWNLOAD_FULL_VERIFY: "0"
          MLXFAST_REFERENCE_HASH_VERIFY: "0"
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_REFERENCE_DIR}/config.json" ]]; then
            echo "::error::baked Gemma checkpoint missing at ${MLXFAST_REFERENCE_DIR}" >&2
            exit 1
          fi
          ./setup.sh

      - name: Prepare timed oracle (R2)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_ENDPOINT: ${{ secrets.R2_BUCKET_ENDPOINT }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_CORRECTNESS_GOLDEN_R2_PATH}" \
            "${MLXFAST_CORRECTNESS_GOLDEN_PATH}"
          actual_hash="$(shasum -a 256 "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | awk '{print $1}')"
          actual_bytes="$(wc -c < "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | tr -d ' ')"
          {
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_SHA256=${actual_hash}"
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_BYTES=${actual_bytes}"
          } >> "${GITHUB_ENV}"
          # sha/bytes are not golden content; safe to log for provenance.
          echo "probe: timed oracle ${actual_hash} bytes=${actual_bytes}"

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" --output weights

      - name: Repeated OFFICIAL 128-step timed decode (within-VM jitter + warming)
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          OUT="${OUT_DIR}/vm-${{ matrix.vm }}.jsonl"
          : > "${OUT}"
          n="${REPEATS:-8}"
          # Each iteration is the OFFICIAL timed path (512-seed prefill + 128-step
          # decode) in a fresh process. Only the seconds-per-token metrics are read
          # out; benchmark stdout is suppressed so no token/golden content is logged.
          for i in $(seq 1 "${n}"); do
            sp="/tmp/mlxfast-probe-${{ github.run_id }}-${{ github.run_attempt }}/score-${i}.json"
            rm -f "$sp"
            MLXFAST_SCORE_PATH="$sp" \
              MLXFAST_INTEGRITY_PATH="/tmp/mlxfast-probe-${{ github.run_id }}-${{ github.run_attempt }}/integ-${i}.json" \
              ./benchmark.sh >/dev/null 2>&1 || true
            d=$(jq -r '.metrics.decode_seconds_per_token // empty' "$sp" 2>/dev/null || echo "")
            p=$(jq -r '.metrics.prefill_seconds_per_token // empty' "$sp" 2>/dev/null || echo "")
            echo "{\"vm\":${{ matrix.vm }},\"i\":${i},\"prefill\":${p:-null},\"decode\":${d:-null}}" | tee -a "${OUT}"
          done
          echo "=== vm ${{ matrix.vm }} decode samples (s/token) ==="
          jq -r '.decode' "${OUT}" | tr '\n' ' '; echo
          echo "=== vm ${{ matrix.vm }} prefill samples (s/token) ==="
          jq -r '.prefill' "${OUT}" | tr '\n' ' '; echo

      - name: Upload probe results (timings only)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-vm-noise-probe-${{ github.run_id }}-vm${{ matrix.vm }}
          path: probe-out/vm-${{ matrix.vm }}.jsonl
          if-no-files-found: error
          retention-days: 3
