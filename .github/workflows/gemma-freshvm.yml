name: gemma-vm-noise-probe

# DIAGNOSTIC (dispatch-only, NOT scored). Measures the STRUCTURE of tenki decode
# timing noise to decide the acceptance-band strategy (median-of-N vs same-VM
# pairing vs widen). On each of several FRESH VMs it loads the reference once and
# runs the timed decode window K times back-to-back, so we can separate:
#   - WITHIN-VM jitter  = spread of the K repeats on one VM (median-of-N fixes this)
#   - BETWEEN-VM offset = spread of the per-VM medians across VMs (only same-VM
#     pairing cancels this; median-of-N does NOT)
#   - WARMING           = run 1 (coldest) vs runs 2..K (warm), for decode AND
#     prefill -- if decode is warming-immune, same-VM pairing is safe for decode.
# Timings only; uses the PUBLIC fixtures via --local-iterate, so no private goldens
# and no R2 secrets. Reuses the registered gemma-freshvm.yml dispatch path.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "timed decode repeats per VM"
        default: "8"

concurrency:
  group: gemma-vm-noise-probe-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: "vm noise probe (fresh vm ${{ matrix.vm }})"
    strategy:
      fail-fast: false
      matrix:
        vm: [1, 2, 3, 4, 5, 6]
    runs-on: tenki-macos-latest-xlarge
    timeout-minutes: 90
    env:
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: /Users/runner/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
      REPEATS: ${{ inputs.repeats }}
      OUT_DIR: probe-out
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Host identity + VM freshness
        run: |
          set -uo pipefail
          boot=$(sysctl -n kern.boottime 2>/dev/null | grep -oE 'sec = [0-9]+' | grep -oE '[0-9]+' | head -1)
          now=$(date +%s)
          echo "vm=${{ matrix.vm }} uptime_s=$(( now - ${boot:-now} )) (small => fresh VM)"
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_BASE_URL: https://huggingface.co/mlx-community/gemma-4-31b-4bit/resolve/main
          MLXFAST_REFERENCE_DOWNLOAD_JOBS: "12"
          MLXFAST_REFERENCE_MIN_FREE_GIB: "40"
          MLXFAST_REFERENCE_POST_DOWNLOAD_FULL_VERIFY: "0"
          MLXFAST_REFERENCE_HASH_VERIFY: "0"
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_REFERENCE_DIR}/config.json" ]]; then
            echo "::error::baked Gemma checkpoint missing at ${MLXFAST_REFERENCE_DIR}" >&2
            exit 1
          fi
          ./setup.sh

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" --output weights

      - name: Repeated timed decode (within-VM jitter + warming)
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          OUT="${OUT_DIR}/vm-${{ matrix.vm }}.jsonl"
          : > "${OUT}"
          n="${REPEATS:-8}"
          # Each iteration is a FRESH process (reloads the model), then one timed
          # prefill + 128-step decode via the public fixture. The reported
          # seconds-per-token are the isolated timed windows (load excluded), so the
          # K decode values give within-VM decode jitter; run 1 vs 2..K gives the
          # cross-process warming signal.
          for i in $(seq 1 "${n}"); do
            rm -f score.local-iterate.json
            ./benchmark.sh --local-iterate >/dev/null 2>&1 || true
            sf=score.local-iterate.json
            [[ -f "$sf" ]] || sf=score.json
            d=$(jq -r '.metrics.decode_seconds_per_token // .decode_seconds_per_token // empty' "$sf" 2>/dev/null || echo "")
            p=$(jq -r '.metrics.prefill_seconds_per_token // .prefill_seconds_per_token // empty' "$sf" 2>/dev/null || echo "")
            echo "{\"vm\":${{ matrix.vm }},\"i\":${i},\"prefill\":${p:-null},\"decode\":${d:-null}}" | tee -a "${OUT}"
          done
          echo "=== vm ${{ matrix.vm }} decode samples (s/token) ==="
          jq -r '.decode' "${OUT}" | tr '\n' ' '; echo
          echo "=== vm ${{ matrix.vm }} prefill samples (s/token) ==="
          jq -r '.prefill' "${OUT}" | tr '\n' ' '; echo

      - name: Upload probe results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-vm-noise-probe-${{ github.run_id }}-vm${{ matrix.vm }}
          path: probe-out/vm-${{ matrix.vm }}.jsonl
          if-no-files-found: error
          retention-days: 3
