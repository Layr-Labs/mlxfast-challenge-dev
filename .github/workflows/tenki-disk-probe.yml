name: tenki-disk-probe

# Throwaway diagnostic: inspect the tenki-macos-latest-xlarge runner's disk
# layout and discover which paths PERSIST between runs (a "sticky disk"). Run it
# twice: the first run writes markers, the second reveals which survived and
# therefore persist. Also dumps df/mount so we can tell local (apfs) volumes
# from the slow network mount, and env for any tenki/sticky cache hints.
# No build, no checkpoint -- fast.
on:
  push:
    branches:
      - probe/tenki-disk
  workflow_dispatch:

concurrency:
  group: tenki-disk-probe-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: tenki-macos-latest-xlarge
    timeout-minutes: 15
    steps:
      - name: Disk layout and persistence markers
        run: |
          set -uo pipefail
          echo "===== df -h ====="
          df -h || true
          echo
          echo "===== mount (fs types: apfs/hfs=local, nfs/smbfs/afpfs=network) ====="
          mount || true
          echo
          echo "HOME=${HOME:-} GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-}"
          echo "RUNNER_TEMP=${RUNNER_TEMP:-} RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-}"
          echo
          probe_paths="${HOME}/.cache ${HOME} /tmp /private/tmp /opt/tenki /var/tmp ${RUNNER_TOOL_CACHE:-/nonexist-tc} ${RUNNER_TEMP:-/nonexist-rt}"
          echo "===== markers from PRIOR runs (present => that path PERSISTS) ====="
          for p in ${probe_paths}; do
            m="${p}/.mlxfast-persist-probe"
            if [ -f "${m}" ]; then
              echo "PERSISTED  ${m} :: $(cat "${m}" 2>/dev/null)"
            else
              echo "absent     ${m}"
            fi
          done
          echo
          echo "===== writing fresh markers (run=${{ github.run_id }}) ====="
          for p in ${probe_paths}; do
            m="${p}/.mlxfast-persist-probe"
            if mkdir -p "${p}" 2>/dev/null && echo "run=${{ github.run_id }} date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${m}" 2>/dev/null; then
              echo "wrote      ${m}"
            else
              echo "cannot     ${m}"
            fi
          done
          echo
          echo "===== env (tenki / sticky / cache / runner hints) ====="
          env | grep -iE 'TENKI|STICKY|CACHE|IMAGEOS|IMAGEVERSION|RUNNER_' | sort || true
