name: gemma-prefill-variance

# Ad-hoc: quantify how much of the prefill measurement variance SURVIVES the
# official paired-baseline scoring, which is a same-session same-host ratio.
#
# Prefill is measured identically in every mode -- exactly ONE cold forward over
# 512 tokens (benchmarkPrefillTimedRuns=1, warmupRuns=0). So we run many quick
# `./benchmark.sh --local-iterate` passes; each is a fresh process => a genuine
# cold prefill, exactly like the scored one. Repeating on the SAME machine gives
# the within-host component (which pairing CANNOT cancel); spreading across
# machines gives the cross-host component (which pairing DOES cancel, since
# baseline and candidate share a host). The split answers: does the ~34% raw
# prefill CV survive pairing, or not?
#
# Gemma checkpoint is baked into the tenki home cache (no ~17 GB re-download).
# NOT part of CI or scoring.
on:
  push:
    branches:
      - gemma-tenki-decode
  workflow_dispatch:
    inputs:
      machines:
        description: 'JSON array of machine indices, e.g. "[1,2,3,4,5,6]".'
        required: false
        default: "[1,2,3,4,5,6]"
        type: string
      passes:
        description: 'Cold prefill passes per machine.'
        required: false
        default: "15"
        type: string

concurrency:
  group: gemma-prefill-variance-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    name: "prefill machine ${{ matrix.machine }}"
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(inputs.machines || '[1,2,3,4,5,6]') }}
    runs-on: tenki-macos-latest-xlarge
    timeout-minutes: 120
    env:
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH: correctness_prompts/public_longcopy_gate_english_512_256.json
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: /Users/runner/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Host identity
        run: |
          set -uo pipefail
          {
            echo "machine=${{ matrix.machine }}"
            echo "hostname=$(hostname 2>/dev/null || true)"
            echo "cpu=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
            echo "model=$(sysctl -n hw.model 2>/dev/null || true)"
            echo "os=$(sw_vers -productVersion 2>/dev/null || true)"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee host.txt

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_BASE_URL: https://huggingface.co/mlx-community/gemma-4-31b-4bit/resolve/main
          MLXFAST_REFERENCE_DOWNLOAD_JOBS: "12"
          MLXFAST_REFERENCE_MIN_FREE_GIB: "40"
          MLXFAST_REFERENCE_POST_DOWNLOAD_FULL_VERIFY: "0"
          MLXFAST_REFERENCE_HASH_VERIFY: "0"
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_REFERENCE_DIR}/config.json" ]]; then
            echo "::error::baked Gemma checkpoint missing at ${MLXFAST_REFERENCE_DIR}; refusing to download" >&2
            exit 1
          fi
          ./setup.sh

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" \
            --output weights

      - name: Sample cold prefill N times
        env:
          MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
          MLXFAST_SKIP_TRANSFORM: "1"
          MLXFAST_WEIGHTS_PATH: weights
          PASSES: ${{ inputs.passes || '15' }}
        run: |
          set -uo pipefail
          echo "machine ${{ matrix.machine }}: ${PASSES} cold prefill passes"
          # columns: index epoch_seconds prefill_s_per_tok decode_s_per_tok
          # epoch lets combine test for THERMAL drift: prefill trending up with
          # time-on-machine = throttling; flat/scatter = not thermal.
          : > "samples-${{ matrix.machine }}.txt"
          for i in $(seq 1 "${PASSES}"); do
            # Each invocation is a fresh process: cold Metal kernels, cold
            # allocator => a genuine cold prefill, same as the scored path.
            ./benchmark.sh --local-iterate >/dev/null 2>&1 || true
            ts=$(date +%s)
            read -r p d < <(python3 - <<'PY'
          import json
          try:
              m = json.load(open("score.local-iterate.json"))["metrics"]
              print(m.get("prefill_seconds_per_token",""), m.get("decode_seconds_per_token",""))
          except Exception:
              print("", "")
          PY
          )
            echo "${i} ${ts} ${p} ${d}" | tee -a "samples-${{ matrix.machine }}.txt"
          done
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a host.txt
          cp host.txt "host-${{ matrix.machine }}.txt"

      - name: Upload machine samples
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-prefill-variance-${{ github.run_id }}-machine-${{ matrix.machine }}
          path: |
            samples-${{ matrix.machine }}.txt
            host-${{ matrix.machine }}.txt
          if-no-files-found: error
          retention-days: 14

  combine:
    name: combine
    needs: [sample]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download samples
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: gemma-prefill-variance-${{ github.run_id }}-machine-*
          path: samples
          merge-multiple: false
      - name: Decompose prefill variance (within-host vs cross-host)
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${GITHUB_STEP_SUMMARY}"
          import glob, os, re, statistics as st, math
          by_machine = {}   # idx -> list of (elapsed_min, prefill)
          for fp in sorted(glob.glob("samples/**/samples-*.txt", recursive=True)):
              idx = re.sub(r"^samples-(.+)\.txt$", r"\1", os.path.basename(fp))
              rows = []; t0 = None
              for line in open(fp):
                  parts = line.split()
                  # new format: idx epoch prefill decode ; tolerate old: idx prefill decode
                  if len(parts) >= 4:
                      ep, pv = parts[1], parts[2]
                  elif len(parts) == 3:
                      ep, pv = None, parts[1]
                  else:
                      continue
                  try:
                      p = float(pv)
                  except ValueError:
                      continue
                  if p <= 0: continue
                  e = None
                  if ep is not None:
                      try: e = float(ep)
                      except ValueError: e = None
                  if e is not None and t0 is None: t0 = e
                  rows.append(((e - t0)/60.0 if (e is not None and t0 is not None) else None, p))
              if rows: by_machine[idx] = rows

          def cv(xs):
              m = st.mean(xs)
              return (st.pstdev(xs)/m*100.0) if m else float("nan")
          def linreg(xs, ys):
              mx, my = st.mean(xs), st.mean(ys)
              sxx = sum((x-mx)**2 for x in xs); syy = sum((y-my)**2 for y in ys)
              sxy = sum((x-mx)*(y-my) for x, y in zip(xs, ys))
              slope = sxy/sxx if sxx else 0.0
              r = sxy/math.sqrt(sxx*syy) if sxx and syy else 0.0
              return slope, r

          print("## Gemma prefill variance: thermal drift + how much survives pairing")
          print()
          print("Prefill = one cold 512-token forward per process (the scored shape).")
          print()
          print("| machine | n | mean s/tok | tok/s | within CV | 1st third | last third | drift | slope/min | r(time) |")
          print("|---|---|---|---|---|---|---|---|---|---|")
          machine_means, within_cvs, pooled = [], [], []
          adj_ratios, span_ratios, drifts, slopes_pct, rs = [], [], [], [], []
          for idx in sorted(by_machine):
              rows = by_machine[idx]
              pf = [p for _, p in rows]
              machine_means.append(st.mean(pf)); within_cvs.append(cv(pf)); pooled.extend(pf)
              for a, b in zip(pf, pf[1:]): adj_ratios.append(b/a)
              span_ratios.append(pf[-1]/pf[0])
              k = max(1, len(pf)//3)
              f3, l3 = st.mean(pf[:k]), st.mean(pf[-k:])
              drift = (l3-f3)/f3*100.0; drifts.append(drift)
              el = [e for e, _ in rows if e is not None]
              if len(el) == len(pf) and len(set(el)) > 1:
                  slope, r = linreg(el, pf)
                  slope_pct = slope/st.mean(pf)*100.0   # %/min of mean
                  slopes_pct.append(slope_pct); rs.append(r)
                  scol, rcol = f"{slope_pct:+.1f}%", f"{r:+.2f}"
              else:
                  scol, rcol = "n/a", "n/a"
              print(f"| {idx} | {len(pf)} | {st.mean(pf):.5f} | {1/st.mean(pf):.2f} | {cv(pf):.1f}% | {f3:.5f} | {l3:.5f} | {drift:+.1f}% | {scol} | {rcol} |")

          print()
          if len(machine_means) >= 2 and pooled:
              raw = cv(pooled); cross = cv(machine_means); within = st.mean(within_cvs)
              print("### 1) Thermal test (does prefill drift up with time-on-machine?)")
              print()
              md = st.mean(drifts)
              if slopes_pct:
                  print(f"- mean first-third -> last-third drift: **{md:+.1f}%**  (worst machine {max(drifts):+.1f}%)")
                  print(f"- mean slope: **{st.mean(slopes_pct):+.1f}%/min**, mean time-correlation r = **{st.mean(rs):+.2f}**")
                  hot = st.mean(rs) > 0.5 and md > 8
                  cool = abs(md) < 5 and abs(st.mean(rs)) < 0.3
                  verdict = ("THERMAL THROTTLING likely: prefill rises monotonically with time on host."
                             if hot else
                             "NOT thermal: no consistent upward trend; variance is random scatter."
                             if cool else
                             "MIXED: some drift but not a clean monotonic climb; part thermal, part scatter.")
                  print(f"- **verdict: {verdict}**")
                  if hot:
                      print("- Because this drift is DIRECTIONAL (candidate runs after baseline => hotter),")
                      print("  pairing does NOT cancel it; it biases prefill_speedup below 1 by ~the drift.")
              else:
                  print("- (no timestamps parsed; cannot run thermal trend test)")
              print()
              print("### 2) Variance decomposition (what pairing can remove)")
              print()
              print(f"- **RAW pooled CV** (all machines, all passes): **{raw:.1f}%**")
              print(f"- cross-host CV (spread of per-machine means): **{cross:.1f}%**  <- pairing CANCELS this")
              print(f"- within-host CV (avg per-machine, same host): **{within:.1f}%**  <- pairing KEEPS this")
              share = (cross*cross)/(cross*cross+within*within)*100 if (cross or within) else float("nan")
              print(f"- => ~**{share:.0f}%** of raw variance is cross-host (removed), ~**{100-share:.0f}%** within-host (survives)")
              print()
              print("### 3) Empirical surviving residual (same-host ratios)")
              print()
              sr_dev = [abs(r-1)*100 for r in span_ratios]
              print(f"- consecutive same-host pass ratios: CV **{cv(adj_ratios):.1f}%** (n={len(adj_ratios)})")
              print(f"- first-vs-last same-host ratio (max in-job drift): mean |dev| {st.mean(sr_dev):.1f}%, worst {max(sr_dev):.1f}%")
              print()
              print("> NOTE: consecutive passes are ~40 s apart; the real baseline/candidate gap")
              print("> is minutes, so true surviving residual >= consecutive-pass CV. Decode is")
              print("> stable (3.5% CV, measured separately).")
          print()
          PY
      - name: Upload combined
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-prefill-variance-${{ github.run_id }}-combined
          path: samples
          if-no-files-found: warn
          retention-days: 14
