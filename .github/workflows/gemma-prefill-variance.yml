name: gemma-prefill-variance

# Ad-hoc: quantify how much of the prefill measurement variance SURVIVES the
# official paired-baseline scoring, which is a same-session same-host ratio.
#
# Prefill is measured identically in every mode -- exactly ONE cold forward over
# 512 tokens (benchmarkPrefillTimedRuns=1, warmupRuns=0). So we run many quick
# `./benchmark.sh --local-iterate` passes; each is a fresh process => a genuine
# cold prefill, exactly like the scored one. Repeating on the SAME machine gives
# the within-host component (which pairing CANNOT cancel); spreading across
# machines gives the cross-host component (which pairing DOES cancel, since
# baseline and candidate share a host). The split answers: does the ~34% raw
# prefill CV survive pairing, or not?
#
# Gemma checkpoint is baked into the tenki home cache (no ~17 GB re-download).
# NOT part of CI or scoring.
on:
  push:
    branches:
      - gemma-tenki-decode
  workflow_dispatch:
    inputs:
      machines:
        description: 'JSON array of machine indices, e.g. "[1,2,3,4,5,6]".'
        required: false
        default: "[1,2,3,4,5,6]"
        type: string
      passes:
        description: 'Cold prefill passes per machine.'
        required: false
        default: "15"
        type: string

concurrency:
  group: gemma-prefill-variance-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    name: "prefill machine ${{ matrix.machine }}"
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(inputs.machines || '[1,2,3,4,5,6]') }}
    runs-on: tenki-macos-latest-xlarge
    timeout-minutes: 120
    env:
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH: correctness_prompts/public_longcopy_gate_english_512_256.json
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: /Users/runner/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Host identity
        run: |
          set -uo pipefail
          {
            echo "machine=${{ matrix.machine }}"
            echo "hostname=$(hostname 2>/dev/null || true)"
            echo "cpu=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
            echo "model=$(sysctl -n hw.model 2>/dev/null || true)"
            echo "os=$(sw_vers -productVersion 2>/dev/null || true)"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee host.txt

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_BASE_URL: https://huggingface.co/mlx-community/gemma-4-31b-4bit/resolve/main
          MLXFAST_REFERENCE_DOWNLOAD_JOBS: "12"
          MLXFAST_REFERENCE_MIN_FREE_GIB: "40"
          MLXFAST_REFERENCE_POST_DOWNLOAD_FULL_VERIFY: "0"
          MLXFAST_REFERENCE_HASH_VERIFY: "0"
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_REFERENCE_DIR}/config.json" ]]; then
            echo "::error::baked Gemma checkpoint missing at ${MLXFAST_REFERENCE_DIR}; refusing to download" >&2
            exit 1
          fi
          ./setup.sh

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" \
            --output weights

      - name: Sample cold prefill N times
        env:
          MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
          MLXFAST_SKIP_TRANSFORM: "1"
          MLXFAST_WEIGHTS_PATH: weights
          PASSES: ${{ inputs.passes || '15' }}
        run: |
          set -uo pipefail
          echo "machine ${{ matrix.machine }}: ${PASSES} cold prefill passes"
          # header: index prefill_s_per_tok decode_s_per_tok(setup-charged, ref only)
          : > "samples-${{ matrix.machine }}.txt"
          for i in $(seq 1 "${PASSES}"); do
            # Each invocation is a fresh process: cold Metal kernels, cold
            # allocator => a genuine cold prefill, same as the scored path.
            ./benchmark.sh --local-iterate >/dev/null 2>&1 || true
            read -r p d < <(python3 - <<'PY'
          import json
          try:
              m = json.load(open("score.local-iterate.json"))["metrics"]
              print(m.get("prefill_seconds_per_token",""), m.get("decode_seconds_per_token",""))
          except Exception:
              print("", "")
          PY
          )
            echo "${i} ${p} ${d}" | tee -a "samples-${{ matrix.machine }}.txt"
          done
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a host.txt
          cp host.txt "host-${{ matrix.machine }}.txt"

      - name: Upload machine samples
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-prefill-variance-${{ github.run_id }}-machine-${{ matrix.machine }}
          path: |
            samples-${{ matrix.machine }}.txt
            host-${{ matrix.machine }}.txt
          if-no-files-found: error
          retention-days: 14

  combine:
    name: combine
    needs: [sample]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download samples
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: gemma-prefill-variance-${{ github.run_id }}-machine-*
          path: samples
          merge-multiple: false
      - name: Decompose prefill variance (within-host vs cross-host)
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${GITHUB_STEP_SUMMARY}"
          import glob, os, re, statistics as st, math
          by_machine = {}
          for fp in sorted(glob.glob("samples/**/samples-*.txt", recursive=True)):
              idx = re.sub(r"^samples-(.+)\.txt$", r"\1", os.path.basename(fp))
              vals = []
              for line in open(fp):
                  parts = line.split()
                  if len(parts) >= 2:
                      try:
                          v = float(parts[1])
                          if v > 0: vals.append(v)
                      except ValueError:
                          pass
              if vals: by_machine[idx] = vals

          def cv(xs):
              m = st.mean(xs)
              return (st.pstdev(xs)/m*100.0) if m else float("nan")

          print("## Gemma prefill variance: how much survives the paired baseline")
          print()
          print("Prefill = one cold 512-token forward per process (the scored shape).")
          print()
          print("| machine | n | mean s/tok | tok/s | within-host CV | min | max | max/min |")
          print("|---|---|---|---|---|---|---|---|")
          machine_means = []
          within_cvs = []
          pooled = []
          adj_ratios = []      # consecutive same-host pass ratios  -> pairing residual (short gap)
          span_ratios = []     # first-vs-last same-host ratio       -> pairing residual (max in-job drift)
          for idx in sorted(by_machine):
              xs = by_machine[idx]
              machine_means.append(st.mean(xs))
              within_cvs.append(cv(xs))
              pooled.extend(xs)
              for a, b in zip(xs, xs[1:]):
                  adj_ratios.append(b/a)
              span_ratios.append(xs[-1]/xs[0])
              print(f"| {idx} | {len(xs)} | {st.mean(xs):.5f} | {1/st.mean(xs):.2f} | {cv(xs):.1f}% | {min(xs):.5f} | {max(xs):.5f} | {max(xs)/min(xs):.2f}x |")

          print()
          if len(machine_means) >= 2 and pooled:
              raw = cv(pooled)
              cross = cv(machine_means)                    # host lottery: pairing removes this
              within = st.mean(within_cvs)                 # same-host noise: pairing keeps this
              # paired = ratio of two independent same-host cold samples ~ within*sqrt(2)
              pred_resid = within*math.sqrt(2)
              emp_adj = cv(adj_ratios)*math.sqrt(1) if adj_ratios else float("nan")
              print("### Variance decomposition")
              print()
              print(f"- **RAW pooled CV** (all machines, all passes): **{raw:.1f}%**  <- the scary number")
              print(f"- cross-host CV (spread of per-machine means): **{cross:.1f}%**  <- pairing CANCELS this")
              print(f"- within-host CV (avg per-machine, same host): **{within:.1f}%**  <- pairing KEEPS this")
              print()
              print("### What survives the paired baseline (same-host ratio)")
              print()
              print(f"- predicted residual (within-host x sqrt2): **~{pred_resid:.1f}%**")
              print(f"- empirical, consecutive same-host pass ratios: CV **{cv(adj_ratios):.1f}%** (n={len(adj_ratios)}), max/min {max(adj_ratios)/min(adj_ratios):.2f}x")
              sr_dev = [abs(r-1)*100 for r in span_ratios]
              print(f"- empirical, first-vs-last same-host ratio (max in-job drift): mean |dev| {st.mean(sr_dev):.1f}%, worst {max(sr_dev):.1f}%")
              print()
              share = (cross*cross)/(cross*cross+within*within)*100 if (cross or within) else float("nan")
              print(f"> Of the raw prefill variance, ~**{share:.0f}%** is cross-host (removed by pairing) and ~**{100-share:.0f}%** is within-host (survives).")
              print(">")
              print("> NOTE: consecutive passes are ~40 s apart; the real baseline/candidate")
              print("> gap is minutes (separate build+transform between them), so the true")
              print("> surviving residual is >= the consecutive-pass number and closer to the")
              print("> first-vs-last figure. Decode is stable (3.5% CV, measured separately).")
          print()
          PY
      - name: Upload combined
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-prefill-variance-${{ github.run_id }}-combined
          path: samples
          if-no-files-found: warn
          retention-days: 14
