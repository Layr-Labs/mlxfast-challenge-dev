name: benchmark

# DEFAULT RANKED TRACK: Gemma 4 31B-IT MTP (track id gemma4-31b-it-mtp-v1).
#
# This is the Yukon-default ranked entrypoint declared by benchmark.json.
# It runs the trusted organizer-assistant block protocol described in
# docs/experimental-mtp-track.md and pinned by
# fixtures/gemma_4_31b_it_mtp_track.json. The former serial ranked workflow
# remains available as serial-benchmark.yml with its own manifest,
# benchmark.serial.json; its score and baseline are never mixed into this
# track.
#
# ENABLEMENT STATE: the track is live and is the default. The "Enforce MTP
#   track enablement" step remains the standing fail-closed guard: it rejects
#   a reverted contract, disabled publication, empty hidden-golden pins, or
#   an explicitly disabled dispatch. The dispatch input defaults to true
#   because Yukon's GitHub Actions provider dispatches the manifest workflow
#   without custom inputs. For submissions/* the contract is read from
#   trusted main, so a submission cannot flip the track on or off.
#
# ADOPTED SCORING (2026-07-14 scoring-decision memo; mirrors the serial
#   track's paired mechanics):
#   - ranked decode window: 512 parent-counted tokens (contract max);
#   - aggregation: RATIO-OF-MEANS across accepted pairs —
#       score = mean(serial s/tok) / mean(mtp s/tok);
#   - floor: aggregate >= 1.0 (floor applies to the aggregate, not per pair);
#   - pairs: minimum 3 accepted, target 4, alternating order;
#   - stall guardrail: a run with max block latency > 4x its p50 is rejected
#     as measurement-invalid, with one gated retry (owned by measure-mtp-job,
#     same class as its throttle rejection);
#   - hard exact returned-token-ID gate across every timed run (parity_all_ok).
#
# WHAT A LIVE RUN DOES:
#   1. Verifies the operator-provisioned 31B-IT target + assistant caches
#      against the checked-in byte manifests (every file, every run).
#   2. Builds the candidate through the bench-exec bridge and transforms the
#      IT target source into mtp-weights (sandboxed, network-denied).
#   3. Runs the untimed MTP correctness/parity gate: one full-length
#      mtp-benchmark pass over the hidden IT correctness golden. The trusted
#      parent (GemmaRuntimeMTP) owns the timer, the serial oracle, and the
#      denominator; a single divergent token fails the run. Report stdout is
#      sealed in the trusted shell exactly like the serial gates score.
#   4. Runs a separate untimed semantic GPQA backstop through fresh
#      Gemma4TrainedMTPBlockSession workers. These semantic-only prompts have
#      no exact-token oracle and are distinct from the correctness golden;
#      failure is secondary and cannot rescue the exact-token gate above.
#   5. Scrubs hidden material back to the post-transform snapshot, reaps
#      bench processes, and waits for quiescence.
#   6. Runs the timed paired measurement LAST via the box-owned
#      MLXFAST_MTP_MEASURE_JOB (fixed 40C thermal contract, 2 Hz macmon
#      telemetry, throttle/telemetry rejection). Pairing discipline mirrors
#      the serial track: the decode-only denominator is the trusted serial
#      K=1 target decode (the mtp-probe path) executed from the PINNED,
#      operator-owned MTP baseline tree; the numerator is the candidate's
#      mtp-benchmark decode over the SAME hidden benchmark golden, same
#      session, same silicon, alternating order, at least
#      MLXFAST_MTP_MIN_ACCEPTED_PAIRS accepted pairs. Worker-reported timing
#      has no authority anywhere; the parent divides its own wall time by
#      its own configured token total.
#   7. Applies the decode-only score contract in the trusted shell:
#        score = mtp_decode_speedup
#              = mean(serial s/tok over accepted pairs)
#                / mean(mtp s/tok over accepted pairs)   [ratio-of-means]
#        floor >= 1.0 on that aggregate, hard;
#        exact-token gate: parity_all_ok must be true across every timed run.
#      There is no prefill component: the MTP protocol charges seed prefill
#      inside the decode measurement.
#
# HOST CONTRACT (operator-provisioned, janitor-audited; consumed, never
# installed, by this workflow — see docs/mtp-track-golive-runbook.md):
#   MLXFAST_MTP_TARGET_DIR / MLXFAST_MTP_ASSISTANT_DIR
#       Read-only runner-owned caches holding exactly the files pinned by
#       fixtures/mtp_gemma_4_31b_it_4bit.sha256 and
#       fixtures/mtp_gemma_4_31b_it_assistant_qat4bit.sha256 (setup-mtp.sh
#       layout).
#   MLXFAST_MTP_BASELINE_WS
#       Pinned prebuilt challenge-repo tree (trusted ref) with mtp-weights
#       already transformed; the serial mtp-probe denominator runs from
#       here, never from the candidate workspace, so a submission cannot
#       slow the reference to inflate its ratio.
#   MLXFAST_MTP_BASELINE_CALIBRATION
#       Operator calibration (fresh gated sessions, recorded by the validated
#       operator procedure at a ref containing the block-0 stall fix) with sanity bands
#       for the serial denominator.
#   MLXFAST_MTP_MEASURE_JOB
#       Box-owned timing wrapper (sibling of measure-job.sh) with the same
#       FIXED, non-overridable thermal-stability contract: per-phase
#       quiescence + reap, GPU < 40C gate before every timed phase (900 s
#       ceiling), 2 Hz macmon telemetry, throttle/telemetry rejection, one
#       gated retry, the 4x-p50 stall-guardrail rejection (also one gated
#       retry), baseline calibration band check, alternating-order pairs
#       (target --target-pairs, minimum --min-pairs accepted), per-side
#       BENCH_GOLDEN_PATH worker denial of the hidden benchmark golden, and
#       a sealed results.json whose aggregate carries the per-side
#       seconds/token means consumed by "Compute MTP score" below.
#
# Dispatch-only, same self-hosted safety rules as the serial pipeline: no
# PR/push triggers, refs restricted to main, submissions/*, baseline/*, and
# yukon/baseline/*. Submission branches contribute only the exact dispatched
# SHA's editablePaths over trusted main. Submitted-process logs are
# suppressed on submission branches. The static review runs with the MTP
# track policy (MLXFAST_SUBMISSION_TRACK_ID=gemma4-31b-it-mtp-v1).
on:
  workflow_dispatch:
    inputs:
      confirm_track_enabled:
        description: "Standing MTP enablement interlock. Defaults on for Yukon; set false only to verify fail-closed rollback."
        required: false
        default: true
        type: boolean
      run_benchmark:
        description: "Run the timed paired MTP measurement after the correctness/parity gate. false = correctness/parity only."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mlxfast-mtp-ranked-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  mtp-ranked:
    name: "single-machine MTP ranked benchmark (m5-bench)"
    runs-on: [self-hosted, m5-bench]
    # Job budget: build (~15m) + IT transform (~10m) + artifact hashing of
    # the 18.4 GB source (~3m) + full-length parity pass (~15m) + five
    # isolated semantic-case model loads/decodes + private judge + cooldowns
    # (up to 900s per timed phase) + >=3 alternating timed pairs. Generous
    # until the track has complete semantic-path timing history.
    timeout-minutes: 360
    environment: benchmark-private-prompts
    env:
      # --- Host contract (see header; operator-provisioned, janitor-audited).
      MLXFAST_BENCH_EXEC: /opt/bench/bench-exec.sh
      MLXFAST_JANITOR: /opt/bench/janitor.sh
      MLXFAST_QUARANTINE_FLAG: /opt/bench/quarantine.flag
      MLXFAST_MACMON: /opt/bench-runner/bin/macmon
      MLXFAST_MTP_MEASURE_JOB: /opt/bench-runner/measure-mtp-job.sh
      MLXFAST_MTP_BASELINE_WS: /opt/bench-runner/mtp-baseline/current
      MLXFAST_MTP_BASELINE_CALIBRATION: /opt/bench-runner/state/mtp-baseline-calibration.json
      MLXFAST_MEASURE_STATE_DIR: /opt/bench-runner/state
      MLXFAST_MTP_TARGET_DIR: /opt/bench-runner/cache/mtp/gemma4-31b-it-mtp-v1/target
      MLXFAST_MTP_ASSISTANT_DIR: /opt/bench-runner/cache/mtp/gemma4-31b-it-mtp-v1/assistant
      # Bench workspace: distinct stable path from the serial track's
      # ranked-current (same /Users/Shared/bench-jobs confinement contract,
      # same absolute-path build-cache reasoning as serial-benchmark.yml).
      MLXFAST_JOB_WS: /Users/Shared/bench-jobs/mtp-ranked-current
      # --- Runner-only private material (0700 runner).
      MLXFAST_PRIVATE_DIR: /private/tmp/mlxfast-mtp-private-${{ github.run_id }}-${{ github.run_attempt }}
      MLXFAST_MTP_SEMANTIC_GPQA_RESULTS_PATH: /private/tmp/mlxfast-mtp-private-${{ github.run_id }}-${{ github.run_attempt }}/mtp_semantic_gpqa_results.json
      # Distinct from the serial track's artifact run root while satisfying
      # stage-benchmark-artifacts.sh's /tmp/mlxfast-artifacts- prefix contract
      # (run component "mtp-<run>-<attempt>").
      MLXFAST_ARTIFACT_ROOT: /tmp/mlxfast-artifacts-mtp-${{ github.run_id }}-${{ github.run_attempt }}
      MLXFAST_MEASURE_OUT: /tmp/mlxfast-mtp-measure-${{ github.run_id }}-${{ github.run_attempt }}
      # --- Track contract.
      MLXFAST_MTP_TRACK_ID: gemma4-31b-it-mtp-v1
      MLXFAST_MTP_CONTRACT_PATH: fixtures/gemma_4_31b_it_mtp_track.json
      MLXFAST_MTP_TARGET_MANIFEST_PATH: fixtures/mtp_gemma_4_31b_it_4bit.sha256
      MLXFAST_MTP_ASSISTANT_MANIFEST_PATH: fixtures/mtp_gemma_4_31b_it_assistant_qat4bit.sha256
      # Decode-only score contract (adopted 2026-07-14; see header). Keep in
      # sync with the contract fixture's proposed_scoring block; the floor is
      # HARD (an MTP submission that is not actually faster than trusted
      # serial decode does not rank) and applies to the ratio-of-means
      # aggregate over the accepted pairs.
      MLXFAST_MTP_BLOCK_SIZE: "4"
      MLXFAST_MTP_DECODE_TOKENS: "512"
      MLXFAST_MTP_CORRECTNESS_TOKENS: "512"
      MLXFAST_MTP_DECODE_SPEEDUP_FLOOR: "1.0"
      MLXFAST_MTP_MIN_ACCEPTED_PAIRS: "3"
      MLXFAST_MTP_TARGET_PAIRS: "4"
      # Hidden IT-target golden pins, frozen 2026-07-15 on M5 silicon from the
      # pinned IT target at the post-stall-fix tip (validated freeze record in
      # the operator private store) and validated for the
      # live default MTP workflow. If a future serving-stack rotation changes
      # a near-tie argmax, operators regenerate the goldens and update these
      # pins before serving submissions. The enablement gate fails closed if
      # any pin is emptied. (The R2 object KEYS are deliberately scoped to
      # the one trusted download step, exactly like the serial pipeline.)
      MLXFAST_MTP_CORRECTNESS_GOLDEN_SHA256: d4fff3fe015123c395be68cb19401709ec288e44a04e52c2ea36c32220356862
      MLXFAST_MTP_CORRECTNESS_GOLDEN_BYTES: "14683"
      MLXFAST_MTP_BENCH_GOLDEN_SHA256: a472d6e40c3bada936fa39535753fec609d836e709db03274222a4a303ae6f58
      MLXFAST_MTP_BENCH_GOLDEN_BYTES: "14982"
      # The semantic reference is the existing model-independent private GPQA
      # question/answer object used by the serial workflow. Its model-specific
      # accepted token sequences are parsed but ignored by MTP semantic capture.
      # These repository pins identify that frozen object. The 1-of-5 minimum is
      # the existing serial policy floor reused as a conservative catastrophe
      # backstop; it is NOT an IT/Opus M5 calibration or a quality-equivalence
      # claim between serial and trained-MTP generation.
      MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_SHA256: fc8bcdaff94aa89b2fc2a1a2adc28943ed026899ae805b3c52b3f81a235c20ff
      MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_BYTES: "9919"
      MLXFAST_MTP_SEMANTIC_GPQA_CASE_COUNT: "5"
      MLXFAST_MTP_SEMANTIC_GPQA_MAX_NEW_TOKENS: "64"
      MLXFAST_MTP_SEMANTIC_GPQA_MIN_PASS: "1"
      MLXFAST_MTP_SEMANTIC_GPQA_MODEL: claude-opus-4-8
      # Paired semantic floor (WARN-ONLY first release; flip
      # MLXFAST_MTP_SEMANTIC_GPQA_PAIRED_ENFORCE to "1" only after the
      # operator has judged reference captures across enough sessions to
      # calibrate the delta). The judge gates on
      # candidate_pass >= max(reference_pass - delta, MIN_PASS) with a
      # reference-min session-validity guard; reference capture is
      # best-effort until the pinned baseline tree is rotated to a ref that
      # ships mtp-generate-gpqa-answers.
      MLXFAST_MTP_SEMANTIC_GPQA_PAIRED_DELTA: "1"
      MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_MIN_PASS: "1"
      MLXFAST_MTP_SEMANTIC_GPQA_PAIRED_ENFORCE: "0"
      # Untimed extended correctness legs. The block-size sweep re-runs the
      # exact-token gate at additional protocol block sizes (fail-closed,
      # exact-token, no new artifacts needed); empty the list to disable in
      # an emergency. The sweep uses a shorter decode total to bound job
      # time; the base 512-token leg above remains authoritative.
      MLXFAST_MTP_GATE_BLOCK_SIZE_SWEEP: "2 3"
      MLXFAST_MTP_GATE_SWEEP_TOKENS: "128"
      # Hidden sliding-window-wrap correctness golden (final offset past the
      # 1,024-position ring-buffer wrap; see
      # MLXFastConstants.experimentalMTPMaxConfiguredTotalTokens). The leg is
      # SKIPPED with a notice while these pins are empty; once the operator
      # provisions and pins the R2 object the leg becomes a fail-closed
      # exact-token gate. A non-empty pin that mismatches the download fails
      # the run.
      MLXFAST_MTP_WRAP_GOLDEN_SHA256: ""
      MLXFAST_MTP_WRAP_GOLDEN_BYTES: ""
      MLXFAST_MTP_WRAP_GOLDEN_TOKENS: "1536"
      # Per-run rotation of the untimed correctness gate: a pinned pool
      # manifest plus deterministic selection keyed on run id/attempt. Only
      # the UNTIMED gate rotates; the timed benchmark golden stays fixed
      # (rotating it would force baseline recalibration). Members without
      # operator-provisioned pins are skipped by the selector.
      MLXFAST_MTP_GATE_ROTATION_POOL: fixtures/mtp_correctness_gate_rotation_pool.json
      # Untimed in-session reference oracle replay: the pinned baseline tree
      # replays a prefix of the frozen correctness golden; divergence is
      # classified as INFRASTRUCTURE drift, never a candidate failure.
      MLXFAST_MTP_REFERENCE_REPLAY_TOKENS: "128"
      # --- Benchmark plumbing (shared with serial-benchmark.yml).
      MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
      MLXFAST_PRIVATE_PROMPTS_R2_PRESENT: ${{ (secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_BUCKET_ENDPOINT != '' && secrets.R2_SECRET_ACCESS_KEY != '') && '1' || '0' }}
      MLXFAST_ANTHROPIC_PRESENT: ${{ secrets.ORG_ANTHROPIC_API_KEY != '' && '1' || '0' }}
      MLXFAST_RUN_BENCHMARK: ${{ inputs.run_benchmark && '1' || '0' }}
      MLXFAST_CANDIDATE_SHA: ${{ github.sha }}
      MLXFAST_IS_SUBMISSION_BRANCH: ${{ startsWith(github.ref, 'refs/heads/submissions/') && '1' || '0' }}
      # Same operator-pinned Metal toolchain as the serial ranked build.
      MLXFAST_METAL_TOOLCHAIN_IDENTIFIER: com.apple.dt.toolchain.Metal.32023.883
    steps:
      # Fail fast if the box is quarantined or the isolation stack is missing,
      # before any checkout or secret use. MTP-specific host paths are only
      # asserted after the standing enablement interlock.
      - name: Host preflight
        run: |
          set -euo pipefail
          echo "host=$(hostname) chip=$(sysctl -n machdep.cpu.brand_string) user=$(id -un) uid=$(id -u)"
          if [[ -e "${MLXFAST_QUARANTINE_FLAG}" ]]; then
            echo "::error::box is quarantined (${MLXFAST_QUARANTINE_FLAG}); janitor detected drift -- see RUNBOOK" >&2
            exit 1
          fi
          test -e "${MLXFAST_BENCH_EXEC}" || { echo "::error::bench-exec bridge missing" >&2; exit 1; }
          test -e "${MLXFAST_JANITOR}" || { echo "::error::janitor missing" >&2; exit 1; }

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Submission branches contribute editable paths only; trusted main
          # is the harness/workflow/contract base (including the standing
          # fixture read below). Main, baseline/*, and yukon/baseline/* run
          # their exact SHA.
          ref: ${{ startsWith(github.ref, 'refs/heads/submissions/') && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce trusted workflow context
        run: .github/scripts/enforce-trusted-benchmark-workflow.sh

      # Standing fail-closed gate. Order matters: this runs before any secret
      # use, submitted-code handling, or bench execution.
      - name: Enforce MTP track enablement
        env:
          CONFIRM_TRACK_ENABLED: ${{ inputs.confirm_track_enabled && '1' || '0' }}
        run: |
          set -euo pipefail
          test -s "${MLXFAST_MTP_CONTRACT_PATH}"
          track_id="$(jq -r '.track_id' "${MLXFAST_MTP_CONTRACT_PATH}")"
          if [[ "${track_id}" != "${MLXFAST_MTP_TRACK_ID}" ]]; then
            echo "::error::contract track_id ${track_id} does not match workflow track ${MLXFAST_MTP_TRACK_ID}" >&2
            exit 1
          fi
          scoring_enabled="$(jq -r '.official_scoring_enabled' "${MLXFAST_MTP_CONTRACT_PATH}")"
          publication_allowed="$(jq -r '.reference_baseline.publication_allowed' "${MLXFAST_MTP_CONTRACT_PATH}")"
          if [[ "${scoring_enabled}" != "true" || "${publication_allowed}" != "true" ]]; then
            echo "::error::MTP track ${MLXFAST_MTP_TRACK_ID} live contract is disabled or inconsistent (official_scoring_enabled=${scoring_enabled}, reference_baseline.publication_allowed=${publication_allowed}); restore both trusted fields on main before serving submissions" >&2
            exit 1
          fi
          for pin_name in \
            MLXFAST_MTP_CORRECTNESS_GOLDEN_SHA256 \
            MLXFAST_MTP_CORRECTNESS_GOLDEN_BYTES \
            MLXFAST_MTP_BENCH_GOLDEN_SHA256 \
            MLXFAST_MTP_BENCH_GOLDEN_BYTES \
            MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_SHA256 \
            MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_BYTES \
            MLXFAST_MTP_SEMANTIC_GPQA_MIN_PASS; do
            if [[ -z "${!pin_name}" ]]; then
              echo "::error::hidden MTP correctness/semantic configuration ${pin_name} is empty; restore the validated operator pin/value before serving submissions" >&2
              exit 1
            fi
          done
          if [[ ! "${MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_SHA256}" =~ ^[0-9a-f]{64}$ ]] \
              || [[ ! "${MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_BYTES}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::MTP semantic GPQA reference digest/size configuration is malformed" >&2
            exit 1
          fi
          if [[ ! "${MLXFAST_MTP_SEMANTIC_GPQA_MIN_PASS}" =~ ^[1-9][0-9]*$ ]] \
              || (( MLXFAST_MTP_SEMANTIC_GPQA_MIN_PASS > MLXFAST_MTP_SEMANTIC_GPQA_CASE_COUNT )); then
            echo "::error::MTP semantic GPQA non-inferiority threshold is missing or outside the configured case count" >&2
            exit 1
          fi
          # Optional wrap-golden pins: both empty (leg skipped) or both
          # well-formed (leg enabled). One-sided or malformed pins fail
          # closed rather than silently skipping a provisioned leg.
          if [[ -n "${MLXFAST_MTP_WRAP_GOLDEN_SHA256}" || -n "${MLXFAST_MTP_WRAP_GOLDEN_BYTES}" ]]; then
            if [[ ! "${MLXFAST_MTP_WRAP_GOLDEN_SHA256}" =~ ^[0-9a-f]{64}$ ]] \
                || [[ ! "${MLXFAST_MTP_WRAP_GOLDEN_BYTES}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::MTP wrap-golden pins are partially set or malformed; set both MLXFAST_MTP_WRAP_GOLDEN_SHA256 and MLXFAST_MTP_WRAP_GOLDEN_BYTES or clear both" >&2
              exit 1
            fi
          fi
          if [[ ! "${MLXFAST_MTP_WRAP_GOLDEN_TOKENS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::MLXFAST_MTP_WRAP_GOLDEN_TOKENS must be a positive integer" >&2
            exit 1
          fi
          test -s "${MLXFAST_MTP_GATE_ROTATION_POOL}"
          if [[ "${CONFIRM_TRACK_ENABLED}" != "1" ]]; then
            echo "::error::MTP default-track interlock is disabled; dispatch requires confirm_track_enabled=true" >&2
            exit 1
          fi
          echo "mtp-benchmark: track ${MLXFAST_MTP_TRACK_ID} enablement verified"

      # MTP-specific host contract, asserted after the standing interlock.
      - name: MTP host preflight
        run: |
          set -euo pipefail
          test -x "${MLXFAST_MTP_MEASURE_JOB}" || { echo "::error::measure-mtp-job missing" >&2; exit 1; }
          test -x "${MLXFAST_MACMON}" || { echo "::error::macmon missing" >&2; exit 1; }
          test -f "${MLXFAST_MTP_TARGET_DIR}/config.json" || { echo "::error::MTP target cache missing" >&2; exit 1; }
          test -f "${MLXFAST_MTP_ASSISTANT_DIR}/config.json" || { echo "::error::MTP assistant cache missing" >&2; exit 1; }
          if [[ "${MLXFAST_RUN_BENCHMARK}" == "1" ]]; then
            test -d "${MLXFAST_MTP_BASELINE_WS}" || { echo "::error::pinned MTP baseline workspace missing" >&2; exit 1; }
            test -s "${MLXFAST_MTP_BASELINE_CALIBRATION}" || { echo "::error::MTP baseline calibration missing" >&2; exit 1; }
          fi

      - name: Capture candidate commit
        id: candidate_context
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate SHA must be an exact 40-character lowercase commit SHA" >&2
            exit 1
          fi
          trusted_main_sha="$(git rev-parse HEAD)"
          printf '%s\n' "${CANDIDATE_SHA}" > candidate.sha
          printf 'trusted_main_sha=%s\n' "${trusted_main_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout submitted editable paths
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          path: .mlxfast-submission-src
          fetch-depth: 0
          persist-credentials: false

      - name: Verify submitted commit and modifiable surface
        id: verify_submission
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        env:
          SUBMISSION_REF: ${{ github.sha }}
          TRUSTED_MAIN_SHA: ${{ steps.candidate_context.outputs.trusted_main_sha }}
        run: |
          set -euo pipefail
          hardened_git="${GITHUB_WORKSPACE}/.github/scripts/hardened-git.sh"
          actual_sha="$("${hardened_git}" -C .mlxfast-submission-src rev-parse HEAD)"
          if [[ "${actual_sha}" != "${SUBMISSION_REF}" ]]; then
            echo "::error::submitted checkout resolved to ${actual_sha}, expected ${SUBMISSION_REF}" >&2
            exit 1
          fi
          if ! "${hardened_git}" -C .mlxfast-submission-src cat-file -e "${TRUSTED_MAIN_SHA}^{commit}"; then
            echo "::error::submitted checkout cannot resolve trusted main commit ${TRUSTED_MAIN_SHA}" >&2
            exit 1
          fi
          base_sha="$("${hardened_git}" -C .mlxfast-submission-src merge-base "${TRUSTED_MAIN_SHA}" "${actual_sha}")"
          if [[ "${base_sha}" != "${TRUSTED_MAIN_SHA}" ]]; then
            echo "::error::submission must be based on current trusted main ${TRUSTED_MAIN_SHA}; merge-base is ${base_sha}" >&2
            exit 1
          fi
          (
            cd .mlxfast-submission-src
            BASE_SHA="${base_sha}" HEAD_SHA="${actual_sha}" \
              "${GITHUB_WORKSPACE}/.github/scripts/enforce-modifiable-surface.sh"
          )
          if ! "${hardened_git}" cat-file -e "${actual_sha}^{commit}"; then
            "${hardened_git}" fetch --no-tags .mlxfast-submission-src "${actual_sha}"
          fi
          "${hardened_git}" cat-file -e "${actual_sha}^{commit}"
          printf 'base_sha=%s\n' "${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "mtp-benchmark: verified submitted commit ${actual_sha} against base ${base_sha}"

      # Static review with the MTP-track policy: organizer-assistant,
      # target-verified block speculation is permitted; prompt lookup,
      # assistant substitution, unverified drafts, timing forgery, and
      # cross-request future state remain fail-worthy.
      - name: Review submitted code for benchmark bypasses (MTP policy)
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ORG_ANTHROPIC_API_KEY }}
          HEAD_SHA: ${{ github.sha }}
          REVIEW_BASE_SHA: ${{ steps.verify_submission.outputs.base_sha }}
        run: |
          set -euo pipefail
          (
            cd .mlxfast-submission-src
            MLXFAST_SUBMISSION_TRACK_ID="${MLXFAST_MTP_TRACK_ID}" \
            MLXFAST_SUBMISSION_REVIEW_BASE_SHA="${REVIEW_BASE_SHA}" \
              "${GITHUB_WORKSPACE}/.github/scripts/run-submission-static-review.sh"
          )

      - name: Overlay submitted editable paths
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        env:
          SUBMISSION_WORKTREE: .mlxfast-submission-src
        run: .github/scripts/overlay-editable-paths.sh

      - name: Remove submitted checkout
        if: ${{ always() && startsWith(github.ref, 'refs/heads/submissions/') }}
        run: |
          set -euo pipefail
          rm -rf .mlxfast-submission-src
          test ! -e .mlxfast-submission-src

      # Same Seatbelt-semantics probe as the serial pipeline: this host's
      # sandbox-exec must still deny golden reads, private-dir reads,
      # non-workspace writes, network, and fork/exec under a worker profile.
      - name: Probe runtime worker sandbox
        run: .github/scripts/probe-runtime-worker-sandbox.sh

      # The hidden MTP goldens come from R2 in both correctness-only and
      # timed dispatches, so the secrets must be present either way.
      - name: Check private material present
        run: |
          set -euo pipefail
          if [[ "${MLXFAST_PRIVATE_PROMPTS_R2_PRESENT}" != "1" ]]; then
            echo "::error::hidden MTP correctness and semantic fixtures require private R2 secrets" >&2
            exit 1
          fi
          if [[ "${MLXFAST_ANTHROPIC_PRESENT}" != "1" ]]; then
            echo "::error::MTP semantic GPQA gate requires ORG_ANTHROPIC_API_KEY" >&2
            exit 1
          fi

      # Full content hash of every target and assistant cache file against
      # the checked-in manifests, every run, plus a strict flat-inventory
      # check — a corrupted or swapped cache can never feed the transform or
      # the assistant load. (The runtime revalidates through
      # GemmaRuntimeMTPProvenance as well; this is the trusted-shell anchor.)
      - name: Verify MTP target and assistant caches against pinned manifests
        run: |
          set -euo pipefail
          verify_cache() {
            local manifest="$1" root="$2" label="$3"
            test -s "${manifest}"
            local failures=0 checked=0
            local expected_names=()
            while read -r want_hash want_bytes rel_path; do
              [[ -z "${want_hash}" || "${want_hash}" == \#* ]] && continue
              expected_names+=("${rel_path}")
              local path="${root}/${rel_path}"
              if [[ ! -f "${path}" || -L "${path}" ]]; then
                echo "::error::${label} file missing or not a regular file: ${rel_path}" >&2
                failures=$((failures + 1))
                continue
              fi
              local actual_bytes actual_hash
              actual_bytes="$(wc -c < "${path}" | tr -d ' ')"
              actual_hash="$(shasum -a 256 "${path}" | awk '{print $1}')"
              if [[ "${actual_bytes}" != "${want_bytes}" || "${actual_hash}" != "${want_hash}" ]]; then
                echo "::error::${label} file mismatch: ${rel_path}" >&2
                failures=$((failures + 1))
              fi
              checked=$((checked + 1))
            done < "${manifest}"
            while IFS= read -r existing; do
              local name found expected
              name="$(basename "${existing}")"
              found=0
              for expected in "${expected_names[@]}"; do
                if [[ "${name}" == "${expected}" ]]; then
                  found=1
                  break
                fi
              done
              if [[ "${found}" != "1" ]]; then
                echo "::error::unexpected file in ${label} cache: ${existing}" >&2
                failures=$((failures + 1))
              fi
            done < <(find "${root}" -mindepth 1 -maxdepth 1 -print)
            if [[ "${failures}" -ne 0 || "${checked}" -eq 0 ]]; then
              echo "::error::${label} cache failed manifest verification (checked=${checked} failures=${failures})" >&2
              exit 1
            fi
            echo "mtp-benchmark: ${label} cache verified against pinned manifest (${checked} files)"
          }
          verify_cache "${MLXFAST_MTP_TARGET_MANIFEST_PATH}" "${MLXFAST_MTP_TARGET_DIR}" "MTP target"
          verify_cache "${MLXFAST_MTP_ASSISTANT_MANIFEST_PATH}" "${MLXFAST_MTP_ASSISTANT_DIR}" "MTP assistant"

      # Trusted caches are RESTORE-ONLY here: only main-ref dispatches of the
      # legacy serial-benchmark.yml may save into the trusted cache namespaces (the
      # same anti-poisoning gate), and this workflow never saves at all.
      - name: Restore trusted SwiftPM dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
            .build-worker/checkouts
            .build-worker/repositories
            .build-worker/artifacts
            .build-worker/workspace-state.json
          key: swiftpm-trusted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Compute MLX Metal library cache fingerprint
        id: mlx_metallib_fingerprint
        run: |
          set -euo pipefail
          cmake_bin="$(command -v cmake 2>/dev/null || true)"
          if [[ -z "${cmake_bin}" ]]; then
            for candidate in /opt/homebrew/bin/cmake /usr/local/bin/cmake; do
              if [[ -x "${candidate}" ]]; then
                cmake_bin="${candidate}"
                break
              fi
            done
          fi
          test -x "${cmake_bin}"
          metal_toolchain_identifier="$(
            xcodebuild -showComponent MetalToolchain 2>/dev/null \
              | awk -F': ' '/Toolchain Identifier/ { print $2; exit }' \
              || true
          )"
          if [[ -n "${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" \
              && "${metal_toolchain_identifier}" != "${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" ]]; then
            echo "::error::installed Metal toolchain (${metal_toolchain_identifier:-none}) does not match the ranked pin (${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}); update the pin or the box deliberately" >&2
            exit 1
          fi
          # Same two-fingerprint scheme as the serial pipeline: the vendored
          # kernel sources of THIS (overlaid) work tree key the metallib
          # cache so a cached mlx.metallib can never mask participant kernel
          # edits; the base fingerprint keys the build-products caches.
          vendored_metal_fingerprint="$(tools/build-mlx-metallib.sh --print-fingerprint)"
          test "${#vendored_metal_fingerprint}" -eq 64
          base_fingerprint="$({
            printf '%s\n' mlx-metallib-m5-max-v2
            uname -m
            sysctl -n machdep.cpu.brand_string
            sw_vers -buildVersion
            xcodebuild -version
            printf 'METAL_TOOLCHAIN_IDENTIFIER=%s\n' "${metal_toolchain_identifier}"
            xcrun --sdk macosx --show-sdk-build-version
            if [[ -n "${metal_toolchain_identifier}" ]]; then
              TOOLCHAINS="${metal_toolchain_identifier}" xcrun -sdk macosx metal -v 2>&1
            else
              xcrun -sdk macosx metal -v 2>&1
            fi
            "${cmake_bin}" --version
            shasum -a 256 Package.swift Package.resolved tools/build-mlx-metallib.sh
          } | shasum -a 256 | awk '{print $1}')"
          test "${#base_fingerprint}" -eq 64
          fingerprint="$({
            printf 'BASE_FINGERPRINT=%s\n' "${base_fingerprint}"
            printf 'VENDORED_METAL_FINGERPRINT=%s\n' "${vendored_metal_fingerprint}"
          } | shasum -a 256 | awk '{print $1}')"
          test "${#fingerprint}" -eq 64
          printf 'sha256=%s\n' "${fingerprint}" >> "${GITHUB_OUTPUT}"
          printf 'base_sha256=%s\n' "${base_fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Restore trusted MLX Metal library cache
        id: restore_mlx_metallib_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .mlxfast-cache/mlx.metallib
            .mlxfast-cache/mlx.metallib.fingerprint
          key: mlx-metallib-m5-max-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.sha256 }}

      - name: Verify restored MLX Metal library
        env:
          CACHE_HIT: ${{ steps.restore_mlx_metallib_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" == "true" ]]; then
            test -s .mlxfast-cache/mlx.metallib
            test -s .mlxfast-cache/mlx.metallib.fingerprint
            expected_record="mlxfast-metallib-fingerprint-v1 $(tools/build-mlx-metallib.sh --print-fingerprint)"
            restored_record="$(cat .mlxfast-cache/mlx.metallib.fingerprint)"
            if [[ "${restored_record}" != "${expected_record}" ]]; then
              echo "::warning::restored mlx.metallib does not match the vendored Metal sources in this work tree; discarding it so the bench build recompiles"
              /bin/rm -f .mlxfast-cache/mlx.metallib .mlxfast-cache/mlx.metallib.fingerprint
            fi
          else
            /bin/rm -f .mlxfast-cache/mlx.metallib .mlxfast-cache/mlx.metallib.fingerprint
          fi

      - name: Reset staged trusted build products
        run: /bin/rm -rf .mlxfast-cache/trusted-build .mlxfast-cache/worker-build

      - name: Restore trusted build products cache
        id: restore_build_products_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mlxfast-cache/trusted-build
          key: bench-trusted-build-products-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.base_sha256 }}

      - name: Restore worker build products cache
        id: restore_worker_build_products_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mlxfast-cache/worker-build
          key: bench-worker-build-products-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.base_sha256 }}

      - name: Verify restored build products
        env:
          TRUSTED_CACHE_HIT: ${{ steps.restore_build_products_cache.outputs.cache-hit }}
          WORKER_CACHE_HIT: ${{ steps.restore_worker_build_products_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "${TRUSTED_CACHE_HIT}" == "true" ]]; then
            test -d .mlxfast-cache/trusted-build/release
          else
            /bin/rm -rf .mlxfast-cache/trusted-build
          fi
          if [[ "${WORKER_CACHE_HIT}" == "true" ]]; then
            test -d .mlxfast-cache/worker-build/release
          else
            /bin/rm -rf .mlxfast-cache/worker-build
          fi

      # Same workspace discipline as the serial pipeline: proven-fresh stable
      # path, trusted resolve while networked, bench ACL grant, then explicit
      # bench-deny of every trusted surface (including fixtures/, which
      # carries the MTP contract and manifests) and a runner-owned
      # bench-NON-writable staging dir for the predictable-name hidden golden.
      - name: Prepare bench workspace
        run: |
          set -euo pipefail
          rm -rf "${MLXFAST_JOB_WS}" || true
          if [[ -e "${MLXFAST_JOB_WS}" || -L "${MLXFAST_JOB_WS}" ]]; then
            echo "::error::stale bench workspace at ${MLXFAST_JOB_WS} could not be fully removed; run the janitor and retry" >&2
            exit 1
          fi
          cp -c -R "${GITHUB_WORKSPACE}" "${MLXFAST_JOB_WS}" 2>/dev/null \
            || { rm -rf "${MLXFAST_JOB_WS}"; cp -R "${GITHUB_WORKSPACE}" "${MLXFAST_JOB_WS}"; }
          .github/scripts/hardened-git.sh -C "${MLXFAST_JOB_WS}" cat-file -e "${MLXFAST_CANDIDATE_SHA}^{commit}"
          .github/scripts/hardened-git.sh -C "${MLXFAST_JOB_WS}" update-ref --no-deref HEAD "${MLXFAST_CANDIDATE_SHA}"
          if [[ -d "${MLXFAST_JOB_WS}/.mlxfast-cache/trusted-build/release" ]]; then
            rm -rf "${MLXFAST_JOB_WS}/.build"
            mv "${MLXFAST_JOB_WS}/.mlxfast-cache/trusted-build" "${MLXFAST_JOB_WS}/.build"
            echo "mtp-benchmark: seeded trusted build products into bench workspace"
          fi
          if [[ -d "${MLXFAST_JOB_WS}/.mlxfast-cache/worker-build/release" ]]; then
            rm -rf "${MLXFAST_JOB_WS}/.build-worker"
            mv "${MLXFAST_JOB_WS}/.mlxfast-cache/worker-build" "${MLXFAST_JOB_WS}/.build-worker"
            echo "mtp-benchmark: seeded worker build products into bench workspace"
          fi
          mkdir -p "${MLXFAST_PRIVATE_DIR}"
          chmod 700 "${MLXFAST_PRIVATE_DIR}"
          mkdir -p "${MLXFAST_JOB_WS}/private"
          mkdir -p "${MLXFAST_JOB_WS}/.mtp-ranked-src"
          # Resolve dependencies for both SwiftPM roots while still trusted
          # and networked (the bench uid has a PF egress block).
          (cd "${MLXFAST_JOB_WS}" && swift package resolve --force-resolved-versions)
          (cd "${MLXFAST_JOB_WS}" && swift package resolve --force-resolved-versions --scratch-path .build-worker)
          /bin/chmod -R +a "user:bench allow list,search,readattr,readextattr,read,execute,add_file,add_subdirectory,delete_child,write,append,writeattr,writeextattr,file_inherit,directory_inherit" "${MLXFAST_JOB_WS}"
          /bin/chmod -R +a "user:bench deny write,append,writeattr,writeextattr,delete,delete_child,add_file,add_subdirectory,chown,file_inherit,directory_inherit" \
            "${MLXFAST_JOB_WS}/.github" \
            "${MLXFAST_JOB_WS}/tools" \
            "${MLXFAST_JOB_WS}/Sources" \
            "${MLXFAST_JOB_WS}/correctness_prompts" \
            "${MLXFAST_JOB_WS}/fixtures" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src"
          /bin/chmod +a "user:bench deny write,append,writeattr,writeextattr,delete,chown" \
            "${MLXFAST_JOB_WS}/benchmark.sh" \
            "${MLXFAST_JOB_WS}/benchmark.json" \
            "${MLXFAST_JOB_WS}/setup-mtp.sh" \
            "${MLXFAST_JOB_WS}/Package.swift" \
            "${MLXFAST_JOB_WS}/Package.resolved"
          echo "mtp-benchmark: bench workspace ready at ${MLXFAST_JOB_WS} (trusted harness surfaces ACL-locked against bench writes)"

      # Same trusted-source-scope pin as the serial pipeline: the manifests
      # and the trusted-harness source trees the bench build will compile
      # must match the trusted git content byte for byte.
      - name: Verify trusted source scope
        run: .github/scripts/verify-trusted-source-scope.sh "${GITHUB_WORKSPACE}" "${MLXFAST_JOB_WS}"

      # Same conditional-until-live PF egress preflight as the serial
      # pipeline, run before the first execution of submission-built code.
      - name: Assert bench network egress lockdown
        run: |
          set -euo pipefail
          probe="$(cat <<'PROBE'
            set -u
            [ -x /usr/bin/curl ] || exit 2
            rc=1
            for target in https://1.1.1.1 https://8.8.8.8; do
              if /usr/bin/curl --silent --show-error --max-time 5 --output /dev/null "${target}" 2>/dev/null; then
                echo "bench egress reached ${target}"
                rc=0
                break
              fi
            done
            exit "${rc}"
          PROBE
          )"
          runner_egress=0
          for target in https://1.1.1.1 https://8.8.8.8; do
            if /usr/bin/curl --silent --max-time 5 --output /dev/null "${target}" 2>/dev/null; then
              runner_egress=1
              break
            fi
          done
          if [[ "${runner_egress}" -ne 1 ]]; then
            echo "::warning::bench egress preflight cannot assess PF lockdown (trusted-uid egress probe failed; box appears offline); continuing -- trusted network steps will fail closed if the box is truly offline"
            exit 0
          fi
          bench_rc=0
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" /bin/bash -c "${probe}" || bench_rc=$?
          if [[ "${bench_rc}" -eq 1 ]]; then
            echo "mtp-benchmark: bench network egress lockdown verified (bench-uid egress blocked)"
            exit 0
          fi
          if [[ "${bench_rc}" -ne 0 ]]; then
            echo "::warning::bench egress preflight cannot assess PF lockdown (bench probe exited ${bench_rc}: curl unavailable or bridge error); continuing without a verdict"
            exit 0
          fi
          pf_provisioned=0
          if grep -Eisq 'mlxfast|darkbloom|bench[-_.]?egress|egress[-_.]?bench|uid[-_.]?560|user[[:space:]]+bench|user[[:space:]]+560([^0-9]|$)' /etc/pf.conf /etc/pf.anchors/* 2>/dev/null; then
            pf_provisioned=1
          fi
          if [[ "${MLXFAST_REQUIRE_BENCH_EGRESS_LOCKDOWN:-0}" == "1" ]]; then
            pf_provisioned=1
          fi
          if [[ "${pf_provisioned}" -eq 1 ]]; then
            echo "::error::bench network egress is NOT locked down (a bench-uid outbound connection succeeded) although the PF bench-egress lockdown is provisioned on this box; refusing to run submitted code" >&2
            exit 1
          fi
          echo "::warning::PF bench-egress lockdown not yet active on this box; egress preflight is dormant (bench-uid egress currently open). It will enforce automatically once the operator ships the PF lockdown."

      # Same two-root build discipline as the serial pipeline: the trusted
      # CLI builds in .build and the participant worker (which compiles the
      # participant-editable vendored MLX forks) in its own .build-worker
      # scratch root, as two separate bench-exec invocations.
      - name: Build trusted CLI in bench sandbox
        env:
          BENCH_JOB_ID: mtp-ranked-${{ github.run_id }}-${{ github.run_attempt }}-build
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1="${MLXFAST_JOB_WS}/*" \
              MLXFAST_METAL_TOOLCHAIN_IDENTIFIER="${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" /bin/bash -c '
              set -euo pipefail
              cd "${MJOB_WS}"
              /usr/bin/swift build -c release --force-resolved-versions --product mlxfast-swift
            '
          test -x "${MLXFAST_JOB_WS}/.build/release/mlxfast-swift"
          # Pin the trusted timer/gates/score artifacts before the
          # participant worker build runs (same reasoning as the serial
          # pipeline: worker-build-time code execution must not be able to
          # alter the trusted binary between its build and its pin).
          .github/scripts/pin-trusted-harness.sh write \
            "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted

      - name: Build participant worker in bench sandbox
        env:
          BENCH_JOB_ID: mtp-ranked-${{ github.run_id }}-${{ github.run_attempt }}-buildworker
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1="${MLXFAST_JOB_WS}/*" \
              MLXFAST_METAL_TOOLCHAIN_IDENTIFIER="${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" /bin/bash -c '
              set -euo pipefail
              cd "${MJOB_WS}"
              /usr/bin/swift build -c release --force-resolved-versions --scratch-path .build-worker --product mlxfast-runtime-worker
              if [[ -s .mlxfast-cache/mlx.metallib && -s .mlxfast-cache/mlx.metallib.fingerprint ]]; then
                /bin/cp .mlxfast-cache/mlx.metallib .build-worker/release/mlx.metallib
                /bin/cp .mlxfast-cache/mlx.metallib.fingerprint .build-worker/release/mlx.metallib.fingerprint
                echo "mtp-benchmark: restored trusted MLX Metal library"
              else
                tools/build-mlx-metallib.sh
              fi
              /bin/chmod 0644 .build-worker/release/mlx.metallib .build-worker/release/mlx.metallib.fingerprint
            '
          test -x "${MLXFAST_JOB_WS}/.build-worker/release/mlxfast-runtime-worker"
          test -s "${MLXFAST_JOB_WS}/.build-worker/release/mlx.metallib"
          test -s "${MLXFAST_JOB_WS}/.build-worker/release/mlx.metallib.fingerprint"
          # Separate participant-worker attestation (TOCTOU defense): every
          # scored phase must execute exactly the worker binary and metallib
          # built from the reviewed source tree; the worker stays OUT of the
          # trusted pin.
          .github/scripts/pin-trusted-harness.sh write \
            "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # Transform the pinned 31B-IT target source (NOT the serial track's
      # base checkpoint) into the candidate's runtime weights.
      - name: Transform MTP target in bench sandbox
        env:
          BENCH_JOB_ID: mtp-ranked-${{ github.run_id }}-${{ github.run_attempt }}-transform
        run: |
          set -euo pipefail
          status=0
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" == "1" ]]; then
            echo "mtp-benchmark: running submitted transform with private process logs suppressed"
            # shellcheck disable=SC2024  # trusted shell owns the capture files
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" MLXFAST_MTP_TARGET_DIR="${MLXFAST_MTP_TARGET_DIR}" \
                MLXFAST_SANDBOX_PARENT_TOOLS=1 /bin/bash -c '
                set -euo pipefail
                cd "${MJOB_WS}"
                mkdir -p mtp-weights
                exec .build/release/mlxfast-swift transform \
                  --reference "${MLXFAST_MTP_TARGET_DIR}" \
                  --output mtp-weights
              ' > "${MLXFAST_PRIVATE_DIR}/transform-private.log" 2>&1 || status=$?
          else
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" MLXFAST_MTP_TARGET_DIR="${MLXFAST_MTP_TARGET_DIR}" \
                MLXFAST_SANDBOX_PARENT_TOOLS=1 /bin/bash -c '
                set -euo pipefail
                cd "${MJOB_WS}"
                mkdir -p mtp-weights
                exec .build/release/mlxfast-swift transform \
                  --reference "${MLXFAST_MTP_TARGET_DIR}" \
                  --output mtp-weights
              ' || status=$?
          fi
          test "${status}" -eq 0
          test -f "${MLXFAST_JOB_WS}/mtp-weights/config.json"

      - name: Hash transformed MTP weights for ranked audit
        run: .github/scripts/hash-weights-directory.sh "${MLXFAST_JOB_WS}/mtp-weights" mtp-weights.sha256

      # Record every file in the bench workspace BEFORE any hidden material
      # enters it, for the allowlist scrub before timing (same design and
      # same reasoning as the serial pipeline).
      - name: Snapshot post-transform workspace
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" /bin/bash -c '
              set -u
              if [ -d "${MJOB_WS}/tmp" ]; then
                find "${MJOB_WS}/tmp" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true
              fi
            '
          manifest="${MLXFAST_PRIVATE_DIR}/post-transform-manifest.nul"
          find_err="${MLXFAST_PRIVATE_DIR}/post-transform-find.err"
          set +e
          ( cd "${MLXFAST_JOB_WS}" && find . -mindepth 1 \( -type f -o -type l \) -print0 2> "${find_err}" ) \
            | LC_ALL=C sort -z > "${manifest}"
          set -e
          if [[ -s "${find_err}" ]]; then
            if grep -vq 'Permission denied' "${find_err}"; then
              echo "::error::workspace snapshot hit unexpected find errors (only bench-private Permission denied subtrees are tolerated):" >&2
              cat "${find_err}" >&2
              exit 1
            fi
            skipped="$(grep -c 'Permission denied' "${find_err}" | tr -d ' ')"
            echo "mtp-benchmark: snapshot skipped ${skipped} bench-private (0700) subtrees the runner cannot read; the scrub is equally blind there and end-of-job cleanup wipes them"
          fi
          test -s "${manifest}"
          count="$(tr -cd '\0' < "${manifest}" | wc -c | tr -d ' ')"
          echo "mtp-benchmark: snapshotted ${count} pre-hidden workspace files for the allowlist scrub"

      # Reap stragglers from the unsandboxed build/transform BEFORE hidden
      # material enters the workspace.
      - name: Reap lingering bench processes before hidden material
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /bin/bash "${MLXFAST_JOB_WS}/.github/scripts/reap-bench-processes.sh"

      # Trusted download + pin of the hidden IT-target goldens and the
      # model-independent semantic GPQA reference. Raw bytes live
      # runner-private; only the correctness golden is installed into
      # the workspace (into the bench-NON-writable .mtp-ranked-src staging
      # dir, symlink-guarded) before the exact gate. The semantic reference
      # stays in the runner-private directory until exact correctness passes,
      # so that worker cannot read the future secondary-gate answers. Each
      # worker Seatbelt profile denies its current private input by literal
      # path (BENCH_GOLDEN_PATH plus the CLI's blocked-path profile).
      # The benchmark golden never enters
      # the workspace here; measure-mtp-job installs and scrubs it per timed
      # side.
      - name: Prepare hidden MTP goldens
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_ENDPOINT: ${{ secrets.R2_BUCKET_ENDPOINT }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Private object keys scoped to this trusted download step only.
          MLXFAST_MTP_CORRECTNESS_GOLDEN_R2_PATH: correctness_prompts/mtp_correctness_golden_gemma4_31b_it-v1.json
          MLXFAST_MTP_BENCH_GOLDEN_R2_PATH: correctness_prompts/mtp_benchmark_golden_gemma4_31b_it-v1.json
          MLXFAST_MTP_SEMANTIC_GPQA_R2_PATH: correctness_prompts/gpqa_reference_cases-gemma.json
          MLXFAST_MTP_WRAP_GOLDEN_R2_PATH: correctness_prompts/mtp_correctness_golden_gemma4_31b_it_wrap-v1.json
        run: |
          set -euo pipefail
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_MTP_CORRECTNESS_GOLDEN_R2_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden.json"
          correctness_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden.json" | awk '{print $1}')"
          correctness_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden.json" | tr -d ' ')"
          if [[ "${correctness_hash}" != "${MLXFAST_MTP_CORRECTNESS_GOLDEN_SHA256}" || "${correctness_bytes}" != "${MLXFAST_MTP_CORRECTNESS_GOLDEN_BYTES}" ]]; then
            echo "::error::hidden MTP correctness golden pin mismatch" >&2
            exit 1
          fi
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_MTP_BENCH_GOLDEN_R2_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/mtp_benchmark_golden.json"
          bench_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/mtp_benchmark_golden.json" | awk '{print $1}')"
          bench_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/mtp_benchmark_golden.json" | tr -d ' ')"
          if [[ "${bench_hash}" != "${MLXFAST_MTP_BENCH_GOLDEN_SHA256}" || "${bench_bytes}" != "${MLXFAST_MTP_BENCH_GOLDEN_BYTES}" ]]; then
            echo "::error::hidden MTP benchmark golden pin mismatch" >&2
            exit 1
          fi
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_MTP_SEMANTIC_GPQA_R2_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json"
          chmod 0600 "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json"
          semantic_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json" | awk '{print $1}')"
          semantic_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json" | tr -d ' ')"
          if [[ "${semantic_hash}" != "${MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_SHA256}" \
              || "${semantic_bytes}" != "${MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_BYTES}" ]]; then
            echo "::error::hidden MTP semantic GPQA reference pin mismatch" >&2
            exit 1
          fi
          golden_dst="${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden.json"
          if [[ -e "${golden_dst}" || -L "${golden_dst}" ]]; then
            echo "::error::refusing to place hidden input over pre-existing path ${golden_dst}" >&2
            exit 1
          fi
          install -m 0444 "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden.json" "${golden_dst}"
          # --- Extended untimed correctness legs (wrap + rotation). These are
          # gate-only artifacts: they are staged into the bench-NON-writable
          # .mtp-ranked-src dir like the base golden, consumed only by the
          # extended-legs step, and scrubbed everywhere the base golden is.
          stage_extended_golden() {
            local src="$1" dst_name="$2"
            local dst="${MLXFAST_JOB_WS}/.mtp-ranked-src/${dst_name}"
            if [[ -e "${dst}" || -L "${dst}" ]]; then
              echo "::error::refusing to place hidden input over pre-existing path ${dst}" >&2
              exit 1
            fi
            install -m 0444 "${src}" "${dst}"
          }
          if [[ -n "${MLXFAST_MTP_WRAP_GOLDEN_SHA256}" ]]; then
            .github/scripts/download-r2-object.sh \
              "${MLXFAST_MTP_WRAP_GOLDEN_R2_PATH}" \
              "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden_wrap.json"
            wrap_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden_wrap.json" | awk '{print $1}')"
            wrap_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden_wrap.json" | tr -d ' ')"
            if [[ "${wrap_hash}" != "${MLXFAST_MTP_WRAP_GOLDEN_SHA256}" || "${wrap_bytes}" != "${MLXFAST_MTP_WRAP_GOLDEN_BYTES}" ]]; then
              echo "::error::hidden MTP wrap-golden pin mismatch" >&2
              exit 1
            fi
            stage_extended_golden \
              "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden_wrap.json" \
              mtp_correctness_golden_wrap.json
            echo "mtp-benchmark: sliding-window-wrap correctness golden staged (${MLXFAST_MTP_WRAP_GOLDEN_TOKENS} decode tokens)"
          else
            echo "::notice::MTP wrap-golden pins are empty; the >1024-final-offset correctness leg is SKIPPED until the operator provisions and pins ${MLXFAST_MTP_WRAP_GOLDEN_R2_PATH}"
          fi
          # Deterministic per-run rotation draw (auditable: seed and member id
          # are logged; the pool manifest is a public trusted fixture).
          rotation_seed=$((GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT))
          rotation_member="$(.github/scripts/select-mtp-gate-rotation.sh \
            "${MLXFAST_MTP_GATE_ROTATION_POOL}" "${rotation_seed}")"
          if [[ -n "${rotation_member}" && "${rotation_member}" != "{}" ]]; then
            rotation_id="$(jq -r '.id' <<< "${rotation_member}")"
            rotation_r2_key="$(jq -r '.r2_key' <<< "${rotation_member}")"
            rotation_sha="$(jq -r '.sha256' <<< "${rotation_member}")"
            rotation_bytes="$(jq -r '.bytes' <<< "${rotation_member}")"
            rotation_tokens="$(jq -r '.decode_tokens' <<< "${rotation_member}")"
            rotation_block_size="$(jq -r '.block_size' <<< "${rotation_member}")"
            .github/scripts/download-r2-object.sh \
              "${rotation_r2_key}" \
              "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden_rotation.json"
            rot_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden_rotation.json" | awk '{print $1}')"
            rot_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden_rotation.json" | tr -d ' ')"
            if [[ "${rot_hash}" != "${rotation_sha}" || "${rot_bytes}" != "${rotation_bytes}" ]]; then
              echo "::error::hidden MTP rotation-golden pin mismatch for member ${rotation_id}" >&2
              exit 1
            fi
            stage_extended_golden \
              "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden_rotation.json" \
              mtp_correctness_golden_rotation.json
            jq -n \
              --arg id "${rotation_id}" \
              --argjson tokens "${rotation_tokens}" \
              --argjson block_size "${rotation_block_size}" \
              '{id: $id, decode_tokens: $tokens, block_size: $block_size}' \
              > "${MLXFAST_PRIVATE_DIR}/mtp-rotation-leg.json"
            echo "mtp-benchmark: rotation leg drew member ${rotation_id} (seed=${rotation_seed}, tokens=${rotation_tokens}, block_size=${rotation_block_size})"
          else
            echo "::notice::MTP gate rotation pool has no provisioned members; the rotation leg is SKIPPED until the operator provisions and pins pool objects (seed=${rotation_seed})"
          fi
          echo "mtp-benchmark: hidden correctness, timing, and semantic fixtures verified"

      # TOCTOU guard: the submitted transform ran with workspace write access
      # since the post-build pins.
      - name: Verify trusted harness before MTP correctness gate
        run: |
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # UNTIMED in-session reference oracle replay: before judging the
      # candidate, the PINNED baseline tree (trusted operator artifact, the
      # same tree the timed denominator runs from) serially replays a prefix
      # of the frozen correctness golden via its own mtp-probe. The oracle is
      # a frozen file, so silent host drift (macOS/Metal/silicon updates
      # flipping a near-tie argmax) would otherwise surface as a candidate
      # token mismatch. Classification contract:
      #   - replay reproduces the golden  -> proceed;
      #   - replay DIVERGES from golden   -> INFRASTRUCTURE failure (the
      #     frozen oracle no longer matches the pinned reference on this
      #     box); the run fails as infra/non-candidate and the operator must
      #     re-freeze goldens before serving submissions;
      #   - replay cannot launch (missing baseline tree/binaries, sandbox or
      #     provisioning gap) -> loud warning + skip; this new step must not
      #     brick ranked runs on provisioning differences.
      # This step runs trusted (never through bench-exec): the baseline tree
      # is operator-owned reference code, exactly like the timed denominator.
      - name: MTP reference oracle replay (untimed)
        run: |
          set -euo pipefail
          replay_log="${MLXFAST_PRIVATE_DIR}/mtp-reference-replay.log"
          replay_stdout="${MLXFAST_PRIVATE_DIR}/mtp-reference-replay.stdout"
          baseline_cli="${MLXFAST_MTP_BASELINE_WS}/.build/release/mlxfast-swift"
          if [[ ! -x "${baseline_cli}" \
              || ! -d "${MLXFAST_MTP_BASELINE_WS}/mtp-weights" ]]; then
            echo "::warning::pinned MTP baseline tree is not runnable here (missing CLI or mtp-weights); SKIPPING the reference oracle replay"
            exit 0
          fi
          status=0
          # shellcheck disable=SC2024  # trusted shell owns the capture files
          ( cd "${MLXFAST_MTP_BASELINE_WS}" \
            && exec .build/release/mlxfast-swift mtp-probe \
              --weights mtp-weights \
              --golden "${MLXFAST_PRIVATE_DIR}/mtp_correctness_golden.json" \
              --block-size 1 \
              --tokens "${MLXFAST_MTP_REFERENCE_REPLAY_TOKENS}" \
          ) > "${replay_stdout}" 2> "${replay_log}" || status=$?
          if [[ "${status}" -eq 0 ]] \
              && jq -e '.all_tokens_matched == true' "${replay_stdout}" >/dev/null 2>&1; then
            echo "mtp-benchmark: reference oracle replay reproduced the frozen golden (${MLXFAST_MTP_REFERENCE_REPLAY_TOKENS} tokens)"
            exit 0
          fi
          if grep -q "mismatch at step" "${replay_log}" 2>/dev/null; then
            echo "::error::INFRASTRUCTURE: the pinned reference tree no longer reproduces the frozen MTP correctness golden in this session; this is host/reference drift, NOT a candidate failure. Quarantine ranked runs and re-freeze the hidden goldens before serving submissions." >&2
            exit 1
          fi
          echo "::warning::reference oracle replay could not complete (exit=${status}); SKIPPING (provisioning/launch issue, not classified as drift). Investigate the baseline tree before trusting this session's drift classification."
          exit 0

      # The untimed MTP correctness/parity gate: one full-length trained-MTP
      # pass over the hidden correctness golden. The trusted parent checks
      # every returned token against the serial oracle (a single divergence
      # fails), enforces the block protocol, and re-validates target and
      # assistant artifacts before and after load. Stdout (the diagnostic
      # report JSON) is sealed in this trusted shell; on-disk files are never
      # trusted. The explicit no-write flag strips injected-profile write
      # exceptions and permits only /dev/null, so exact-gate code cannot leave
      # prompt-derived markers for semantic or timed workers. Ordered BEFORE
      # the timed phase so a broken submission never burns gated thermal time.
      - name: MTP correctness and parity gate (untimed)
        env:
          BENCH_JOB_ID: mtp-ranked-${{ github.run_id }}-${{ github.run_attempt }}-gates
          # Worker Seatbelt literal deny for the hidden correctness golden:
          # only the harness parent may read it. Kept through sudo env_reset
          # via the sudoers env_keep list, exactly like the serial pipeline.
          BENCH_GOLDEN_PATH: ${{ env.MLXFAST_JOB_WS }}/.mtp-ranked-src/mtp_correctness_golden.json
        run: |
          set -euo pipefail
          raw_stdout="${MLXFAST_PRIVATE_DIR}/mtp-gates-stdout.raw"
          gates_log="${MLXFAST_PRIVATE_DIR}/mtp-gates-private.log"
          verdict="mtp-correctness-verdict.json"
          rm -f -- "${verdict}"
          trap 'rm -f -- "${raw_stdout}" "${gates_log}"' EXIT
          started="${SECONDS}"
          status=0
          # UNTIMED committed-KV audit (WARN-ONLY; see Constants.swift for the
          # calibration procedure). The flag is passed ONLY here, never to the
          # timed measure-mtp-job invocation. The reference workspace enables
          # the pinned-reference serial-replay comparison when the baseline
          # tree is runnable from the bench sandbox; every audit failure mode
          # degrades to a report status, never a gate failure.
          audit_reference_ws=""
          if [[ -x "${MLXFAST_MTP_BASELINE_WS}/.build-worker/release/mlxfast-runtime-worker" ]]; then
            audit_reference_ws="${MLXFAST_MTP_BASELINE_WS}"
          fi
          # shellcheck disable=SC2024  # trusted shell owns the capture files
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env \
              MJOB_WS="${MLXFAST_JOB_WS}" \
              MLXFAST_MTP_TARGET_DIR="${MLXFAST_MTP_TARGET_DIR}" \
              MLXFAST_MTP_ASSISTANT_DIR="${MLXFAST_MTP_ASSISTANT_DIR}" \
              MLXFAST_MTP_CONTRACT_PATH="${MLXFAST_MTP_CONTRACT_PATH}" \
              MLXFAST_MTP_BLOCK_SIZE="${MLXFAST_MTP_BLOCK_SIZE}" \
              MLXFAST_MTP_CORRECTNESS_TOKENS="${MLXFAST_MTP_CORRECTNESS_TOKENS}" \
              MLXFAST_MTP_AUDIT_REFERENCE_WS="${audit_reference_ws}" \
              /bin/bash -c '
                set -u
                cd "${MJOB_WS}" || exit 97
                exec .build/release/mlxfast-swift mtp-benchmark \
                  --target-source "${MLXFAST_MTP_TARGET_DIR}" \
                  --weights mtp-weights \
                  --assistant "${MLXFAST_MTP_ASSISTANT_DIR}" \
                  --contract "${MLXFAST_MTP_CONTRACT_PATH}" \
                  --golden .mtp-ranked-src/mtp_correctness_golden.json \
                  --block-size "${MLXFAST_MTP_BLOCK_SIZE}" \
                  --tokens "${MLXFAST_MTP_CORRECTNESS_TOKENS}" \
                  --target-verification exact-pair \
                  --deny-worker-file-writes \
                  --audit-committed-state \
                  --audit-reference-workspace "${MLXFAST_MTP_AUDIT_REFERENCE_WS}" \
                  --require-trained-assistant
              ' > "${raw_stdout}" 2> "${gates_log}" || status=$?
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" != "1" ]]; then
            cat "${gates_log}" || true
          fi
          # Seal + validate: exactly one JSON object with the MTP report
          # shape, every token matched, trained drafter in use, and no score
          # fields (this phase is a gate, not a measurement).
          if [[ "$(jq -s 'length' "${raw_stdout}" 2>/dev/null)" != "1" ]]; then
            echo "::error::MTP correctness gate did not emit a single valid report payload (exit=${status})" >&2
            exit 1
          fi
          jq -e \
            --arg track "${MLXFAST_MTP_TRACK_ID}" \
            --argjson tokens "${MLXFAST_MTP_CORRECTNESS_TOKENS}" \
            '
            .experimental == true
            and .track_id == $track
            and .uses_trained_drafter == true
            and .target_verification_mode == "exact-pair"
            and .decode_token_count == $tokens
            and .all_tokens_matched == true
            and .official_score_produced == false
            and (has("score") | not)
            and (has("speedup") | not)
            ' "${raw_stdout}" >/dev/null || {
              echo "::error::MTP correctness gate report failed validation (exit=${status})" >&2
              exit 1
            }
          # Committed-KV audit surface (WARN-ONLY): the block must be present
          # because this step requested the audit (its absence
          # means the trusted wiring broke), but a would-fail verdict is only
          # LOGGED -- categorical reasons, no token/logit content -- until
          # the operator calibrates the envelopes and flips enforcement.
          jq -e '
            .committed_state_audit
            and (.committed_state_audit.would_fail | type == "boolean")
            and (.committed_state_audit.status | type == "string")
            and (.committed_state_audit.reference_status | type == "string")
            and (.committed_state_audit.would_fail_reasons | type == "array")
            ' "${raw_stdout}" >/dev/null || {
              echo "::error::MTP correctness gate report is missing the committed-state audit block" >&2
              exit 1
            }
          audit_status="$(jq -r '.committed_state_audit.status' "${raw_stdout}")"
          audit_reference_status="$(jq -r '.committed_state_audit.reference_status' "${raw_stdout}")"
          audit_would_fail="$(jq -r '.committed_state_audit.would_fail' "${raw_stdout}")"
          if [[ "${audit_would_fail}" == "true" ]]; then
            audit_reasons="$(jq -r '.committed_state_audit.would_fail_reasons | join("; ")' "${raw_stdout}")"
            echo "::warning::committed-KV audit WOULD FAIL (WARN-ONLY until the operator calibrates the envelopes in MLXFastConstants and flips enforcement): ${audit_reasons} (status=${audit_status}, reference=${audit_reference_status})"
          else
            echo "mtp-benchmark: committed-KV audit clean (status=${audit_status}, reference=${audit_reference_status})"
          fi
          jq -n \
            --arg track "${MLXFAST_MTP_TRACK_ID}" \
            --argjson token_count "${MLXFAST_MTP_CORRECTNESS_TOKENS}" \
            '{
              schema_version: 1,
              track_id: $track,
              gate_passed: true,
              token_count: $token_count
            }' > "${verdict}"
          echo "mtp-benchmark: correctness/parity gate passed in $((SECONDS - started))s (exit=${status})"
          exit "${status}"

      # UNTIMED extended exact-token correctness legs. Same trusted seal and
      # validation discipline as the base gate above, still strictly before
      # any semantic material or timed phase:
      #   1. block-size sweep: re-runs the exact-token gate at the additional
      #      protocol block sizes over the base hidden golden (fail-closed;
      #      a kernel that only decodes correctly at K=4 must not rank);
      #   2. sliding-window-wrap leg: a longer hidden golden whose final
      #      offset crosses the 1,024-position ring-buffer wrap (fail-closed
      #      once staged; skipped with a notice until provisioned);
      #   3. rotation leg: the per-run pool member drawn deterministically in
      #      "Prepare hidden MTP goldens" (fail-closed once staged; skipped
      #      with a notice until the pool is provisioned).
      # Every leg is exact-token (a single divergent token fails the run);
      # none of these legs runs in, or changes, the timed measure-mtp-job.
      - name: MTP extended correctness legs (untimed)
        env:
          BENCH_JOB_ID: mtp-ranked-${{ github.run_id }}-${{ github.run_attempt }}-gates-extended
        run: |
          set -euo pipefail
          leg_stdout="${MLXFAST_PRIVATE_DIR}/mtp-gates-extended-stdout.raw"
          leg_log="${MLXFAST_PRIVATE_DIR}/mtp-gates-extended-private.log"
          trap 'rm -f -- "${leg_stdout}" "${leg_log}"' EXIT
          run_leg() {
            local leg_name="$1" leg_golden_rel="$2" leg_tokens="$3" leg_block_size="$4"
            local leg_golden_abs="${MLXFAST_JOB_WS}/${leg_golden_rel}"
            local started="${SECONDS}"
            local status=0
            rm -f -- "${leg_stdout}" "${leg_log}"
            # shellcheck disable=SC2024  # trusted shell owns the capture files
            BENCH_GOLDEN_PATH="${leg_golden_abs}" \
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env \
                MJOB_WS="${MLXFAST_JOB_WS}" \
                MLXFAST_MTP_TARGET_DIR="${MLXFAST_MTP_TARGET_DIR}" \
                MLXFAST_MTP_ASSISTANT_DIR="${MLXFAST_MTP_ASSISTANT_DIR}" \
                MLXFAST_MTP_CONTRACT_PATH="${MLXFAST_MTP_CONTRACT_PATH}" \
                LEG_GOLDEN_REL="${leg_golden_rel}" \
                LEG_TOKENS="${leg_tokens}" \
                LEG_BLOCK_SIZE="${leg_block_size}" \
                /bin/bash -c '
                  set -u
                  cd "${MJOB_WS}" || exit 97
                  exec .build/release/mlxfast-swift mtp-benchmark \
                    --target-source "${MLXFAST_MTP_TARGET_DIR}" \
                    --weights mtp-weights \
                    --assistant "${MLXFAST_MTP_ASSISTANT_DIR}" \
                    --contract "${MLXFAST_MTP_CONTRACT_PATH}" \
                    --golden "${LEG_GOLDEN_REL}" \
                    --block-size "${LEG_BLOCK_SIZE}" \
                    --tokens "${LEG_TOKENS}" \
                    --target-verification exact-pair \
                    --deny-worker-file-writes \
                    --require-trained-assistant
                ' > "${leg_stdout}" 2> "${leg_log}" || status=$?
            if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" != "1" ]]; then
              cat "${leg_log}" || true
            fi
            if [[ "$(jq -s 'length' "${leg_stdout}" 2>/dev/null)" != "1" ]]; then
              echo "::error::MTP extended correctness leg ${leg_name} did not emit a single valid report payload (exit=${status})" >&2
              exit 1
            fi
            jq -e \
              --arg track "${MLXFAST_MTP_TRACK_ID}" \
              --argjson tokens "${leg_tokens}" \
              --argjson block_size "${leg_block_size}" \
              '
              .experimental == true
              and .track_id == $track
              and .uses_trained_drafter == true
              and .target_verification_mode == "exact-pair"
              and .max_block_size == $block_size
              and .decode_token_count == $tokens
              and .all_tokens_matched == true
              and .official_score_produced == false
              and (has("score") | not)
              and (has("speedup") | not)
              ' "${leg_stdout}" >/dev/null || {
                echo "::error::MTP extended correctness leg ${leg_name} failed validation (exit=${status})" >&2
                exit 1
              }
            if [[ "${status}" -ne 0 ]]; then
              echo "::error::MTP extended correctness leg ${leg_name} exited ${status}" >&2
              exit "${status}"
            fi
            echo "mtp-benchmark: extended correctness leg ${leg_name} passed in $((SECONDS - started))s (tokens=${leg_tokens}, block_size=${leg_block_size})"
          }
          for sweep_block_size in ${MLXFAST_MTP_GATE_BLOCK_SIZE_SWEEP}; do
            run_leg "block-size-${sweep_block_size}" \
              ".mtp-ranked-src/mtp_correctness_golden.json" \
              "${MLXFAST_MTP_GATE_SWEEP_TOKENS}" \
              "${sweep_block_size}"
          done
          if [[ -f "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_wrap.json" ]]; then
            run_leg "window-wrap" \
              ".mtp-ranked-src/mtp_correctness_golden_wrap.json" \
              "${MLXFAST_MTP_WRAP_GOLDEN_TOKENS}" \
              "${MLXFAST_MTP_BLOCK_SIZE}"
          else
            echo "::notice::window-wrap correctness leg skipped (wrap golden not provisioned)"
          fi
          if [[ -s "${MLXFAST_PRIVATE_DIR}/mtp-rotation-leg.json" ]]; then
            rotation_id="$(jq -r '.id' "${MLXFAST_PRIVATE_DIR}/mtp-rotation-leg.json")"
            rotation_tokens="$(jq -r '.decode_tokens' "${MLXFAST_PRIVATE_DIR}/mtp-rotation-leg.json")"
            rotation_block_size="$(jq -r '.block_size' "${MLXFAST_PRIVATE_DIR}/mtp-rotation-leg.json")"
            run_leg "rotation-${rotation_id}" \
              ".mtp-ranked-src/mtp_correctness_golden_rotation.json" \
              "${rotation_tokens}" \
              "${rotation_block_size}"
          else
            echo "::notice::rotation correctness leg skipped (no provisioned pool member)"
          fi

      # Defense in depth after the trusted CLI has already required confirmed
      # RuntimeWorkerClient termination. Reap the bench uid and independently
      # prove no non-zombie bench process remains before any semantic fixture
      # is installed in the bench-readable staging tree. This step has no judge
      # credential or semantic path.
      - name: Reap exact MTP worker before semantic material
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /bin/bash "${MLXFAST_JOB_WS}/.github/scripts/reap-bench-processes.sh"
          bench_uid="$(id -u bench)"
          live_bench_pids="$(
            ps -axo pid=,state=,uid= \
              | awk -v uid="${bench_uid}" '$3 == uid && $2 !~ /^Z/ { print $1 }'
          )"
          if [[ -n "${live_bench_pids}" ]]; then
            echo "::error::refusing semantic material while exact-gate bench processes remain alive" >&2
            exit 1
          fi
          echo "mtp-benchmark: exact-gate bench processes reaped before semantic material"

      # The exact oracle is no longer needed once the parent-owned parity gate
      # succeeds. Remove its bench-readable staging copy before changing
      # BENCH_GOLDEN_PATH or installing the semantic reference, so no semantic
      # worker can read both private fixture classes. The runner-private pinned
      # source remains 0700 and is never visible to the bench uid.
      - name: Scrub exact MTP oracle before semantic capture
        run: |
          set -euo pipefail
          for exact_oracle in \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_wrap.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_rotation.json"; do
            rm -f -- "${exact_oracle}"
            if [[ -e "${exact_oracle}" || -L "${exact_oracle}" ]]; then
              echo "::error::exact MTP oracle remained readable before semantic capture" >&2
              exit 1
            fi
          done
          echo "mtp-benchmark: exact correctness oracles scrubbed before semantic capture"

      # Independent secondary gate. Exact-token failure above stops the job
      # before this step, so semantic judging can never rescue parity. The
      # semantic-only GPQA cases carry no target-token oracle: the trusted
      # parent tokenizes each prompt with the pinned IT tokenizer, launches one
      # fresh exact-pair trained-MTP worker/session per case, and captures only
      # parent-observed returned IDs. Fresh processes are intentionally costly
      # but preserve the existing one-begin-per-worker protocol and isolate KV
      # and assistant state across cases.
      - name: Capture MTP semantic GPQA answers (untimed)
        env:
          BENCH_JOB_ID: mtp-ranked-${{ github.run_id }}-${{ github.run_attempt }}-semantic-capture
          BENCH_GOLDEN_PATH: ${{ env.MLXFAST_JOB_WS }}/.mtp-ranked-src/mtp_semantic_gpqa_reference.json
        run: |
          set -euo pipefail
          umask 077
          raw_stdout="${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.stdout"
          capture_log="${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.log"
          answers="${MLXFAST_JOB_WS}/private/mtp_semantic_gpqa_answers.json"
          semantic_src="${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json"
          semantic_dst="${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_semantic_gpqa_reference.json"
          rm -f -- "${raw_stdout}" "${capture_log}"
          for exact_oracle in \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_wrap.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_rotation.json"; do
            if [[ -e "${exact_oracle}" || -L "${exact_oracle}" ]]; then
              echo "::error::refusing semantic launch while exact MTP oracle remains staged" >&2
              exit 1
            fi
          done
          if [[ -e "${semantic_dst}" || -L "${semantic_dst}" ]]; then
            echo "::error::refusing to place MTP semantic input over a pre-existing path" >&2
            exit 1
          fi
          install -m 0600 "${semantic_src}" "${semantic_dst}"
          /bin/chmod +a "user:bench allow read" "${semantic_dst}"
          rm -rf "${MLXFAST_JOB_WS}/private"
          mkdir -m 0700 "${MLXFAST_JOB_WS}/private"
          /bin/chmod +a \
            "user:bench allow list,search,readattr,readextattr,read,execute,add_file,add_subdirectory,delete_child,write,append,writeattr,writeextattr,file_inherit,directory_inherit" \
            "${MLXFAST_JOB_WS}/private"
          status=0
          # shellcheck disable=SC2024  # trusted shell owns private capture files
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env \
              MJOB_WS="${MLXFAST_JOB_WS}" \
              MLXFAST_OFFICIAL_BENCHMARK_RUN=1 \
              MLXFAST_PRIVATE_DIR="${MLXFAST_JOB_WS}/private" \
              BENCH_GOLDEN_PATH="${BENCH_GOLDEN_PATH}" \
              MLXFAST_MTP_TARGET_DIR="${MLXFAST_MTP_TARGET_DIR}" \
              MLXFAST_MTP_ASSISTANT_DIR="${MLXFAST_MTP_ASSISTANT_DIR}" \
              MLXFAST_MTP_CONTRACT_PATH="${MLXFAST_MTP_CONTRACT_PATH}" \
              MLXFAST_MTP_BLOCK_SIZE="${MLXFAST_MTP_BLOCK_SIZE}" \
              MLXFAST_MTP_SEMANTIC_GPQA_CASE_COUNT="${MLXFAST_MTP_SEMANTIC_GPQA_CASE_COUNT}" \
              MLXFAST_MTP_SEMANTIC_GPQA_MAX_NEW_TOKENS="${MLXFAST_MTP_SEMANTIC_GPQA_MAX_NEW_TOKENS}" \
              /bin/bash -c '
                set -euo pipefail
                cd "${MJOB_WS}"
                exec .build/release/mlxfast-swift mtp-generate-gpqa-answers \
                  --target-source "${MLXFAST_MTP_TARGET_DIR}" \
                  --weights mtp-weights \
                  --assistant "${MLXFAST_MTP_ASSISTANT_DIR}" \
                  --contract "${MLXFAST_MTP_CONTRACT_PATH}" \
                  --tokenizer "${MLXFAST_MTP_TARGET_DIR}" \
                  --gpqa .mtp-ranked-src/mtp_semantic_gpqa_reference.json \
                  --output private/mtp_semantic_gpqa_answers.json \
                  --block-size "${MLXFAST_MTP_BLOCK_SIZE}" \
                  --case-count "${MLXFAST_MTP_SEMANTIC_GPQA_CASE_COUNT}" \
                  --max-new-tokens "${MLXFAST_MTP_SEMANTIC_GPQA_MAX_NEW_TOKENS}" \
                  --require-trained-assistant
              ' > "${raw_stdout}" 2> "${capture_log}" || status=$?
          if [[ "${status}" -ne 0 ]]; then
            echo "::error::MTP semantic GPQA capture failed" >&2
            exit 1
          fi
          if [[ "$(tr -d '\r\n' < "${raw_stdout}")" != "mtp-generate-gpqa-answers: completed" ]]; then
            echo "::error::MTP semantic GPQA capture emitted an unexpected public summary" >&2
            exit 1
          fi
          if [[ ! -f "${answers}" || -L "${answers}" ]]; then
            echo "::error::MTP semantic GPQA capture did not create a regular private answer file" >&2
            exit 1
          fi
          answer_bytes="$(stat -f '%z' "${answers}")"
          answer_mode="$(stat -f '%Lp' "${answers}")"
          if ! [[ "${answer_bytes}" =~ ^[1-9][0-9]*$ ]] \
              || (( answer_bytes > 1048576 )) \
              || [[ "${answer_mode}" != "600" ]]; then
            echo "::error::MTP semantic GPQA answer file violates its fixed size/permission contract" >&2
            exit 1
          fi
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /bin/bash "${MLXFAST_JOB_WS}/.github/scripts/reap-bench-processes.sh"
          bench_uid="$(id -u bench)"
          live_bench_pids="$(
            ps -axo pid=,state=,uid= \
              | awk -v uid="${bench_uid}" '$3 == uid && $2 !~ /^Z/ { print $1 }'
          )"
          if [[ -n "${live_bench_pids}" ]]; then
            echo "::error::refusing MTP semantic answer handoff while bench processes remain alive" >&2
            exit 1
          fi
          trusted_reader="$(id -un)"
          if [[ ! "${trusted_reader}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::trusted runner account name is unsafe for the semantic answer ACL" >&2
            exit 1
          fi
          # The file is bench-owned mode 0600. Grant only the trusted runner
          # read access after every candidate worker has exited; never relax
          # group/other mode bits and never pass the judge key across the
          # bench-exec bridge.
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /bin/chmod +a "user:${trusted_reader} allow read" "${answers}"
          test -r "${answers}"
          test "$(stat -f '%Lp' "${answers}")" = "600"
          echo "mtp-benchmark: semantic GPQA capture completed"

      # BEST-EFFORT reference semantic capture for the paired floor. The
      # PINNED baseline tree replays the same semantic-only prompts through
      # its own capture CLI so the judge can score candidate and reference
      # interleaved in one session. The pinned baseline tree may predate
      # mtp-generate-gpqa-answers; until the operator rotates it, this step
      # detects that and skips with a notice, and the judge falls back to
      # the absolute floor. Runs trusted (the baseline tree is operator
      # reference code); never touches the judge credential; the reference
      # answers live runner-private and are scrubbed with the other semantic
      # material. Note this adds up to five reference model loads/decodes of
      # untimed wall time when active.
      - name: Capture reference semantic GPQA answers (best-effort, untimed)
        run: |
          set -euo pipefail
          umask 077
          baseline_cli="${MLXFAST_MTP_BASELINE_WS}/.build/release/mlxfast-swift"
          reference_answers="${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference_answers.json"
          capture_log="${MLXFAST_PRIVATE_DIR}/mtp-semantic-reference-capture.log"
          rm -f -- "${reference_answers}" "${capture_log}"
          if [[ ! -x "${baseline_cli}" \
              || ! -d "${MLXFAST_MTP_BASELINE_WS}/mtp-weights" ]]; then
            echo "::warning::pinned MTP baseline tree is not runnable here; SKIPPING reference semantic capture (paired floor falls back to the absolute floor)"
            exit 0
          fi
          if ! "${baseline_cli}" help 2>/dev/null | grep -q "mtp-generate-gpqa-answers"; then
            echo "::warning::pinned MTP baseline tree predates mtp-generate-gpqa-answers; SKIPPING reference semantic capture until the operator rotates the baseline tree (paired floor falls back to the absolute floor)"
            exit 0
          fi
          status=0
          # shellcheck disable=SC2024  # trusted shell owns the capture files
          ( cd "${MLXFAST_MTP_BASELINE_WS}" \
            && exec /usr/bin/env \
              MLXFAST_PRIVATE_DIR="${MLXFAST_PRIVATE_DIR}" \
              .build/release/mlxfast-swift mtp-generate-gpqa-answers \
                --target-source "${MLXFAST_MTP_TARGET_DIR}" \
                --weights mtp-weights \
                --assistant "${MLXFAST_MTP_ASSISTANT_DIR}" \
                --contract "${MLXFAST_MTP_CONTRACT_PATH}" \
                --tokenizer "${MLXFAST_MTP_TARGET_DIR}" \
                --gpqa "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json" \
                --output "${reference_answers}" \
                --block-size "${MLXFAST_MTP_BLOCK_SIZE}" \
                --case-count "${MLXFAST_MTP_SEMANTIC_GPQA_CASE_COUNT}" \
                --max-new-tokens "${MLXFAST_MTP_SEMANTIC_GPQA_MAX_NEW_TOKENS}" \
                --require-trained-assistant \
          ) > /dev/null 2> "${capture_log}" || status=$?
          if [[ "${status}" -ne 0 || ! -f "${reference_answers}" ]]; then
            echo "::warning::reference semantic capture failed (exit=${status}); SKIPPING (paired floor falls back to the absolute floor)"
            rm -f -- "${reference_answers}"
            exit 0
          fi
          chmod 600 "${reference_answers}"
          echo "mtp-benchmark: reference semantic GPQA answers captured"

      # Trusted networked verdict-only judge. No score exists yet and this
      # mode never creates or patches one; the detailed private result is
      # consumed only as a pass/fail gate and scrubbed in the next step.
      # The paired floor is WARN-ONLY (MLXFAST_MTP_SEMANTIC_GPQA_PAIRED_ENFORCE)
      # until operator calibration; the absolute 1-of-5 floor stays the
      # fail-closed backstop either way.
      - name: MTP semantic GPQA gate (untimed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ORG_ANTHROPIC_API_KEY }}
          MLXFAST_SEMANTIC_GPQA_OUTPUT_PATH: ${{ env.MLXFAST_JOB_WS }}/private/mtp_semantic_gpqa_answers.json
          MLXFAST_SEMANTIC_GPQA_REFERENCE_OUTPUT_PATH: ${{ env.MLXFAST_PRIVATE_DIR }}/mtp_semantic_gpqa_reference_answers.json
          MLXFAST_SEMANTIC_GPQA_RESULTS_PATH: ${{ env.MLXFAST_MTP_SEMANTIC_GPQA_RESULTS_PATH }}
          MLXFAST_SEMANTIC_GPQA_MODEL: ${{ env.MLXFAST_MTP_SEMANTIC_GPQA_MODEL }}
          MLXFAST_SEMANTIC_GPQA_MIN_PASS: ${{ env.MLXFAST_MTP_SEMANTIC_GPQA_MIN_PASS }}
          MLXFAST_SEMANTIC_GPQA_PAIRED_DELTA: ${{ env.MLXFAST_MTP_SEMANTIC_GPQA_PAIRED_DELTA }}
          MLXFAST_SEMANTIC_GPQA_REFERENCE_MIN_PASS: ${{ env.MLXFAST_MTP_SEMANTIC_GPQA_REFERENCE_MIN_PASS }}
          MLXFAST_SEMANTIC_GPQA_PAIRED_ENFORCE: ${{ env.MLXFAST_MTP_SEMANTIC_GPQA_PAIRED_ENFORCE }}
          MLXFAST_SEMANTIC_GPQA_EXPECTED_CASE_COUNT: ${{ env.MLXFAST_MTP_SEMANTIC_GPQA_CASE_COUNT }}
          MLXFAST_SEMANTIC_GPQA_EXPECTED_MAX_NEW_TOKENS: ${{ env.MLXFAST_MTP_SEMANTIC_GPQA_MAX_NEW_TOKENS }}
          MLXFAST_SEMANTIC_GPQA_REQUIRED: "1"
          MLXFAST_SEMANTIC_GPQA_VERDICT_ONLY: "1"
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::MTP semantic GPQA gate requires ORG_ANTHROPIC_API_KEY" >&2
            exit 1
          fi
          .github/scripts/run-semantic-gpqa-gate.sh
          if [[ ! -f "${MLXFAST_MTP_SEMANTIC_GPQA_RESULTS_PATH}" \
              || -L "${MLXFAST_MTP_SEMANTIC_GPQA_RESULTS_PATH}" \
              || "$(stat -f '%Lp' "${MLXFAST_MTP_SEMANTIC_GPQA_RESULTS_PATH}")" != "600" ]]; then
            echo "::error::MTP semantic GPQA judge did not leave a restrictive private verdict" >&2
            exit 1
          fi
          echo "mtp-benchmark: semantic GPQA gate passed"

      # Runs even after capture/judge failure. Remove the reference, generated
      # answers, judge result, requests/responses/temp details, and private
      # capture logs before any correctness artifact or timed worker can run.
      - name: Scrub MTP semantic GPQA material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -d "${MLXFAST_JOB_WS}" ]]; then
            rm -f -- \
              "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden.json" \
              "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_wrap.json" \
              "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_rotation.json" \
              "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_semantic_gpqa_reference.json"
            rm -rf "${MLXFAST_JOB_WS}/private"
            mkdir -p "${MLXFAST_JOB_WS}/private"
          fi
          if [[ -d "${MLXFAST_PRIVATE_DIR}" ]]; then
            rm -f -- \
              "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json" \
              "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference_answers.json" \
              "${MLXFAST_MTP_SEMANTIC_GPQA_RESULTS_PATH}" \
              "${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.stdout" \
              "${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.log" \
              "${MLXFAST_PRIVATE_DIR}/mtp-semantic-reference-capture.log"
            find "${MLXFAST_PRIVATE_DIR}" -maxdepth 1 \
              \( -name 'semantic-gpqa.*' -o -name 'mtp_semantic_gpqa*' -o -name 'mtp-semantic-*' \) \
              -exec rm -rf -- {} +
          fi
          for sensitive_path in \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_wrap.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_rotation.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_semantic_gpqa_reference.json" \
            "${MLXFAST_JOB_WS}/private/mtp_semantic_gpqa_answers.json" \
            "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json" \
            "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference_answers.json" \
            "${MLXFAST_MTP_SEMANTIC_GPQA_RESULTS_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.stdout" \
            "${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp-semantic-reference-capture.log"; do
            if [[ -e "${sensitive_path}" || -L "${sensitive_path}" ]]; then
              echo "::error::MTP semantic GPQA scrub left private material" >&2
              exit 1
            fi
          done
          echo "mtp-benchmark: semantic GPQA private material scrubbed"

      # ---- correctness-only (run_benchmark=false) artifact path ------------
      - name: Stage MTP correctness artifacts
        id: stage_mtp_correctness_artifacts
        if: ${{ success() && !inputs.run_benchmark }}
        run: |
          set -euo pipefail
          export MLXFAST_ARTIFACT_PROFILE=mtp-correctness
          export MLXFAST_EXPECTED_TRACK_ID="${MLXFAST_MTP_TRACK_ID}"
          export MLXFAST_EXPECTED_TOKEN_COUNT="${MLXFAST_MTP_CORRECTNESS_TOKENS}"
          .github/scripts/deny-private-artifacts.sh \
            mtp-correctness-verdict.json
          .github/scripts/stage-benchmark-artifacts.sh \
            "${MLXFAST_ARTIFACT_ROOT}/mtp-correctness-results" \
            mtp-correctness-verdict.json=mtp-correctness-verdict.json

      - name: Upload MTP correctness artifacts
        if: always() && steps.stage_mtp_correctness_artifacts.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mtp-correctness-results-${{ github.run_id }}
          path: ${{ env.MLXFAST_ARTIFACT_ROOT }}/mtp-correctness-results
          if-no-files-found: error
          overwrite: true

      # ---- ranked path (run_benchmark=true) ---------------------------------
      # Restore the workspace to its pre-hidden snapshot BEFORE the timed
      # phase: remove the hidden correctness golden, purge bench scratch
      # through the bridge, allowlist-delete every gates-phase file, and
      # re-verify mtp-weights against its pinned hash.
      - name: Scrub hidden material from bench workspace
        if: ${{ success() && inputs.run_benchmark }}
        run: |
          set -euo pipefail
          rm -f \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_wrap.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_correctness_golden_rotation.json" \
            "${MLXFAST_JOB_WS}/.mtp-ranked-src/mtp_semantic_gpqa_reference.json"
          rm -f \
            "${MLXFAST_PRIVATE_DIR}/mtp-gates-stdout.raw" \
            "${MLXFAST_PRIVATE_DIR}/mtp-gates-private.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp-gates-extended-stdout.raw" \
            "${MLXFAST_PRIVATE_DIR}/mtp-gates-extended-private.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp-reference-replay.stdout" \
            "${MLXFAST_PRIVATE_DIR}/mtp-reference-replay.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp-rotation-leg.json" \
            "${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.stdout" \
            "${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp-semantic-reference-capture.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json" \
            "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference_answers.json" \
            "${MLXFAST_MTP_SEMANTIC_GPQA_RESULTS_PATH}" \
            mtp-correctness-verdict.json \
            mtp-gates-report.json
          rm -rf "${MLXFAST_JOB_WS}/private"
          mkdir -p "${MLXFAST_JOB_WS}/private"
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" /bin/bash -c '
              set -u
              if [ -d "${MJOB_WS}/tmp" ]; then
                find "${MJOB_WS}/tmp" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true
              fi
            '
          manifest="${MLXFAST_PRIVATE_DIR}/post-transform-manifest.nul"
          test -s "${manifest}"
          scrub_failed=0
          while IFS= read -r -d '' rel; do
            case "${rel}" in
              ./mtp-weights/*|./.build/*|./.build-worker/*|./correctness_prompts/*) continue ;;
              ./private/*) continue ;;
            esac
            if grep -zqxF -- "${rel}" "${manifest}"; then
              continue
            fi
            target="${MLXFAST_JOB_WS}/${rel#./}"
            rm -f -- "${target}" 2>/dev/null || true
            if [[ -e "${target}" || -L "${target}" ]]; then
              echo "::error::allowlist scrub could not remove gates-phase workspace file: ${rel}" >&2
              scrub_failed=1
            fi
          done < <(cd "${MLXFAST_JOB_WS}" && find . -mindepth 1 \( -type f -o -type l \) -print0 | LC_ALL=C sort -z)
          if [[ "${scrub_failed}" -ne 0 ]]; then
            echo "::error::allowlist scrub left gates-phase workspace files it could not delete" >&2
            exit 1
          fi
          test -s mtp-weights.sha256
          scrub_weights_hash="$(.github/scripts/hash-weights-directory.sh "${MLXFAST_JOB_WS}/mtp-weights")"
          trusted_weights_hash="$(tr -d '[:space:]' < mtp-weights.sha256)"
          if [[ "${scrub_weights_hash}" != "${trusted_weights_hash}" ]]; then
            echo "::error::transformed MTP weights changed before timing (hash ${scrub_weights_hash} != ${trusted_weights_hash})" >&2
            exit 1
          fi
          leftovers="$(find "${MLXFAST_JOB_WS}" -maxdepth 2 \
            \( -name '*golden*' -o -name '*semantic*gpqa*' -o -name '*gpqa*reference*' \) \
            ! -path "*/correctness_prompts/*" | grep -v '^$' || true)"
          if [[ -n "${leftovers}" ]]; then
            echo "::error::hidden-material scrub left candidates behind: ${leftovers}" >&2
            exit 1
          fi
          for raw_report in \
            "${MLXFAST_PRIVATE_DIR}/mtp-gates-stdout.raw" \
            "${MLXFAST_PRIVATE_DIR}/mtp-gates-private.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp-gates-extended-stdout.raw" \
            "${MLXFAST_PRIVATE_DIR}/mtp-gates-extended-private.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp-reference-replay.stdout" \
            "${MLXFAST_PRIVATE_DIR}/mtp-reference-replay.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp-rotation-leg.json" \
            "${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.stdout" \
            "${MLXFAST_PRIVATE_DIR}/mtp-semantic-capture.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp-semantic-reference-capture.log" \
            "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference.json" \
            "${MLXFAST_PRIVATE_DIR}/mtp_semantic_gpqa_reference_answers.json" \
            "${MLXFAST_MTP_SEMANTIC_GPQA_RESULTS_PATH}" \
            mtp-gates-report.json; do
            if [[ -e "${raw_report}" || -L "${raw_report}" ]]; then
              echo "::error::hidden-material scrub left raw MTP report: ${raw_report}" >&2
              exit 1
            fi
          done
          echo "mtp-benchmark: bench workspace restored to pre-hidden snapshot before timing"

      - name: Reap lingering bench processes before timing
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /bin/bash "${MLXFAST_JOB_WS}/.github/scripts/reap-bench-processes.sh"

      - name: Wait for quiescence before timing
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          waited=0
          while :; do
            load="$(sysctl -n vm.loadavg | awk '{print $2}')"
            util="$("${MLXFAST_MACMON}" pipe -s1 2>/dev/null | jq -r '.gpu_usage[1] // 1' || true)"
            [[ -n "${util}" ]] || util=1
            if [[ "$(echo "${load} < 2.0" | bc -l)" == "1" && "$(echo "${util} < 0.10" | bc -l)" == "1" ]]; then
              break
            fi
            sleep 15
            waited=$((waited + 15))
            if [[ "${waited}" -ge 900 ]]; then
              echo "::error::machine did not reach quiescence within 900s (load=${load} gpu_util=${util})" >&2
              exit 1
            fi
          done
          temp="$("${MLXFAST_MACMON}" pipe -s1 2>/dev/null | jq -r '.temp.gpu_temp_avg // "?"')"
          echo "mtp-benchmark: quiescent after ${waited}s (load=${load} gpu_util=${util} gpu_temp=${temp}C); thermal gate is enforced inside measure-mtp-job"

      - name: Verify trusted harness before timing
        if: ${{ inputs.run_benchmark }}
        run: |
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # THE TIMED MTP MEASUREMENT -- LAST, via the box-owned wrapper with the
      # fixed thermal contract. Per accepted pair, alternating order:
      #   baseline: pinned MTP baseline tree, serial K=1 target decode
      #             (mtp-probe) over the hidden benchmark golden;
      #   candidate: this workspace, mtp-benchmark (exact-pair) over the
      #             SAME golden, same --tokens denominator.
      # measure-mtp-job enforces per-phase quiescence + the 40C gate + 2 Hz
      # telemetry acceptance, requires all_tokens_matched=true from every
      # run, checks the baseline calibration band, and seals results.json.
      # No new wrapper argument is needed for filesystem isolation:
      # MLXFAST_OFFICIAL_BENCHMARK_RUN makes every mtp-benchmark worker
      # strip injected write allows and default to /dev/null-only writes.
      - name: Timed paired MTP benchmark (measure-mtp-job)
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          MEASURE_STATE_DIR="${MLXFAST_MEASURE_STATE_DIR}" \
          BASELINE_WS="${MLXFAST_MTP_BASELINE_WS}" \
          BASELINE_CALIBRATION="${MLXFAST_MTP_BASELINE_CALIBRATION}" \
          MTP_TARGET_DIR="${MLXFAST_MTP_TARGET_DIR}" \
          MTP_ASSISTANT_DIR="${MLXFAST_MTP_ASSISTANT_DIR}" \
          GPU_LOADED_UTIL=0.95 \
            "${MLXFAST_MTP_MEASURE_JOB}" \
              --candidate "${MLXFAST_JOB_WS}" \
              --baseline "${MLXFAST_MTP_BASELINE_WS}" \
              --golden "${MLXFAST_PRIVATE_DIR}/mtp_benchmark_golden.json" \
              --contract "${MLXFAST_MTP_CONTRACT_PATH}" \
              --tokens "${MLXFAST_MTP_DECODE_TOKENS}" \
              --block-size "${MLXFAST_MTP_BLOCK_SIZE}" \
              --min-pairs "${MLXFAST_MTP_MIN_ACCEPTED_PAIRS}" \
              --target-pairs "${MLXFAST_MTP_TARGET_PAIRS}" \
              --tag "mtp-ranked-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --out "${MLXFAST_MEASURE_OUT}"
          test -s "${MLXFAST_MEASURE_OUT}/results.json"
          echo "mtp-benchmark: sealed paired measurement completed"

      # Decode-only score contract (adopted 2026-07-14 memo), applied in the
      # trusted shell from the sealed paired results: hard returned-token gate,
      # minimum accepted pairs, RATIO-OF-MEANS aggregation computed HERE from
      # the sealed per-side seconds/token means (never trusted from a
      # pre-aggregated field), and the 1.0 floor on that aggregate. The
      # published score.json carries the track id so the leaderboard can
      # verify that this is the MTP default rather than the legacy serial
      # track.
      - name: Compute MTP score and enforce floor
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          results="${MLXFAST_MEASURE_OUT}/results.json"
          test -s "${results}"
          jq -e \
            --arg track "${MLXFAST_MTP_TRACK_ID}" \
            --argjson min_pairs "${MLXFAST_MTP_MIN_ACCEPTED_PAIRS}" \
            '
            .track_id == $track
            and .parity_all_ok == true
            and (.accepted_pair_count >= $min_pairs)
            and ((.pairs | type) == "array")
            and ((.pairs | length) == .accepted_pair_count)
            and (.aggregate.baseline_serial_seconds_per_token_mean | type == "number" and . > 0)
            and (.aggregate.candidate_mtp_seconds_per_token_mean | type == "number" and . > 0)
            and (.aggregate.mtp_decode_speedup_median | type == "number")
            and (.aggregate.mtp_decode_speedup_min | type == "number")
            ' "${results}" >/dev/null || {
              echo "::error::paired MTP results failed validation (returned-token parity gate, pair count, or schema)" >&2
              exit 1
            }
          # Ratio-of-means: mean serial s/tok over accepted pairs divided by
          # mean MTP s/tok over the same pairs (equivalently total serial
          # decode time / total MTP decode time for the fixed token total).
          speedup="$(jq -r '.aggregate.baseline_serial_seconds_per_token_mean / .aggregate.candidate_mtp_seconds_per_token_mean' "${results}")"
          floor_ok="$(echo "${speedup} >= ${MLXFAST_MTP_DECODE_SPEEDUP_FLOOR}" | bc -l)"
          if [[ "${floor_ok}" != "1" ]]; then
            echo "::error::mtp_decode_speedup (ratio-of-means) ${speedup} is below the ${MLXFAST_MTP_DECODE_SPEEDUP_FLOOR} floor; an MTP submission that is not faster than trusted serial decode does not rank" >&2
            exit 1
          fi
          jq -n \
            --arg track "${MLXFAST_MTP_TRACK_ID}" \
            --argjson score "${speedup}" \
            --argjson floor "${MLXFAST_MTP_DECODE_SPEEDUP_FLOOR}" \
            --argjson decode_tokens "${MLXFAST_MTP_DECODE_TOKENS}" \
            --argjson target_pairs "${MLXFAST_MTP_TARGET_PAIRS}" \
            --slurpfile results "${results}" \
            '
            {
              score: $score,
              passed: true,
              track_id: $track,
              metrics: {
                mode: "mtp-paired-decode-only",
                aggregation: "ratio_of_means",
                decode_tokens: $decode_tokens,
                decode_speedup_floor: $floor,
                accepted_pair_count: $results[0].accepted_pair_count,
                target_pair_count: $target_pairs,
                parity_all_ok: $results[0].parity_all_ok,
                mtp_decode_speedup_ratio_of_means: $score
              }
            }
            ' > score.json
          export MLXFAST_ARTIFACT_PROFILE=mtp-score
          export MLXFAST_EXPECTED_TRACK_ID="${MLXFAST_MTP_TRACK_ID}"
          export MLXFAST_EXPECTED_TOKEN_COUNT="${MLXFAST_MTP_DECODE_TOKENS}"
          export MLXFAST_EXPECTED_SCORE_FLOOR="${MLXFAST_MTP_DECODE_SPEEDUP_FLOOR}"
          export MLXFAST_EXPECTED_MIN_PAIRS="${MLXFAST_MTP_MIN_ACCEPTED_PAIRS}"
          export MLXFAST_EXPECTED_TARGET_PAIRS="${MLXFAST_MTP_TARGET_PAIRS}"
          .github/scripts/deny-private-artifacts.sh score.json
          rm -f -- \
            "${MLXFAST_MEASURE_OUT}/results.json" \
            "${MLXFAST_MEASURE_OUT}/verdict.txt"
          for private_result in \
            "${MLXFAST_MEASURE_OUT}/results.json" \
            "${MLXFAST_MEASURE_OUT}/verdict.txt"; do
            if [[ -e "${private_result}" || -L "${private_result}" ]]; then
              echo "::error::could not delete runner-private MTP result before artifact staging: ${private_result}" >&2
              exit 1
            fi
          done
          jq -c '{track_id, score, passed}' score.json

      - name: Check MTP benchmark artifact paths
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          export MLXFAST_ARTIFACT_PROFILE=mtp-score
          export MLXFAST_EXPECTED_TRACK_ID="${MLXFAST_MTP_TRACK_ID}"
          export MLXFAST_EXPECTED_TOKEN_COUNT="${MLXFAST_MTP_DECODE_TOKENS}"
          export MLXFAST_EXPECTED_SCORE_FLOOR="${MLXFAST_MTP_DECODE_SPEEDUP_FLOOR}"
          export MLXFAST_EXPECTED_MIN_PAIRS="${MLXFAST_MTP_MIN_ACCEPTED_PAIRS}"
          export MLXFAST_EXPECTED_TARGET_PAIRS="${MLXFAST_MTP_TARGET_PAIRS}"
          .github/scripts/deny-private-artifacts.sh \
            score.json

      - name: Stage MTP benchmark artifacts
        id: stage_mtp_benchmark_artifacts
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          export MLXFAST_ARTIFACT_PROFILE=mtp-score
          export MLXFAST_EXPECTED_TRACK_ID="${MLXFAST_MTP_TRACK_ID}"
          export MLXFAST_EXPECTED_TOKEN_COUNT="${MLXFAST_MTP_DECODE_TOKENS}"
          export MLXFAST_EXPECTED_SCORE_FLOOR="${MLXFAST_MTP_DECODE_SPEEDUP_FLOOR}"
          export MLXFAST_EXPECTED_MIN_PAIRS="${MLXFAST_MTP_MIN_ACCEPTED_PAIRS}"
          export MLXFAST_EXPECTED_TARGET_PAIRS="${MLXFAST_MTP_TARGET_PAIRS}"
          .github/scripts/stage-benchmark-artifacts.sh \
            "${MLXFAST_ARTIFACT_ROOT}/benchmark-results" \
            score.json=score.json

      - name: Upload MTP benchmark artifacts
        if: ${{ inputs.run_benchmark && steps.stage_mtp_benchmark_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ${{ env.MLXFAST_ARTIFACT_ROOT }}/benchmark-results
          if-no-files-found: error
          overwrite: true

      # Sealed measure results and free-form verdict text remain runner-private
      # until the always-run cleanup below. They are never copied or uploaded.

      - name: Cleanup bench workspace
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "${MLXFAST_JOB_WS}" ]]; then
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /bin/sh -c 'find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null; true' || true
            rm -rf "${MLXFAST_JOB_WS}" || true
            if [[ -d "${MLXFAST_JOB_WS}" ]]; then
              echo "::warning::bench workspace residue left at ${MLXFAST_JOB_WS}"
            fi
          fi
          private_cleanup_failed=0
          for private_path in \
            "${MLXFAST_PRIVATE_DIR}" \
            "${MLXFAST_MEASURE_OUT}" \
            "${MLXFAST_ARTIFACT_ROOT}"; do
            if ! rm -rf -- "${private_path}"; then
              echo "::error::could not remove runner-private artifact path: ${private_path}" >&2
              private_cleanup_failed=1
              continue
            fi
            if [[ -e "${private_path}" || -L "${private_path}" ]]; then
              echo "::error::runner-private artifact cleanup failed: ${private_path}" >&2
              private_cleanup_failed=1
            fi
          done
          exit "${private_cleanup_failed}"

      - name: Janitor reset and integrity audit
        if: always()
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_JANITOR}"
          if [[ -e "${MLXFAST_QUARANTINE_FLAG}" ]]; then
            echo "::error::janitor quarantined the box after this run" >&2
            exit 1
          fi
          echo "mtp-benchmark: janitor reset + integrity audit clean"
