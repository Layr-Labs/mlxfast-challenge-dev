name: gemma-adjacency-oracle

# Ad-hoc PROTOTYPE of the adjacency fix, done properly with fast timing-only
# windows so we can measure a TRUE adjacent gap (~1-2 min), not the ~5 min
# --local-iterate floor.
#
# Unblock: the public golden has no benchmark oracle, so the timing-only path
# (benchmark.sh + CORRECTNESS_STEPS=0 + CHECK_GATES=0) fails at golden load. We
# BUILD an oracle on each runner: generate-golden greedily continues the public
# 512-token prompt, then a tiny assembler turns [c0,c1,...] into a BenchmarkGolden
# (expected_prefill_token = expected_decode_seed_token = c0; expected_decode_tokens
# = [c1..]; prefill_prompt_tokens = decode_seed_tokens = prompt). Same machine
# generates + times, so the teacher-forced check matches (greedy is deterministic
# same-session) and timing is captured.
#
# Then run many timing-only windows back-to-back (~1-2 min each: model load +
# prefill + 512 seed + 128 decode, NO correctness). Analyze ratio-vs-gap for BOTH
# the real 128-step decode and the cold prefill: decode[i]/decode[i+g]. Consecutive
# (~1-2 min) = ADJACENT reorder; ~5 windows apart (~8-10 min) = TODAY's bundled
# gap. If the ratio CV is tight adjacent and widens with gap, adjacency works.
#
# Baked Gemma cache => no re-download. NOT part of CI or scoring.
on:
  push:
    branches:
      - gemma-tenki-decode
  workflow_dispatch:
    inputs:
      machines:
        description: 'JSON array of machine indices, e.g. "[1,2]".'
        required: false
        default: "[1,2]"
        type: string
      passes:
        description: 'Timing-only windows per machine (back-to-back).'
        required: false
        default: "12"
        type: string

concurrency:
  group: gemma-adjacency-oracle-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    name: "adjacency machine ${{ matrix.machine }}"
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(inputs.machines || '[1,2]') }}
    runs-on: tenki-macos-latest-xlarge
    timeout-minutes: 120
    env:
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH: correctness_prompts/public_longcopy_gate_english_512_256.json
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: /Users/runner/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Host identity
        run: |
          set -uo pipefail
          {
            echo "machine=${{ matrix.machine }}"
            echo "model=$(sysctl -n hw.model 2>/dev/null || true)"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee host.txt

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_BASE_URL: https://huggingface.co/mlx-community/gemma-4-31b-4bit/resolve/main
          MLXFAST_REFERENCE_DOWNLOAD_JOBS: "12"
          MLXFAST_REFERENCE_MIN_FREE_GIB: "40"
          MLXFAST_REFERENCE_POST_DOWNLOAD_FULL_VERIFY: "0"
          MLXFAST_REFERENCE_HASH_VERIFY: "0"
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_REFERENCE_DIR}/config.json" ]]; then
            echo "::error::baked Gemma checkpoint missing at ${MLXFAST_REFERENCE_DIR}; refusing to download" >&2
            exit 1
          fi
          ./setup.sh

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" \
            --output weights

      - name: Build benchmark-oracle golden on this machine
        run: |
          set -euo pipefail
          # greedy-continue the public 512-token prompt with THIS machine's model
          .build/release/mlxfast-swift generate-golden \
            --prompt-file correctness_prompts/public_longcopy_gate_english_512.txt \
            --weights weights \
            --tokenizer "${MLXFAST_REFERENCE_DIR}" \
            --output oracle_src.json \
            --name benchoracle \
            --steps 200
          # assemble a BenchmarkGolden from [c0,c1,...] (see measureDecode indexing)
          python3 - <<'PY'
          import json
          gen = json.load(open("oracle_src.json"))
          c = gen["cases"][0]
          prompt = c["prompt_tokens"]; exp = c["expected_tokens"]
          assert len(prompt) == 512, ("prompt", len(prompt))
          assert len(exp) >= 129, ("exp", len(exp))
          doc = {
              "version": 1,
              "cases": gen["cases"],
              "benchmark": {
                  "prefill_prompt_tokens": prompt,
                  "expected_prefill_token": exp[0],
                  "decode_seed_tokens": prompt,
                  "expected_decode_seed_token": exp[0],
                  "expected_decode_tokens": exp[1:],
              },
          }
          json.dump(doc, open("bench_oracle_golden.json", "w"))
          print(f"oracle assembled: prompt={len(prompt)} exp={len(exp)} decode_tokens={len(exp)-1}")
          PY
          test -s bench_oracle_golden.json

      - name: Sample timing-only windows back-to-back
        env:
          MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
          MLXFAST_SKIP_TRANSFORM: "1"
          MLXFAST_WEIGHTS_PATH: weights
          MLXFAST_CORRECTNESS_GOLDEN_PATH: bench_oracle_golden.json
          MLXFAST_BENCHMARK_CORRECTNESS_STEPS: "0"
          MLXFAST_BENCHMARK_CHECK_GATES: "0"
          PASSES: ${{ inputs.passes || '12' }}
        run: |
          set -uo pipefail
          echo "machine ${{ matrix.machine }}: ${PASSES} timing-only windows (128-step decode + cold prefill)"
          # columns: index epoch_seconds decode_s_per_tok prefill_s_per_tok
          : > "samples-${{ matrix.machine }}.txt"
          for i in $(seq 1 "${PASSES}"); do
            if [[ "${i}" == "1" ]]; then
              echo "== inline pilot: first timing-only window (verbose) =="
              rc=0; ./benchmark.sh || rc=$?
              echo "benchmark.sh exit=${rc}"
              ls -la score.json 2>/dev/null || echo "NO score.json"
              python3 - <<'PY' || true
          import json
          s=json.load(open("score.json")); m=s["metrics"]
          print("decode=",m.get("decode_seconds_per_token")," prefill=",m.get("prefill_seconds_per_token"),
                " passed=",s.get("passed")," error=",m.get("error"))
          PY
            else
              ./benchmark.sh >/dev/null 2>&1 || true
            fi
            ts=$(date +%s)
            read -r dec pre < <(python3 - <<'PY'
          import json
          try:
              m = json.load(open("score.json"))["metrics"]
              print(m.get("decode_seconds_per_token",""), m.get("prefill_seconds_per_token",""))
          except Exception:
              print("", "")
          PY
          )
            echo "${i} ${ts} ${dec} ${pre}" | tee -a "samples-${{ matrix.machine }}.txt"
          done
          echo "finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a host.txt
          cp host.txt "host-${{ matrix.machine }}.txt"

      - name: Upload machine samples
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-adjacency-oracle-${{ github.run_id }}-machine-${{ matrix.machine }}
          path: |
            samples-${{ matrix.machine }}.txt
            host-${{ matrix.machine }}.txt
          if-no-files-found: error
          retention-days: 14

  combine:
    name: combine
    needs: [sample]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download samples
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: gemma-adjacency-oracle-${{ github.run_id }}-machine-*
          path: samples
          merge-multiple: false
      - name: Ratio-vs-gap (does adjacency collapse the residual?)
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${GITHUB_STEP_SUMMARY}"
          import glob, os, re, statistics as st
          by = {}   # idx -> list of (elapsed_min, decode, prefill)
          for fp in sorted(glob.glob("samples/**/samples-*.txt", recursive=True)):
              idx = re.sub(r"^samples-(.+)\.txt$", r"\1", os.path.basename(fp))
              rows, t0 = [], None
              for line in open(fp):
                  parts = line.split()
                  if len(parts) < 4: continue
                  try:
                      e = float(parts[1]); d = float(parts[2]); p = float(parts[3])
                  except ValueError:
                      continue
                  if d <= 0 or p <= 0: continue
                  if t0 is None: t0 = e
                  rows.append(((e - t0)/60.0, d, p))
              if len(rows) >= 2: by[idx] = rows
          def cv(xs):
              m = st.mean(xs); return (st.pstdev(xs)/m*100.0) if m else float("nan")

          print("## Adjacency (oracle): ratio-vs-gap between two timed windows")
          print()
          print("Same code both sides => ratio~1.0 expected; spread = residual pairing cannot cancel.")
          print()
          print("| machine | n | decode mean | prefill mean | window spacing (min) |")
          print("|---|---|---|---|---|")
          spac = []
          for idx in sorted(by):
              r = by[idx]; d=[x[1] for x in r]; p=[x[2] for x in r]
              gaps=[r[i+1][0]-r[i][0] for i in range(len(r)-1)]
              if gaps: spac.append(st.mean(gaps))
              print(f"| {idx} | {len(r)} | {st.mean(d):.5f} | {st.mean(p):.5f} | {st.mean(gaps) if gaps else float('nan'):.2f} |")
          print()
          print("### Residual (ratio CV) as a function of window gap")
          print()
          print("| gap g | ~gap (min) | decode ratio CV | prefill ratio CV |")
          print("|---|---|---|---|")
          maxg = min(6, max((len(r) for r in by.values()), default=1)-1)
          out=[]
          for g in range(1, maxg+1):
              dr, pr, gm = [], [], []
              for idx in by:
                  r = by[idx]
                  for i in range(len(r)-g):
                      dr.append(r[i][1]/r[i+g][1]); pr.append(r[i][2]/r[i+g][2]); gm.append(r[i+g][0]-r[i][0])
              if not dr: continue
              out.append((g, st.median(gm), cv(dr), cv(pr)))
              print(f"| {g} | {st.median(gm):.1f} | {cv(dr):.1f}% | {cv(pr):.1f}% |")
          print()
          if out:
              adj = out[0]; bun = min(out, key=lambda x: abs(x[1]-8.0))
              print("### Verdict")
              print()
              print(f"- ADJACENT (gap {adj[1]:.1f} min): decode ratio CV **{adj[2]:.1f}%**, prefill ratio CV **{adj[3]:.1f}%**")
              print(f"- BUNDLED-like (gap {bun[1]:.1f} min): decode ratio CV **{bun[2]:.1f}%**, prefill ratio CV **{bun[3]:.1f}%**")
              works = adj[2] <= bun[2] and adj[3] <= bun[3]
              print()
              print("- **" + ("ADJACENCY WORKS: the ratio residual is tighter at the adjacent gap and grows "
                              "with gap. Measuring baseline+candidate timing back-to-back removes the thermal "
                              "drift from the scored ratio -- no cooldown needed."
                              if works else
                              "INCONCLUSIVE: residual does not clearly grow with gap (transient-dominated or windows too few).") + "**")
          print()
          print("> Windows are timing-only (no correctness) via a self-built oracle. Transient")
          print("> spikes still need median-of-N in the real harness.")
          PY
      - name: Upload combined
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-adjacency-oracle-${{ github.run_id }}-combined
          path: samples
          if-no-files-found: warn
          retention-days: 14
