name: dflash-benchmark

# EXPERIMENTAL RANKED TRACK: Poolside Laguna XS 2.1 DFlash (track id
# laguna-xs-2.1-dflash-v1). NOT ENABLED -- see the fail-closed track
# enablement interlock below.
#
# This is the ranked entrypoint declared by benchmark.dflash.json. It runs the
# trusted organizer-drafter block protocol pinned by
# fixtures/laguna_xs_2_1_dflash_track.json, using the organizer-provisioned
# DFlash draft model (a separate ~881 MB EAGLE-style speculator) against the
# pinned Laguna target. The DEFAULT serial ranked workflow remains
# benchmark.yml with its own manifest, benchmark.json; its score, baseline,
# calibration state, and leaderboard namespace are never mixed into this
# track.
#
# ENABLEMENT STATE: this track is INERT and is NOT the default. Three
#   independent locks hold it shut -- official_scoring_enabled is false in the
#   contract fixture, tokenFidelityGateStatus is pending-spec, and the hidden
#   timed-prompt pool is empty (the selection step fails closed on it). The
#   "Enforce track enablement" step is the standing guard: it rejects a
#   reverted contract, disabled publication, empty hidden-golden pins, or an
#   explicitly disabled dispatch. The dispatch input now defaults to FALSE;
#   the text below describing a true default is retained history from the
#   retired MTP track, which WAS live
#   without custom inputs. For submissions/* the contract is read from
#   trusted main, so a submission cannot flip the track on or off.
#
# ADOPTED SCORING (2026-07-14 scoring-decision memo; mirrors the serial
#   track's paired mechanics):
#   - ranked decode window: 512 parent-counted tokens (contract max);
#   - aggregation: RATIO-OF-MEANS across accepted pairs —
#       score = mean(serial s/tok) / mean(dflash s/tok);
#   - floor: aggregate >= 0.80 (floor applies to the aggregate, not per pair).
#     NOT 1.0: block decode itself costs ~16% on realistic prose, so an
#     unmodified candidate measures 0.840x. See the contract fixture's
#     proposed_scoring.component_floor for the derivation.
#   - pairs: minimum 3 accepted, target 4, alternating order;
#   - stall guardrail: a run with max block latency > 4x its p50 is rejected
#     as measurement-invalid, with one gated retry (owned by measure-dflash-job,
#     same class as its throttle rejection);
#   - hard bit-exact token gate across every timed run (parity_all_ok).
#
# WHAT A LIVE RUN DOES (after go-live):
#   1. Verifies the operator-provisioned Laguna target + DFlash drafter caches
#      against the checked-in byte manifests (every file, every run).
#   2. Builds the candidate through the bench-exec bridge and transforms the
#      Laguna target source into weights (sandboxed, network-denied).
#   3. Runs the untimed DFlash correctness/parity gate: one full-length
#      dflash-benchmark pass over the hidden Laguna correctness golden. The trusted
#      parent (the trusted DFlash harness) owns the timer, the serial oracle, and the
#      denominator; a single divergent token fails the run. Report stdout is
#      sealed in the trusted shell exactly like the serial gates score.
#   4. Scrubs hidden material back to the post-transform snapshot, reaps
#      bench processes, and waits for quiescence.
#   5. Runs the timed paired measurement LAST via the box-owned
#      MLXFAST_DFLASH_MEASURE_JOB (fixed 40C thermal contract, 2 Hz macmon
#      telemetry, throttle/telemetry rejection). Pairing discipline mirrors
#      the serial track: the decode-only denominator is the trusted serial
#      K=1 target decode (the dflash-probe path) executed from the PINNED,
#      operator-owned DFlash baseline tree; the numerator is the candidate's
#      dflash-benchmark decode over the SAME hidden benchmark golden, same
#      session, same silicon, alternating order, at least
#      MLXFAST_DFLASH_MIN_ACCEPTED_PAIRS accepted pairs. Worker-reported timing
#      has no authority anywhere; the parent divides its own wall time by
#      its own configured token total.
#   6. Applies the decode-only score contract in the trusted shell:
#        score = dflash_decode_speedup
#              = mean(serial s/tok over accepted pairs)
#                / mean(dflash s/tok over accepted pairs)   [ratio-of-means]
#        floor >= 0.80 on that aggregate, hard (see above: 1.0 would reject
#        honest sub-19% kernel wins, not regressions);
#        bit-exact gate: parity_all_ok must be true across every timed run.
#      There is no prefill component: the DFlash protocol charges seed prefill
#      inside the decode measurement.
#
# HOST CONTRACT (operator-provisioned, janitor-audited; consumed, never
# installed, by this workflow — see the DFlash go-live runbook):
#   MLXFAST_DFLASH_TARGET_DIR / MLXFAST_DFLASH_ASSISTANT_DIR
#       Read-only runner-owned caches holding exactly the files pinned by
#       fixtures/reference_laguna_xs_2_1_nvfp4_mlx.sha256 and
#       fixtures/dflash_laguna_xs_2_1_drafter.sha256 (setup-dflash.sh
#       layout).
#   MLXFAST_DFLASH_BASELINE_WS
#       Pinned prebuilt challenge-repo tree (trusted ref) with weights
#       already transformed; the serial dflash-probe denominator runs from
#       here, never from the candidate workspace, so a submission cannot
#       slow the reference to inflate its ratio.
#   MLXFAST_DFLASH_BASELINE_CALIBRATION
#       Operator calibration (fresh gated sessions, authored per the go-live
#       runbook at a ref containing the block-0 stall fix) with sanity bands
#       for the serial denominator.
#   MLXFAST_DFLASH_MEASURE_JOB
#       Box-owned timing wrapper (sibling of measure-job.sh) with the same
#       FIXED, non-overridable thermal-stability contract: per-phase
#       quiescence + reap, GPU < 40C gate before every timed phase (900 s
#       ceiling), 2 Hz macmon telemetry, throttle/telemetry rejection, one
#       gated retry, the 4x-p50 stall-guardrail rejection (also one gated
#       retry), baseline calibration band check, alternating-order pairs
#       (target --target-pairs, minimum --min-pairs accepted), per-side
#       BENCH_GOLDEN_PATH worker denial of the hidden benchmark golden, and
#       a sealed results.json whose aggregate carries the per-side
#       seconds/token means consumed by "Compute DFlash score and enforce
#       floor" below.
#
# Dispatch-only, same self-hosted safety rules as the serial pipeline: no
# PR/push triggers, refs restricted to main, submissions/*, baseline/*, and
# yukon/baseline/*. Submission branches contribute only the exact dispatched
# SHA's editablePaths over trusted main. Submitted-process logs are
# suppressed on submission branches. The static review runs with the DFlash
# track policy (MLXFAST_SUBMISSION_TRACK_ID=laguna-xs-2.1-dflash-v1).
on:
  workflow_dispatch:
    inputs:
      confirm_track_enabled:
        description: "Enablement interlock. Defaults FALSE: this track is inert (official_scoring_enabled is false and the hidden timed-prompt pool is empty, so the guard fails closed anyway). Inherited from the retired MTP track, where it defaulted true because that track was live. When the operator enables DFlash, flip the contract fixture AND this default together."
        required: false
        default: false
        type: boolean
      run_benchmark:
        description: "Run the timed paired DFlash measurement after the correctness/parity gate. false = correctness/parity only."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mlxfast-dflash-ranked-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dflash-ranked:
    name: "single-machine DFlash ranked benchmark (m5-laguna-dflash)"
    # DEDICATED label, deliberately NOT the serial track's `m5-bench`.
    #
    # Sharing `m5-bench` meant a DFlash dispatch could be picked up by a runner in
    # the LIVE ranked serial pool and occupy it for the length of a DFlash job --
    # transform, gates and four thermally-gated pairs. The two tracks also have
    # different box prerequisites (DFlash needs its own pinned baseline workspace
    # and per-track calibration), so a serial-pool box would fail the run at the
    # prerequisite check anyway.
    #
    # With a dedicated label an unserved dispatch QUEUES instead of running on the
    # wrong box, which is the safe failure for an inert track. Registering a runner
    # under this label is an operator action; until then no DFlash job can start,
    # which is intentional.
    runs-on: [self-hosted, m5-laguna-dflash]
    # Job budget: build (~15m) + IT transform (~10m) + artifact hashing of
    # the 18.4 GB source (~3m) + full-length parity pass (~15m) + cooldowns
    # (up to 900s per timed phase) + >=3 alternating timed pairs. Generous
    # until the track has its own timing history.
    timeout-minutes: 360
    environment: benchmark-private-prompts
    env:
      # --- Host contract (see header; operator-provisioned, janitor-audited).
      MLXFAST_BENCH_EXEC: /opt/bench/bench-exec.sh
      MLXFAST_JANITOR: /opt/bench/janitor.sh
      MLXFAST_QUARANTINE_FLAG: /opt/bench/quarantine.flag
      MLXFAST_MACMON: /opt/bench-runner/bin/macmon
      MLXFAST_DFLASH_MEASURE_JOB: /opt/bench-runner/measure-dflash-job.sh
      # Per-track, and NOT the retired MTP paths this scaffolding was restored
      # from: /opt/bench-runner/mtp-baseline/current and
      # /opt/bench-runner/state/mtp-baseline-calibration.json do not exist on any
      # box, so a ranked run died at the prerequisite check (exit 8). The
      # calibration path in particular must stay inside the per-track state dir --
      # measure-dflash-job.sh's own header warns that the bare
      # /opt/bench-runner/state is the SERIAL track's and that banding DFlash runs
      # against serial numbers would cross-write the serial oracle cache.
      MLXFAST_DFLASH_BASELINE_WS: /opt/bench-runner/baseline/laguna-xs-2.1-dflash-v1/current
      MLXFAST_DFLASH_BASELINE_CALIBRATION: /opt/bench-runner/state/laguna-xs-2.1-dflash-v1/baseline-calibration.json
      MLXFAST_MEASURE_STATE_DIR: /opt/bench-runner/state/laguna-xs-2.1-dflash-v1
      MLXFAST_DFLASH_TARGET_DIR: /opt/bench-runner/cache/huggingface/hub/models--poolside--Laguna-XS-2.1-NVFP4-mlx/snapshots/841778bda563a36104dd521e37d99218e46f4f25
      MLXFAST_DFLASH_ASSISTANT_DIR: /opt/bench-runner/cache/dflash/laguna-xs-2.1-dflash-v1/assistant
      # Bench workspace: distinct stable path from the serial track's
      # ranked-current (same /Users/Shared/bench-jobs confinement contract,
      # same absolute-path build-cache reasoning as serial-benchmark.yml).
      MLXFAST_JOB_WS: /Users/Shared/bench-jobs/dflash-ranked-current
      # --- Runner-only private material (0700 runner).
      MLXFAST_PRIVATE_DIR: /tmp/mlxfast-dflash-private-${{ github.run_id }}-${{ github.run_attempt }}
      # Distinct from the serial track's artifact run root while satisfying
      # stage-benchmark-artifacts.sh's /tmp/mlxfast-artifacts- prefix contract
      # (run component "dflash-<run>-<attempt>", which is what the value below
      # actually spells).
      MLXFAST_ARTIFACT_ROOT: /tmp/mlxfast-artifacts-dflash-${{ github.run_id }}-${{ github.run_attempt }}
      MLXFAST_MEASURE_OUT: /tmp/mlxfast-dflash-measure-${{ github.run_id }}-${{ github.run_attempt }}
      # --- Track contract.
      MLXFAST_DFLASH_TRACK_ID: laguna-xs-2.1-dflash-v1
      MLXFAST_DFLASH_CONTRACT_PATH: fixtures/laguna_xs_2_1_dflash_track.json
      # The BENCHMARK MANIFEST (editablePaths / scoring), as distinct from the
      # track contract fixture above. Passed as CONTRACT_PATH to both
      # enforce-modifiable-surface.sh and overlay-editable-paths.sh so a DFlash
      # submission is judged and overlaid against the DFlash editable surface
      # (which includes nine DFlash-only files benchmark.json does not list)
      # rather than the serial track's.
      MLXFAST_DFLASH_EDITABLE_SURFACE_CONTRACT: benchmark.dflash.json
      MLXFAST_DFLASH_TARGET_MANIFEST_PATH: fixtures/reference_laguna_xs_2_1_nvfp4_mlx.sha256
      MLXFAST_DFLASH_ASSISTANT_MANIFEST_PATH: fixtures/dflash_laguna_xs_2_1_drafter.sha256
      # Decode-only score contract (adopted 2026-07-14; see header). Keep in
      # sync with the contract fixture's proposed_scoring block; the floor is
      # HARD (a DFlash submission that is not actually faster than trusted
      # serial decode does not rank) and applies to the ratio-of-means
      # aggregate over the accepted pairs.
      #
      # Block size 3, derived from LONG-CONTEXT measurement -- not from the
      # short-prompt sweep that originally suggested 8. Measured on M5-C with a
      # 1755-token prompt (64 decode tokens, base 81.5 tok/s):
      #   K=2 0.82x | K=3 1.09x | K=4 1.06x | K=6 0.95x | K=8 0.92x | K=16 0.79x
      # Acceptance saturates at ~1.33 accepted drafts for every K >= 6, so larger
      # blocks only add wasted verify rows. K=8 -- the short-prompt optimum, where
      # it reached 1.86x -- sits BELOW the 1.0 floor at realistic context. See
      # docs/dflash-track-correctness-contract.md Amendment 5.
      MLXFAST_DFLASH_BLOCK_SIZE: "3"
      MLXFAST_DFLASH_DECODE_TOKENS: "512"
      MLXFAST_DFLASH_CORRECTNESS_TOKENS: "512"
      # 0.80, matching scoring.decodeSpeedupFloor in benchmark.dflash.json, the
      # contract fixture, and MIN_ACCEPTED_SPEEDUP in the box wrapper. This is a
      # FIFTH place the floor lives: the score is recomputed here in the trusted
      # shell from the sealed per-side means and gated against this value, so a
      # 1.0 here would override the 0.80 everywhere else at go-live. On this track
      # 1.0 is not the no-change line -- block decode costs ~16% on realistic
      # prose, so an unmodified candidate measures 0.87 (measured end-to-end
      # 2026-07-30: ACCEPT, 4/4 pairs, 0.8705).
      MLXFAST_DFLASH_DECODE_SPEEDUP_FLOOR: "0.80"
      MLXFAST_DFLASH_MIN_ACCEPTED_PAIRS: "3"
      MLXFAST_DFLASH_TARGET_PAIRS: "4"
      # Contract layer L6: attributable ranked failures allowed per submission
      # branch before further attempts are refused. Sized so honest iteration
      # (a genuine correctness or floor miss, fixed and resubmitted) stays
      # possible while submit-until-green against a sampled prompt pool of N
      # does not pay: with a pool of 8 and 5 attempts the chance of clearing a
      # tuned threshold on every sampled target is negligible.
      MLXFAST_DFLASH_MAX_RANKED_FAILURES: "5"
      # Hidden IT-target golden pins, frozen 2026-07-15 on M5 silicon from the
      # pinned IT target at the post-stall-fix tip (go-live runbook step B;
      # capture record in the operator private store). PENDING box-2 replay
      # confirmation: if the serving box's stack diverges on any near-tie
      # argmax, the goldens are regenerated there and these pins updated
      # before this change merges. The enablement gate fails closed if any
      # pin is emptied. (The R2 object KEYS are deliberately scoped to the
      # one trusted download step, exactly like the serial pipeline.)
      MLXFAST_DFLASH_CORRECTNESS_GOLDEN_SHA256: d4fff3fe015123c395be68cb19401709ec288e44a04e52c2ea36c32220356862
      MLXFAST_DFLASH_CORRECTNESS_GOLDEN_BYTES: "14683"
      MLXFAST_DFLASH_BENCH_GOLDEN_SHA256: a472d6e40c3bada936fa39535753fec609d836e709db03274222a4a303ae6f58
      MLXFAST_DFLASH_BENCH_GOLDEN_BYTES: "14982"
      # --- REUSED SERIAL GATE CONTRACT --------------------------------------
      # Copied VERBATIM from .github/workflows/benchmark.yml. This track does not
      # own a second correctness/GPQA implementation: the four gate steps below
      # ("Public behavior gate", "Attach GPQA gates and verify augmented
      # golden", "Correctness and gates", "Semantic GPQA gate") are the SERIAL
      # track's live, calibrated steps re-hosted here and pointed at this job's
      # build. That works because a DFlash submitter edits the same vendored
      # model and kernel surface a serial submitter does and this job builds the
      # same .build/release/mlxfast-swift + .build-worker/release/
      # mlxfast-runtime-worker, so the serial hidden goldens are already valid
      # inputs and the serial gates already prove the model is still sound --
      # which is the whole guarantee these gates are here to give.
      #
      # NOTHING BELOW IS RETUNED FOR DFLASH. Keep every value in lockstep with
      # benchmark.yml; a divergence here silently weakens a gate on one track
      # only, which is exactly how these two workflows drifted last time.
      #
      # The ONE renamed input: the serial gates read MLXFAST_REFERENCE_DIR,
      # while this workflow calls the same directory MLXFAST_DFLASH_TARGET_DIR.
      # They are the SAME pinned Laguna snapshot, verified against the SAME
      # fixtures/reference_laguna_xs_2_1_nvfp4_mlx.sha256 manifest, so the
      # duplication is safe -- and "DFlash host preflight" asserts the two
      # strings are equal so it cannot rot. It is spelled as a literal because
      # job-level env cannot read the `env` context.
      MLXFAST_REFERENCE_DIR: /opt/bench-runner/cache/huggingface/hub/models--poolside--Laguna-XS-2.1-NVFP4-mlx/snapshots/841778bda563a36104dd521e37d99218e46f4f25
      # Trusted final-artifact shape contract; keep in sync with
      # MLXFastConstants.numHiddenLayers.
      MLXFAST_EXPECTED_NUM_LAYERS: "40"
      # The transform already ran and was hashed above, so the gates pass does
      # not re-verify it. Serial takes this from a dispatch input this workflow
      # deliberately does not expose.
      MLXFAST_VERIFY_TRANSFORM: "0"
      MLXFAST_ANTHROPIC_PRESENT: ${{ secrets.ORG_ANTHROPIC_API_KEY != '' && '1' || '0' }}
      # Runner-private trusted copies (the private dir is 0700 runner, so
      # neither the bench parent nor the worker can read them).
      MLXFAST_CORRECTNESS_GOLDEN_PATH: /tmp/mlxfast-dflash-private-${{ github.run_id }}-${{ github.run_attempt }}/correctness_golden.json
      MLXFAST_SEMANTIC_GPQA_RESULTS_PATH: /tmp/mlxfast-dflash-private-${{ github.run_id }}-${{ github.run_attempt }}/semantic_gpqa_results.json
      # Serial hidden pins. The private R2 object KEYS stay scoped to the one
      # trusted download step (never job level), exactly as in benchmark.yml.
      MLXFAST_RAW_CORRECTNESS_GOLDEN_SHA256: 94239d59b435eb8f370c82bcf8c86822d1bbc1094e3650aeff3abc5558137023
      MLXFAST_RAW_CORRECTNESS_GOLDEN_BYTES: "35892"
      MLXFAST_GPQA_REFERENCE_SHA256: 6e149e58908d086091ed7e7980e9f8beca7deb4d04063035d68d23e70ee1726f
      MLXFAST_GPQA_REFERENCE_BYTES: "13534"
      MLXFAST_EXPECTED_CORRECTNESS_STEPS: "64"
      MLXFAST_BENCHMARK_CORRECTNESS_STEPS: "64"
      # Keep in sync with MLXFastConstants.{correctnessGPQACaseCount,
      # correctnessGPQAMaxNewTokens,semanticGPQACaseCount,
      # semanticGPQAMaxNewTokens,semanticGPQAMinPassCount}.
      MLXFAST_GPQA_CASE_COUNT: "9"
      MLXFAST_GPQA_MAX_NEW_TOKENS: "128"
      # Must equal MLXFAST_GPQA_CASE_COUNT (gpqa_ttft_case_count is derived per
      # attached case).
      MLXFAST_GPQA_TTFT_CASE_COUNT: "9"
      MLXFAST_SEMANTIC_GPQA_CASE_COUNT: "9"
      MLXFAST_SEMANTIC_GPQA_MAX_NEW_TOKENS: "128"
      # 7 of 9, calibrated ON THE SERIAL TRACK from 27 self-match runs / 243
      # judgements (9/9 every time, zero variance): each damaged answer costs
      # exactly one case, and >= 6 is required to reject a submission that
      # hardcodes one fixed letter (which can match at most 5 of 9). This is a
      # measured number, not a prediction -- do not retune it for this track.
      MLXFAST_SEMANTIC_GPQA_MIN_PASS: "7"
      # REQUIRED, not advisory. For GPQA behavior cases the exact-token
      # comparison is hardcoded to pass
      # (LagunaRuntimeCorrectnessCompare.swift), so the semantic judge plus the
      # GPQA TTFT coverage check are the ONLY things standing between a
      # semantically damaged model and a green ranked run.
      MLXFAST_SEMANTIC_GPQA_REQUIRED: "1"
      MLXFAST_SEMANTIC_GPQA_MODEL: claude-opus-4-8
      # Public drift tripwire: the checked-in, M5-generated fixture the serial
      # track gates on, run BEFORE any hidden byte enters the workspace.
      MLXFAST_PUBLIC_CORRECTNESS_PROMPT_PATH: correctness_prompts/public_longcopy_gate_english_512.txt
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH: correctness_prompts/public_longcopy_gate_english_512_256.json
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_SHA256: b9509697c08a2cf3c2943a85f0b76e39c485c441794690fa76835b40a58d7a63
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_BYTES: "10686"
      # --- Benchmark plumbing (shared with serial-benchmark.yml).
      MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
      MLXFAST_PRIVATE_PROMPTS_R2_PRESENT: ${{ (secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_BUCKET_ENDPOINT != '' && secrets.R2_SECRET_ACCESS_KEY != '') && '1' || '0' }}
      MLXFAST_RUN_BENCHMARK: ${{ inputs.run_benchmark && '1' || '0' }}
      MLXFAST_CANDIDATE_SHA: ${{ github.sha }}
      MLXFAST_IS_SUBMISSION_BRANCH: ${{ startsWith(github.ref, 'refs/heads/submissions/') && '1' || '0' }}
      # Same operator-pinned Metal toolchain as the serial ranked build.
      MLXFAST_METAL_TOOLCHAIN_IDENTIFIER: com.apple.dt.toolchain.Metal.32023.883
    steps:
      # Fail fast if the box is quarantined or the isolation stack is missing,
      # before any checkout or secret use. DFlash-specific host paths are only
      # asserted after the enablement gate (they do not exist until go-live).
      - name: Host preflight
        run: |
          set -euo pipefail
          echo "host=$(hostname) chip=$(sysctl -n machdep.cpu.brand_string) user=$(id -un) uid=$(id -u)"
          if [[ -e "${MLXFAST_QUARANTINE_FLAG}" ]]; then
            echo "::error::box is quarantined (${MLXFAST_QUARANTINE_FLAG}); janitor detected drift -- see RUNBOOK" >&2
            exit 1
          fi
          test -e "${MLXFAST_BENCH_EXEC}" || { echo "::error::bench-exec bridge missing" >&2; exit 1; }
          test -e "${MLXFAST_JANITOR}" || { echo "::error::janitor missing" >&2; exit 1; }

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Submission branches contribute editable paths only; trusted main
          # is the harness/workflow/contract base (including the enablement
          # fixture read below). Main, baseline/*, and yukon/baseline/* run
          # their exact SHA.
          ref: ${{ startsWith(github.ref, 'refs/heads/submissions/') && 'main' || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce trusted workflow context
        run: .github/scripts/enforce-trusted-dflash-benchmark-workflow.sh

      # Standing fail-closed gate. Order matters: this runs before any secret
      # use, submitted-code handling, or bench execution.
      - name: Enforce DFlash track enablement
        env:
          CONFIRM_TRACK_ENABLED: ${{ inputs.confirm_track_enabled && '1' || '0' }}
        run: |
          set -euo pipefail
          test -s "${MLXFAST_DFLASH_CONTRACT_PATH}"
          track_id="$(jq -r '.track_id' "${MLXFAST_DFLASH_CONTRACT_PATH}")"
          if [[ "${track_id}" != "${MLXFAST_DFLASH_TRACK_ID}" ]]; then
            echo "::error::contract track_id ${track_id} does not match workflow track ${MLXFAST_DFLASH_TRACK_ID}" >&2
            exit 1
          fi
          scoring_enabled="$(jq -r '.official_scoring_enabled' "${MLXFAST_DFLASH_CONTRACT_PATH}")"
          publication_allowed="$(jq -r '.reference_baseline.publication_allowed' "${MLXFAST_DFLASH_CONTRACT_PATH}")"
          if [[ "${scoring_enabled}" != "true" || "${publication_allowed}" != "true" ]]; then
            echo "::error::DFlash track ${MLXFAST_DFLASH_TRACK_ID} is NOT enabled (official_scoring_enabled=${scoring_enabled}, reference_baseline.publication_allowed=${publication_allowed}). This workflow is deliberately inert until the operator completes the DFlash go-live runbook and flips both trusted-contract fields on main." >&2
            exit 1
          fi
          for pin_name in \
            MLXFAST_DFLASH_CORRECTNESS_GOLDEN_SHA256 \
            MLXFAST_DFLASH_CORRECTNESS_GOLDEN_BYTES \
            MLXFAST_DFLASH_BENCH_GOLDEN_SHA256 \
            MLXFAST_DFLASH_BENCH_GOLDEN_BYTES; do
            if [[ -z "${!pin_name}" ]]; then
              echo "::error::hidden DFlash golden pin ${pin_name} is empty; freeze the DFlash target goldens (go-live runbook step B) and pin them here before enabling the track" >&2
              exit 1
            fi
          done
          if [[ "${CONFIRM_TRACK_ENABLED}" != "1" ]]; then
            echo "::error::DFlash track enablement interlock is disabled; dispatch requires confirm_track_enabled=true" >&2
            exit 1
          fi
          echo "dflash-benchmark: track ${MLXFAST_DFLASH_TRACK_ID} enablement verified"

      # DFlash-specific host contract, asserted only once the track is live.
      - name: DFlash host preflight
        run: |
          set -euo pipefail
          test -x "${MLXFAST_DFLASH_MEASURE_JOB}" || { echo "::error::measure-dflash-job missing" >&2; exit 1; }
          test -x "${MLXFAST_MACMON}" || { echo "::error::macmon missing" >&2; exit 1; }
          test -f "${MLXFAST_DFLASH_TARGET_DIR}/config.json" || { echo "::error::DFlash target cache missing" >&2; exit 1; }
          test -f "${MLXFAST_DFLASH_ASSISTANT_DIR}/config.json" || { echo "::error::DFlash drafter cache missing" >&2; exit 1; }
          # The reused serial gate steps read MLXFAST_REFERENCE_DIR; this
          # workflow calls the same directory MLXFAST_DFLASH_TARGET_DIR. Job-level
          # env cannot reference the env context, so the path is spelled twice --
          # assert the two spellings are the same string so the duplication can
          # never rot into "the serial gates checked a different checkpoint".
          if [[ "${MLXFAST_REFERENCE_DIR}" != "${MLXFAST_DFLASH_TARGET_DIR}" ]]; then
            echo "::error::MLXFAST_REFERENCE_DIR (${MLXFAST_REFERENCE_DIR}) must be the same path as MLXFAST_DFLASH_TARGET_DIR (${MLXFAST_DFLASH_TARGET_DIR}); the reused serial correctness/GPQA gates and the DFlash target must be the same pinned checkpoint" >&2
            exit 1
          fi
          if [[ "${MLXFAST_RUN_BENCHMARK}" == "1" ]]; then
            test -d "${MLXFAST_DFLASH_BASELINE_WS}" || { echo "::error::pinned DFlash baseline workspace missing" >&2; exit 1; }
            test -s "${MLXFAST_DFLASH_BASELINE_CALIBRATION}" || { echo "::error::DFlash baseline calibration missing" >&2; exit 1; }
          fi

      - name: Capture candidate commit
        id: candidate_context
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate SHA must be an exact 40-character lowercase commit SHA" >&2
            exit 1
          fi
          trusted_main_sha="$(git rev-parse HEAD)"
          printf '%s\n' "${CANDIDATE_SHA}" > candidate.sha
          printf 'trusted_main_sha=%s\n' "${trusted_main_sha}" >> "${GITHUB_OUTPUT}"

      # CONTRACT LAYER L6, second half (the pool is the first half). Sampling a
      # timed target per run makes a tuned threshold a 1/N gamble; rate limiting
      # is what stops the gamble being repeated for free. Only failures a
      # PARTICIPANT is responsible for count -- an overloaded judge API, a
      # thermal reject or a nondeterministic reference is an operator fault and
      # must never consume a submitter's budget (see the recorder step near the
      # end, which only increments for dflash_*/floor/correctness categories).
      - name: Enforce DFlash ranked-failure rate limit
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        run: |
          set -euo pipefail
          limit="${MLXFAST_DFLASH_MAX_RANKED_FAILURES}"
          counts_dir="${MLXFAST_MEASURE_STATE_DIR}/failure-counts"
          mkdir -p "${counts_dir}"
          # Branch names are attacker-influenced, so derive the filename from a
          # digest rather than from the ref text itself.
          branch_key="$(printf '%s' "${GITHUB_REF}" | shasum -a 256 | awk '{print $1}')"
          counter="${counts_dir}/${branch_key}.count"
          used=0
          if [[ -s "${counter}" ]]; then
            used="$(tr -dc '0-9' < "${counter}")"
            used="${used:-0}"
          fi
          # NOTE: the private audit copy of this branch key is written by
          # "Prepare bench workspace" below, which is the step that creates
          # MLXFAST_PRIVATE_DIR. It used to be written HERE, against a directory
          # that does not exist until ~10 steps later, with the failure swallowed
          # by `2>/dev/null || true` -- so the record was never produced.
          if [[ "${used}" -ge "${limit}" ]]; then
            echo "::error::this submission branch has used ${used} of ${limit} attributable ranked DFlash attempts; further attempts are rate limited" >&2
            exit 1
          fi
          echo "dflash-benchmark: attributable ranked failures for this branch: ${used}/${limit}"

      - name: Checkout submitted editable paths
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          path: .mlxfast-submission-src
          fetch-depth: 0
          persist-credentials: false

      - name: Verify submitted commit and modifiable surface
        id: verify_submission
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        env:
          SUBMISSION_REF: ${{ github.sha }}
          TRUSTED_MAIN_SHA: ${{ steps.candidate_context.outputs.trusted_main_sha }}
        run: |
          set -euo pipefail
          hardened_git="${GITHUB_WORKSPACE}/.github/scripts/hardened-git.sh"
          actual_sha="$("${hardened_git}" -C .mlxfast-submission-src rev-parse HEAD)"
          if [[ "${actual_sha}" != "${SUBMISSION_REF}" ]]; then
            echo "::error::submitted checkout resolved to ${actual_sha}, expected ${SUBMISSION_REF}" >&2
            exit 1
          fi
          if ! "${hardened_git}" -C .mlxfast-submission-src cat-file -e "${TRUSTED_MAIN_SHA}^{commit}"; then
            echo "::error::submitted checkout cannot resolve trusted main commit ${TRUSTED_MAIN_SHA}" >&2
            exit 1
          fi
          base_sha="$("${hardened_git}" -C .mlxfast-submission-src merge-base "${TRUSTED_MAIN_SHA}" "${actual_sha}")"
          if [[ "${base_sha}" != "${TRUSTED_MAIN_SHA}" ]]; then
            echo "::error::submission must be based on current trusted main ${TRUSTED_MAIN_SHA}; merge-base is ${base_sha}" >&2
            exit 1
          fi
          # CONTRACT_PATH is load-bearing, not cosmetic: without it the script
          # defaults to benchmark.json (the SERIAL contract) and a DFlash
          # submitter's edits to the nine DFlash-only editablePaths are rejected
          # as "outside the modifiable surface" -- while "Overlay submitted
          # editable paths" below, reading the same default, silently does not
          # overlay them. Both invocations must name the DFlash contract.
          (
            cd .mlxfast-submission-src
            BASE_SHA="${base_sha}" HEAD_SHA="${actual_sha}" \
              CONTRACT_PATH="${MLXFAST_DFLASH_EDITABLE_SURFACE_CONTRACT}" \
              "${GITHUB_WORKSPACE}/.github/scripts/enforce-modifiable-surface.sh"
          )
          if ! "${hardened_git}" cat-file -e "${actual_sha}^{commit}"; then
            "${hardened_git}" fetch --no-tags .mlxfast-submission-src "${actual_sha}"
          fi
          "${hardened_git}" cat-file -e "${actual_sha}^{commit}"
          printf 'base_sha=%s\n' "${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "dflash-benchmark: verified submitted commit ${actual_sha} against base ${base_sha}"

      # Static review with the DFlash-track policy: organizer-assistant,
      # target-verified block speculation is permitted; prompt lookup,
      # assistant substitution, unverified drafts, timing forgery, and
      # cross-request future state remain fail-worthy.
      - name: Review submitted code for benchmark bypasses (DFlash policy)
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ORG_ANTHROPIC_API_KEY }}
          HEAD_SHA: ${{ github.sha }}
          REVIEW_BASE_SHA: ${{ steps.verify_submission.outputs.base_sha }}
        run: |
          set -euo pipefail
          (
            cd .mlxfast-submission-src
            MLXFAST_SUBMISSION_TRACK_ID="${MLXFAST_DFLASH_TRACK_ID}" \
            MLXFAST_SUBMISSION_REVIEW_BASE_SHA="${REVIEW_BASE_SHA}" \
              "${GITHUB_WORKSPACE}/.github/scripts/run-submission-static-review.sh"
          )

      - name: Overlay submitted editable paths
        if: ${{ startsWith(github.ref, 'refs/heads/submissions/') }}
        env:
          SUBMISSION_WORKTREE: .mlxfast-submission-src
          # Must match the CONTRACT_PATH the surface enforcement above used, or
          # the overlay silently drops files the enforcement just accepted.
          CONTRACT_PATH: ${{ env.MLXFAST_DFLASH_EDITABLE_SURFACE_CONTRACT }}
        run: .github/scripts/overlay-editable-paths.sh

      - name: Remove submitted checkout
        if: ${{ always() && startsWith(github.ref, 'refs/heads/submissions/') }}
        run: |
          set -euo pipefail
          rm -rf .mlxfast-submission-src
          test ! -e .mlxfast-submission-src

      # Same Seatbelt-semantics probe as the serial pipeline: this host's
      # sandbox-exec must still deny golden reads, private-dir reads,
      # non-workspace writes, network, and fork/exec under a worker profile.
      - name: Probe runtime worker sandbox
        run: .github/scripts/probe-runtime-worker-sandbox.sh

      # The hidden DFlash goldens come from R2 in both correctness-only and
      # timed dispatches, so the secrets must be present either way.
      - name: Check private material present
        run: |
          set -euo pipefail
          if [[ "${MLXFAST_PRIVATE_PROMPTS_R2_PRESENT}" != "1" ]]; then
            echo "::error::hidden DFlash goldens require private R2 secrets" >&2
            exit 1
          fi
          # Copied from benchmark.yml. The reused semantic GPQA gate is
          # REQUIRED (see MLXFAST_SEMANTIC_GPQA_REQUIRED), so an unreachable
          # judge must fail the run -- and must fail HERE, before ~25 minutes of
          # build and transform, not after them.
          if [[ "${MLXFAST_ANTHROPIC_PRESENT}" != "1" ]]; then
            echo "::error::semantic GPQA gate requires ORG_ANTHROPIC_API_KEY" >&2
            exit 1
          fi

      # Full content hash of every target and assistant cache file against
      # the checked-in manifests, every run, plus a strict flat-inventory
      # check — a corrupted or swapped cache can never feed the transform or
      # the assistant load. (The runtime revalidates through
      # the trusted DFlash provenance check as well; this is the trusted-shell anchor.)
      - name: Verify DFlash target and drafter caches against pinned manifests
        run: |
          set -euo pipefail
          verify_cache() {
            local manifest="$1" root="$2" label="$3"
            test -s "${manifest}"
            local failures=0 checked=0
            local expected_names=()
            while read -r want_hash want_bytes rel_path; do
              [[ -z "${want_hash}" || "${want_hash}" == \#* ]] && continue
              expected_names+=("${rel_path}")
              local path="${root}/${rel_path}"
              if [[ ! -f "${path}" || -L "${path}" ]]; then
                echo "::error::${label} file missing or not a regular file: ${rel_path}" >&2
                failures=$((failures + 1))
                continue
              fi
              local actual_bytes actual_hash
              actual_bytes="$(wc -c < "${path}" | tr -d ' ')"
              actual_hash="$(shasum -a 256 "${path}" | awk '{print $1}')"
              if [[ "${actual_bytes}" != "${want_bytes}" || "${actual_hash}" != "${want_hash}" ]]; then
                echo "::error::${label} file mismatch: ${rel_path}" >&2
                failures=$((failures + 1))
              fi
              checked=$((checked + 1))
            done < "${manifest}"
            while IFS= read -r existing; do
              local name found expected
              name="$(basename "${existing}")"
              found=0
              for expected in "${expected_names[@]}"; do
                if [[ "${name}" == "${expected}" ]]; then
                  found=1
                  break
                fi
              done
              if [[ "${found}" != "1" ]]; then
                echo "::error::unexpected file in ${label} cache: ${existing}" >&2
                failures=$((failures + 1))
              fi
            done < <(find "${root}" -mindepth 1 -maxdepth 1 -print)
            if [[ "${failures}" -ne 0 || "${checked}" -eq 0 ]]; then
              echo "::error::${label} cache failed manifest verification (checked=${checked} failures=${failures})" >&2
              exit 1
            fi
            echo "dflash-benchmark: ${label} cache verified against pinned manifest (${checked} files)"
          }
          verify_cache "${MLXFAST_DFLASH_TARGET_MANIFEST_PATH}" "${MLXFAST_DFLASH_TARGET_DIR}" "DFlash target"
          verify_cache "${MLXFAST_DFLASH_ASSISTANT_MANIFEST_PATH}" "${MLXFAST_DFLASH_ASSISTANT_DIR}" "DFlash drafter"

      # Trusted caches are RESTORE-ONLY here: only main-ref dispatches of the
      # legacy serial-benchmark.yml may save into the trusted cache namespaces (the
      # same anti-poisoning gate), and this workflow never saves at all.
      - name: Restore trusted SwiftPM dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
            .build-worker/checkouts
            .build-worker/repositories
            .build-worker/artifacts
            .build-worker/workspace-state.json
          key: swiftpm-trusted-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Compute MLX Metal library cache fingerprint
        id: mlx_metallib_fingerprint
        run: |
          set -euo pipefail
          cmake_bin="$(command -v cmake 2>/dev/null || true)"
          if [[ -z "${cmake_bin}" ]]; then
            for candidate in /opt/homebrew/bin/cmake /usr/local/bin/cmake; do
              if [[ -x "${candidate}" ]]; then
                cmake_bin="${candidate}"
                break
              fi
            done
          fi
          test -x "${cmake_bin}"
          metal_toolchain_identifier="$(
            xcodebuild -showComponent MetalToolchain 2>/dev/null \
              | awk -F': ' '/Toolchain Identifier/ { print $2; exit }' \
              || true
          )"
          if [[ -n "${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" \
              && "${metal_toolchain_identifier}" != "${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" ]]; then
            echo "::error::installed Metal toolchain (${metal_toolchain_identifier:-none}) does not match the ranked pin (${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}); update the pin or the box deliberately" >&2
            exit 1
          fi
          # Same two-fingerprint scheme as the serial pipeline: the vendored
          # kernel sources of THIS (overlaid) work tree key the metallib
          # cache so a cached mlx.metallib can never mask participant kernel
          # edits; the base fingerprint keys the build-products caches.
          vendored_metal_fingerprint="$(tools/build-mlx-metallib.sh --print-fingerprint)"
          test "${#vendored_metal_fingerprint}" -eq 64
          base_fingerprint="$({
            printf '%s\n' mlx-metallib-m5-max-v2
            uname -m
            sysctl -n machdep.cpu.brand_string
            sw_vers -buildVersion
            xcodebuild -version
            printf 'METAL_TOOLCHAIN_IDENTIFIER=%s\n' "${metal_toolchain_identifier}"
            xcrun --sdk macosx --show-sdk-build-version
            if [[ -n "${metal_toolchain_identifier}" ]]; then
              TOOLCHAINS="${metal_toolchain_identifier}" xcrun -sdk macosx metal -v 2>&1
            else
              xcrun -sdk macosx metal -v 2>&1
            fi
            "${cmake_bin}" --version
            shasum -a 256 Package.swift Package.resolved tools/build-mlx-metallib.sh
          } | shasum -a 256 | awk '{print $1}')"
          test "${#base_fingerprint}" -eq 64
          fingerprint="$({
            printf 'BASE_FINGERPRINT=%s\n' "${base_fingerprint}"
            printf 'VENDORED_METAL_FINGERPRINT=%s\n' "${vendored_metal_fingerprint}"
          } | shasum -a 256 | awk '{print $1}')"
          test "${#fingerprint}" -eq 64
          printf 'sha256=%s\n' "${fingerprint}" >> "${GITHUB_OUTPUT}"
          printf 'base_sha256=%s\n' "${base_fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Restore trusted MLX Metal library cache
        id: restore_mlx_metallib_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .mlxfast-cache/mlx.metallib
            .mlxfast-cache/mlx.metallib.fingerprint
          key: mlx-metallib-m5-max-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.sha256 }}

      - name: Verify restored MLX Metal library
        env:
          CACHE_HIT: ${{ steps.restore_mlx_metallib_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "${CACHE_HIT}" == "true" ]]; then
            test -s .mlxfast-cache/mlx.metallib
            test -s .mlxfast-cache/mlx.metallib.fingerprint
            expected_record="mlxfast-metallib-fingerprint-v1 $(tools/build-mlx-metallib.sh --print-fingerprint)"
            restored_record="$(cat .mlxfast-cache/mlx.metallib.fingerprint)"
            if [[ "${restored_record}" != "${expected_record}" ]]; then
              echo "::warning::restored mlx.metallib does not match the vendored Metal sources in this work tree; discarding it so the bench build recompiles"
              /bin/rm -f .mlxfast-cache/mlx.metallib .mlxfast-cache/mlx.metallib.fingerprint
            fi
          else
            /bin/rm -f .mlxfast-cache/mlx.metallib .mlxfast-cache/mlx.metallib.fingerprint
          fi

      - name: Reset staged trusted build products
        run: /bin/rm -rf .mlxfast-cache/trusted-build .mlxfast-cache/worker-build

      - name: Restore trusted build products cache
        id: restore_build_products_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mlxfast-cache/trusted-build
          key: bench-trusted-build-products-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.base_sha256 }}

      - name: Restore worker build products cache
        id: restore_worker_build_products_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mlxfast-cache/worker-build
          key: bench-worker-build-products-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.mlx_metallib_fingerprint.outputs.base_sha256 }}

      - name: Verify restored build products
        env:
          TRUSTED_CACHE_HIT: ${{ steps.restore_build_products_cache.outputs.cache-hit }}
          WORKER_CACHE_HIT: ${{ steps.restore_worker_build_products_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "${TRUSTED_CACHE_HIT}" == "true" ]]; then
            test -d .mlxfast-cache/trusted-build/release
          else
            /bin/rm -rf .mlxfast-cache/trusted-build
          fi
          if [[ "${WORKER_CACHE_HIT}" == "true" ]]; then
            test -d .mlxfast-cache/worker-build/release
          else
            /bin/rm -rf .mlxfast-cache/worker-build
          fi

      # Same workspace discipline as the serial pipeline: proven-fresh stable
      # path, trusted resolve while networked, bench ACL grant, then explicit
      # bench-deny of every trusted surface (including fixtures/, which
      # carries the DFlash contract and manifests) and a runner-owned
      # bench-NON-writable staging dir for the predictable-name hidden golden.
      - name: Prepare bench workspace
        run: |
          set -euo pipefail
          rm -rf "${MLXFAST_JOB_WS}" || true
          if [[ -e "${MLXFAST_JOB_WS}" || -L "${MLXFAST_JOB_WS}" ]]; then
            echo "::error::stale bench workspace at ${MLXFAST_JOB_WS} could not be fully removed; run the janitor and retry" >&2
            exit 1
          fi
          cp -c -R "${GITHUB_WORKSPACE}" "${MLXFAST_JOB_WS}" 2>/dev/null \
            || { rm -rf "${MLXFAST_JOB_WS}"; cp -R "${GITHUB_WORKSPACE}" "${MLXFAST_JOB_WS}"; }
          .github/scripts/hardened-git.sh -C "${MLXFAST_JOB_WS}" cat-file -e "${MLXFAST_CANDIDATE_SHA}^{commit}"
          .github/scripts/hardened-git.sh -C "${MLXFAST_JOB_WS}" update-ref --no-deref HEAD "${MLXFAST_CANDIDATE_SHA}"
          if [[ -d "${MLXFAST_JOB_WS}/.mlxfast-cache/trusted-build/release" ]]; then
            rm -rf "${MLXFAST_JOB_WS}/.build"
            mv "${MLXFAST_JOB_WS}/.mlxfast-cache/trusted-build" "${MLXFAST_JOB_WS}/.build"
            echo "dflash-benchmark: seeded trusted build products into bench workspace"
          fi
          if [[ -d "${MLXFAST_JOB_WS}/.mlxfast-cache/worker-build/release" ]]; then
            rm -rf "${MLXFAST_JOB_WS}/.build-worker"
            mv "${MLXFAST_JOB_WS}/.mlxfast-cache/worker-build" "${MLXFAST_JOB_WS}/.build-worker"
            echo "dflash-benchmark: seeded worker build products into bench workspace"
          fi
          mkdir -p "${MLXFAST_PRIVATE_DIR}"
          chmod 700 "${MLXFAST_PRIVATE_DIR}"
          # Private audit record of the rate-limit branch key. Written HERE (not
          # in the rate-limit step, which runs ~10 steps before this directory
          # exists) and unconditionally fatal on failure, so a broken write is
          # visible instead of swallowed.
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" == "1" ]]; then
            printf '%s\n' "$(printf '%s' "${GITHUB_REF}" | shasum -a 256 | awk '{print $1}')" \
              > "${MLXFAST_PRIVATE_DIR}/dflash_branch_key"
          fi
          mkdir -p "${MLXFAST_JOB_WS}/private"
          mkdir -p "${MLXFAST_JOB_WS}/.dflash-ranked-src"
          # Staging dir for the REUSED serial hidden inputs. Deliberately named
          # .ranked-src -- serial's own name -- so the copied "Attach GPQA gates"
          # step stays byte-identical to benchmark.yml instead of being
          # retargeted (a retargeted copy is how these two workflows drifted).
          mkdir -p "${MLXFAST_JOB_WS}/.ranked-src"
          # Resolve dependencies for both SwiftPM roots while still trusted
          # and networked (the bench uid has a PF egress block).
          (cd "${MLXFAST_JOB_WS}" && swift package resolve --force-resolved-versions)
          (cd "${MLXFAST_JOB_WS}" && swift package resolve --force-resolved-versions --scratch-path .build-worker)
          /bin/chmod -R +a "user:bench allow list,search,readattr,readextattr,read,execute,add_file,add_subdirectory,delete_child,write,append,writeattr,writeextattr,file_inherit,directory_inherit" "${MLXFAST_JOB_WS}"
          /bin/chmod -R +a "user:bench deny write,append,writeattr,writeextattr,delete,delete_child,add_file,add_subdirectory,chown,file_inherit,directory_inherit" \
            "${MLXFAST_JOB_WS}/.github" \
            "${MLXFAST_JOB_WS}/tools" \
            "${MLXFAST_JOB_WS}/Sources" \
            "${MLXFAST_JOB_WS}/correctness_prompts" \
            "${MLXFAST_JOB_WS}/fixtures" \
            "${MLXFAST_JOB_WS}/.dflash-ranked-src" \
            "${MLXFAST_JOB_WS}/.ranked-src"
          /bin/chmod +a "user:bench deny write,append,writeattr,writeextattr,delete,chown" \
            "${MLXFAST_JOB_WS}/benchmark.sh" \
            "${MLXFAST_JOB_WS}/benchmark.json" \
            "${MLXFAST_JOB_WS}/benchmark.dflash.json" \
            "${MLXFAST_JOB_WS}/benchmark-dflash.sh" \
            "${MLXFAST_JOB_WS}/setup-dflash.sh" \
            "${MLXFAST_JOB_WS}/Package.swift" \
            "${MLXFAST_JOB_WS}/Package.resolved"
          echo "dflash-benchmark: bench workspace ready at ${MLXFAST_JOB_WS} (trusted harness surfaces ACL-locked against bench writes)"

      # Same trusted-source-scope pin as the serial pipeline: the manifests
      # and the trusted-harness source trees the bench build will compile
      # must match the trusted git content byte for byte.
      - name: Verify trusted source scope
        run: .github/scripts/verify-trusted-source-scope.sh "${GITHUB_WORKSPACE}" "${MLXFAST_JOB_WS}"

      # Same conditional-until-live PF egress preflight as the serial
      # pipeline, run before the first execution of submission-built code.
      - name: Assert bench network egress lockdown
        run: |
          set -euo pipefail
          probe="$(cat <<'PROBE'
            set -u
            [ -x /usr/bin/curl ] || exit 2
            rc=1
            for target in https://1.1.1.1 https://8.8.8.8; do
              if /usr/bin/curl --silent --show-error --max-time 5 --output /dev/null "${target}" 2>/dev/null; then
                echo "bench egress reached ${target}"
                rc=0
                break
              fi
            done
            exit "${rc}"
          PROBE
          )"
          runner_egress=0
          for target in https://1.1.1.1 https://8.8.8.8; do
            if /usr/bin/curl --silent --max-time 5 --output /dev/null "${target}" 2>/dev/null; then
              runner_egress=1
              break
            fi
          done
          if [[ "${runner_egress}" -ne 1 ]]; then
            echo "::warning::bench egress preflight cannot assess PF lockdown (trusted-uid egress probe failed; box appears offline); continuing -- trusted network steps will fail closed if the box is truly offline"
            exit 0
          fi
          bench_rc=0
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" /bin/bash -c "${probe}" || bench_rc=$?
          if [[ "${bench_rc}" -eq 1 ]]; then
            echo "dflash-benchmark: bench network egress lockdown verified (bench-uid egress blocked)"
            exit 0
          fi
          if [[ "${bench_rc}" -ne 0 ]]; then
            echo "::warning::bench egress preflight cannot assess PF lockdown (bench probe exited ${bench_rc}: curl unavailable or bridge error); continuing without a verdict"
            exit 0
          fi
          pf_provisioned=0
          if grep -Eisq 'mlxfast|darkbloom|bench[-_.]?egress|egress[-_.]?bench|uid[-_.]?560|user[[:space:]]+bench|user[[:space:]]+560([^0-9]|$)' /etc/pf.conf /etc/pf.anchors/* 2>/dev/null; then
            pf_provisioned=1
          fi
          if [[ "${MLXFAST_REQUIRE_BENCH_EGRESS_LOCKDOWN:-0}" == "1" ]]; then
            pf_provisioned=1
          fi
          if [[ "${pf_provisioned}" -eq 1 ]]; then
            echo "::error::bench network egress is NOT locked down (a bench-uid outbound connection succeeded) although the PF bench-egress lockdown is provisioned on this box; refusing to run submitted code" >&2
            exit 1
          fi
          echo "::warning::PF bench-egress lockdown not yet active on this box; egress preflight is dormant (bench-uid egress currently open). It will enforce automatically once the operator ships the PF lockdown."

      # Same two-root build discipline as the serial pipeline: the trusted
      # CLI builds in .build and the participant worker (which compiles the
      # participant-editable vendored MLX forks) in its own .build-worker
      # scratch root, as two separate bench-exec invocations.
      - name: Build trusted CLI in bench sandbox
        env:
          BENCH_JOB_ID: dflash-ranked-${{ github.run_id }}-${{ github.run_attempt }}-build
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1="${MLXFAST_JOB_WS}/*" \
              MLXFAST_METAL_TOOLCHAIN_IDENTIFIER="${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" /bin/bash -c '
              set -euo pipefail
              cd "${MJOB_WS}"
              /usr/bin/swift build -c release --force-resolved-versions --product mlxfast-swift
            '
          test -x "${MLXFAST_JOB_WS}/.build/release/mlxfast-swift"
          # Pin the trusted timer/gates/score artifacts before the
          # participant worker build runs (same reasoning as the serial
          # pipeline: worker-build-time code execution must not be able to
          # alter the trusted binary between its build and its pin).
          .github/scripts/pin-trusted-harness.sh write \
            "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted

      - name: Build participant worker in bench sandbox
        env:
          BENCH_JOB_ID: dflash-ranked-${{ github.run_id }}-${{ github.run_attempt }}-buildworker
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="${MLXFAST_JOB_WS}" \
              GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1="${MLXFAST_JOB_WS}/*" \
              MLXFAST_METAL_TOOLCHAIN_IDENTIFIER="${MLXFAST_METAL_TOOLCHAIN_IDENTIFIER}" /bin/bash -c '
              set -euo pipefail
              cd "${MJOB_WS}"
              /usr/bin/swift build -c release --force-resolved-versions --scratch-path .build-worker --product mlxfast-runtime-worker
              if [[ -s .mlxfast-cache/mlx.metallib && -s .mlxfast-cache/mlx.metallib.fingerprint ]]; then
                /bin/cp .mlxfast-cache/mlx.metallib .build-worker/release/mlx.metallib
                /bin/cp .mlxfast-cache/mlx.metallib.fingerprint .build-worker/release/mlx.metallib.fingerprint
                echo "dflash-benchmark: restored trusted MLX Metal library"
              else
                tools/build-mlx-metallib.sh
              fi
              /bin/chmod 0644 .build-worker/release/mlx.metallib .build-worker/release/mlx.metallib.fingerprint
            '
          test -x "${MLXFAST_JOB_WS}/.build-worker/release/mlxfast-runtime-worker"
          test -s "${MLXFAST_JOB_WS}/.build-worker/release/mlx.metallib"
          test -s "${MLXFAST_JOB_WS}/.build-worker/release/mlx.metallib.fingerprint"
          # Separate participant-worker attestation (TOCTOU defense): every
          # scored phase must execute exactly the worker binary and metallib
          # built from the reviewed source tree; the worker stays OUT of the
          # trusted pin.
          .github/scripts/pin-trusted-harness.sh write \
            "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # Transform the pinned Laguna target source into the candidate's runtime
      # weights.
      #
      # THE DFLASH TARGET IS THE SAME CHECKPOINT THE SERIAL TRACK RANKS AGAINST.
      # MLXFAST_DFLASH_TARGET_DIR and benchmark.yml's MLXFAST_REFERENCE_DIR are
      # the same snapshot (841778bd...), verified against the same
      # fixtures/reference_laguna_xs_2_1_nvfp4_mlx.sha256 manifest. A comment
      # here previously asserted the opposite, which is what made the two
      # workflows look like they needed two sets of hidden goldens. They do not:
      # the shared checkpoint identity is exactly why this job reuses the serial
      # track's hidden correctness golden and GPQA gates verbatim. Do not
      # regenerate per-track goldens on the belief that the checkpoints differ.
      - name: Transform DFlash target in bench sandbox
        env:
          BENCH_JOB_ID: dflash-ranked-${{ github.run_id }}-${{ github.run_attempt }}-transform
        run: |
          set -euo pipefail
          status=0
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" == "1" ]]; then
            echo "dflash-benchmark: running submitted transform with private process logs suppressed"
            # shellcheck disable=SC2024  # trusted shell owns the capture files
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" MLXFAST_DFLASH_TARGET_DIR="${MLXFAST_DFLASH_TARGET_DIR}" \
                MLXFAST_SANDBOX_PARENT_TOOLS=1 /bin/bash -c '
                set -euo pipefail
                cd "${MJOB_WS}"
                mkdir -p weights
                exec .build/release/mlxfast-swift transform \
                  --reference "${MLXFAST_DFLASH_TARGET_DIR}" \
                  --output weights
              ' > "${MLXFAST_PRIVATE_DIR}/transform-private.log" 2>&1 || status=$?
          else
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" MLXFAST_DFLASH_TARGET_DIR="${MLXFAST_DFLASH_TARGET_DIR}" \
                MLXFAST_SANDBOX_PARENT_TOOLS=1 /bin/bash -c '
                set -euo pipefail
                cd "${MJOB_WS}"
                mkdir -p weights
                exec .build/release/mlxfast-swift transform \
                  --reference "${MLXFAST_DFLASH_TARGET_DIR}" \
                  --output weights
              ' || status=$?
          fi
          test "${status}" -eq 0
          test -f "${MLXFAST_JOB_WS}/weights/config.json"

      - name: Hash transformed DFlash weights for ranked audit
        run: .github/scripts/hash-weights-directory.sh "${MLXFAST_JOB_WS}/weights" dflash-weights.sha256

      # ---- REUSED SERIAL GATE 1 of 4: public drift tripwire ----------------
      # Copied VERBATIM from .github/workflows/benchmark.yml (including its
      # "benchmark:" log prefixes and its own TOCTOU guard) so the two workflows
      # cannot drift. Deliberately ordered BEFORE the workspace snapshot and
      # BEFORE any hidden byte -- of either track -- enters the workspace, so
      # the worker running this public case cannot read a hidden oracle.
      #
      # TOCTOU guard: the submitted transform just ran with workspace write
      # access. Re-verify that the trusted driver + binary and the participant
      # worker + metallib still match their post-build pins before executing
      # them as bench again.
      - name: Verify trusted harness before public gate
        run: |
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # Public drift tripwire (issue #83 class): one independent 64-step
      # teacher-forced check against the checked-in public fixture, run BEFORE
      # the hidden gates so honest numeric drift fails fast. A tripwire for
      # accidental behavior change, NOT a security boundary -- the hidden gates
      # and the static review remain the adversarial defenses. Deliberately
      # ordered BEFORE the hidden golden ever enters the bench workspace, so
      # the worker running this public case cannot read any hidden bytes.
      # In correctness-only dispatches (run_benchmark=false) this is also the
      # produced correctness verdict, replacing the old correctness-only job.
      - name: Public behavior gate
        env:
          BENCH_JOB_ID: ranked-${{ github.run_id }}-${{ github.run_attempt }}-publicgate
          # Harness parity: the worker Seatbelt profile denies the golden under
          # check, exactly like writeRuntimeWorkerSandboxProfile does on the VM
          # pipeline. env_keep carries this through sudo to bench-exec.
          BENCH_GOLDEN_PATH: ${{ env.MLXFAST_JOB_WS }}/correctness_prompts/public_longcopy_gate_english_512_256.json
        run: |
          set -euo pipefail
          actual_hash="$(shasum -a 256 "${MLXFAST_JOB_WS}/${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" | awk '{print $1}')"
          if [[ "${actual_hash}" != "${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_SHA256}" ]]; then
            echo "::error::public correctness golden hash mismatch (${actual_hash})" >&2
            exit 1
          fi
          status=0
          started="${SECONDS}"
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" == "1" ]]; then
            echo "benchmark: running public behavior gate with process logs suppressed"
            # shellcheck disable=SC2024  # trusted shell owns the capture files
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
                MLXFAST_PUBLIC_GOLDEN="${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" /bin/bash -c '
                set -u
                cd "${MJOB_WS}" || exit 97
                exec .build/release/mlxfast-swift correctness \
                  --weights weights \
                  --golden "${MLXFAST_PUBLIC_GOLDEN}"
              ' > public-gate-report.json \
                2> "${MLXFAST_PRIVATE_DIR}/public-gate-private.log" || status=$?
          else
            # shellcheck disable=SC2024  # trusted shell owns the capture files
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
                MLXFAST_PUBLIC_GOLDEN="${MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH}" /bin/bash -c '
                set -u
                cd "${MJOB_WS}" || exit 97
                exec .build/release/mlxfast-swift correctness \
                  --weights weights \
                  --golden "${MLXFAST_PUBLIC_GOLDEN}"
              ' > public-gate-report.json || status=$?
          fi
          # The report only ever references the checked-in public fixture, so
          # surfacing the mismatch position and tokens leaks nothing hidden.
          jq -r '"benchmark: public gate passed=\(.passed) checked_steps=\(.checked_steps) first_failing_step=\(.first_failing_step) expected_token=\(.expected_token) actual_token=\(.actual_token)"' \
            public-gate-report.json || true
          echo "benchmark: public behavior gate finished in $((SECONDS - started))s"
          exit "${status}"

      # Reap stragglers from the unsandboxed build/transform BEFORE hidden
      # material enters the workspace.
      - name: Reap lingering bench processes before hidden material
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /bin/bash "${MLXFAST_JOB_WS}/.github/scripts/reap-bench-processes.sh"

      # Record every file in the bench workspace BEFORE any hidden material
      # enters it, for the allowlist scrub before timing (same design and
      # same reasoning as the serial pipeline).
      - name: Snapshot post-transform workspace
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" /bin/bash -c '
              set -u
              if [ -d "${MJOB_WS}/tmp" ]; then
                find "${MJOB_WS}/tmp" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true
              fi
            '
          manifest="${MLXFAST_PRIVATE_DIR}/post-transform-manifest.nul"
          find_err="${MLXFAST_PRIVATE_DIR}/post-transform-find.err"
          set +e
          ( cd "${MLXFAST_JOB_WS}" && find . -mindepth 1 \( -type f -o -type l \) -print0 2> "${find_err}" ) \
            | LC_ALL=C sort -z > "${manifest}"
          set -e
          if [[ -s "${find_err}" ]]; then
            if grep -vq 'Permission denied' "${find_err}"; then
              echo "::error::workspace snapshot hit unexpected find errors (only bench-private Permission denied subtrees are tolerated):" >&2
              cat "${find_err}" >&2
              exit 1
            fi
            skipped="$(grep -c 'Permission denied' "${find_err}" | tr -d ' ')"
            echo "dflash-benchmark: snapshot skipped ${skipped} bench-private (0700) subtrees the runner cannot read; the scrub is equally blind there and end-of-job cleanup wipes them"
          fi
          test -s "${manifest}"
          count="$(tr -cd '\0' < "${manifest}" | wc -c | tr -d ' ')"
          echo "dflash-benchmark: snapshotted ${count} pre-hidden workspace files for the allowlist scrub"

      # ---- REUSED SERIAL GATES 2-4: hidden correctness + GPQA --------------
      # The next six steps are .github/workflows/benchmark.yml's live gate steps,
      # copied VERBATIM (same script invocations, same R2 object keys, same
      # thresholds, same log prefixes) and pointed at THIS job's build. There is
      # deliberately no second GPQA implementation and no block-decode-specific
      # correctness path: GPQA proves the MODEL is sound, and asking the question
      # through the normal decode path is exactly what that requires. A DFlash
      # submitter edits the same vendored model/kernel surface and this job
      # builds the same mlxfast-swift + mlxfast-runtime-worker, so these gates
      # already give that guarantee.
      #
      # THREE deliberate deviations from byte-identical, each named:
      #   1. the `if: ${{ inputs.run_benchmark }}` guards are dropped, so a
      #      correctness-only dispatch exercises the whole reused leg (matching
      #      this workflow's existing unconditional DFlash gate);
      #   2. the gates pass reads `dflash-weights.sha256`, this track's name for
      #      serial's `weights.sha256`;
      #   3. the sealed gates score is `gates-score.json` /
      #      `benchmark-integrity.gates.json`, NOT `score.json` --- see the
      #      collision note on "Validate sealed gates score" below.
      #
      # ORDERING IS A SECURITY PROPERTY HERE. BENCH_GOLDEN_PATH denies exactly
      # ONE literal path in the worker Seatbelt profile, and this job now handles
      # two hidden goldens. So the serial augmented golden must be fully scrubbed
      # before the DFlash golden is installed, and vice versa; overlapping
      # residency would hand each leg's worker the other track's token oracle.
      # The "Scrub serial hidden material" step below is that bracket -- do not
      # reorder these steps or move the DFlash golden install above them.
      - name: Prepare hidden correctness golden
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_ENDPOINT: ${{ secrets.R2_BUCKET_ENDPOINT }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Private object keys scoped to this trusted download step only (not
          # job-level), so untrusted bench phases never receive the object
          # names. SHA-addressed names are immutable and cannot alias v1. These
          # are the SAME objects the serial track consumes -- authored nothing.
          MLXFAST_CORRECTNESS_GOLDEN_R2_PATH: correctness_prompts/laguna-xs-2.1-serial-v2/hidden-correctness-golden-94239d59b435eb8f370c82bcf8c86822d1bbc1094e3650aeff3abc5558137023.json
          MLXFAST_GPQA_R2_PATH: correctness_prompts/laguna-xs-2.1-serial-v2/gpqa-reference-cases-6e149e58908d086091ed7e7980e9f8beca7deb4d04063035d68d23e70ee1726f.json
        run: |
          set -euo pipefail
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_CORRECTNESS_GOLDEN_R2_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/raw_golden.json"
          raw_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/raw_golden.json" | awk '{print $1}')"
          raw_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/raw_golden.json" | tr -d ' ')"
          if [[ "${raw_hash}" != "${MLXFAST_RAW_CORRECTNESS_GOLDEN_SHA256}" || "${raw_bytes}" != "${MLXFAST_RAW_CORRECTNESS_GOLDEN_BYTES}" ]]; then
            echo "::error::raw hidden correctness golden pin mismatch" >&2
            exit 1
          fi
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_GPQA_R2_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/gpqa_reference.json"
          gpqa_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/gpqa_reference.json" | awk '{print $1}')"
          gpqa_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/gpqa_reference.json" | tr -d ' ')"
          if [[ "${gpqa_hash}" != "${MLXFAST_GPQA_REFERENCE_SHA256}" || "${gpqa_bytes}" != "${MLXFAST_GPQA_REFERENCE_BYTES}" ]]; then
            echo "::error::private GPQA reference pin mismatch" >&2
            exit 1
          fi
          echo "benchmark: raw hidden golden verified ${raw_hash} bytes=${raw_bytes}; GPQA reference verified ${gpqa_hash} bytes=${gpqa_bytes}"

      # PARITY CONTRACT: attach-gpqa-gates augments the raw golden with GPQA
      # behavior gates but MUST NOT mutate its .cases (the base teacher-forced
      # case) -- enforced directly below by re-pinning the augmented golden's
      # .cases against the raw hash-pinned golden, with
      # verify-correctness-golden.sh's coverage arithmetic plus the final
      # checked_steps validation as backstops. attach-gpqa-gates loads the tokenizer, i.e.
      # runs code from the submitted build, so it executes through bench-exec
      # like every other untrusted invocation. The raw
      # inputs are copied in as runner-owned files and scrubbed immediately
      # after, so during any later worker-spawning phase the only hidden file
      # in the workspace is the augmented golden, which the worker Seatbelt
      # profile denies by literal path (BENCH_GOLDEN_PATH below).
      - name: Attach GPQA gates and verify augmented golden
        env:
          BENCH_JOB_ID: ranked-${{ github.run_id }}-${{ github.run_attempt }}-attach
        run: |
          set -euo pipefail
          # Symlink-safe placement of the predictable-name hidden inputs. They
          # go into the runner-owned, bench-NON-writable .ranked-src/ staging
          # dir (ACL-denied to bench in "Prepare bench workspace"), so the
          # submitted transform can no longer pre-plant a symlink at these names
          # and redirect the trusted copy to leak the raw hidden golden. The
          # explicit reject-if-exists/symlink guard plus install(1) (which
          # creates a fresh regular file, never writes through a symlink) are
          # belt-and-suspenders on top of the ACL.
          golden_src="${MLXFAST_JOB_WS}/.ranked-src/golden.json"
          gpqa_src="${MLXFAST_JOB_WS}/.ranked-src/gpqa.json"
          for hidden_target in "${golden_src}" "${gpqa_src}"; do
            if [[ -e "${hidden_target}" || -L "${hidden_target}" ]]; then
              echo "::error::refusing to place hidden input over pre-existing path ${hidden_target}" >&2
              exit 1
            fi
          done
          install -m 0444 "${MLXFAST_PRIVATE_DIR}/raw_golden.json" "${golden_src}"
          install -m 0444 "${MLXFAST_PRIVATE_DIR}/gpqa_reference.json" "${gpqa_src}"
          status=0
          # MLXFAST_SANDBOX_PARENT_TOOLS=1 arms the CLI's parent-tool Seatbelt
          # sandbox: attach-gpqa-gates runs the submission-built binary directly
          # to read the raw hidden golden + GPQA answer key, so it self-confines
          # (deny network/fork/exec/DNS mach-lookup) before opening those inputs.
          # shellcheck disable=SC2024  # trusted shell owns the capture files
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" \
              MLXFAST_GPQA_CASE_COUNT="${MLXFAST_GPQA_CASE_COUNT}" \
              MLXFAST_GPQA_MAX_NEW_TOKENS="${MLXFAST_GPQA_MAX_NEW_TOKENS}" \
              MLXFAST_SANDBOX_PARENT_TOOLS=1 /bin/bash -c '
              set -u
              cd "${MJOB_WS}" || exit 97
              exec .build/release/mlxfast-swift attach-gpqa-gates \
                --golden .ranked-src/golden.json \
                --gpqa .ranked-src/gpqa.json \
                --tokenizer weights \
                --output correctness_golden_ranked.json \
                --case-count "${MLXFAST_GPQA_CASE_COUNT}" \
                --max-new-tokens "${MLXFAST_GPQA_MAX_NEW_TOKENS}"
            ' > "${MLXFAST_PRIVATE_DIR}/attach-gpqa.log" 2>&1 || status=$?
          # Runner-owned files: this unlinks the real trusted inputs, never an
          # attacker symlink (bench could not have created one here).
          rm -rf "${MLXFAST_JOB_WS}/.ranked-src"
          test "${status}" -eq 0 || { echo "::error::attach-gpqa-gates failed" >&2; exit 1; }
          test -s "${MLXFAST_JOB_WS}/correctness_golden_ranked.json"
          # Trusted copy is the pinned instance the artifacts reference; the
          # workspace copy is what the (bench) harness parent reads at run time.
          cp "${MLXFAST_JOB_WS}/correctness_golden_ranked.json" "${MLXFAST_CORRECTNESS_GOLDEN_PATH}"
          # Defense in depth: attach-gpqa-gates executes the SUBMITTED build,
          # so never trust its output to preserve the base case. Re-pin the
          # augmented golden's .cases against the raw hash-pinned golden
          # (canonicalized with jq -S, since augmentation re-encodes key order
          # and whitespace): augmentation may only append behavior gates,
          # never mutate the teacher-forced base .cases.
          raw_cases_hash="$(jq -S '.cases' "${MLXFAST_PRIVATE_DIR}/raw_golden.json" | shasum -a 256 | awk '{print $1}')"
          augmented_cases_hash="$(jq -S '.cases' "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | shasum -a 256 | awk '{print $1}')"
          if [[ "${augmented_cases_hash}" != "${raw_cases_hash}" ]]; then
            echo "::error::attach-gpqa-gates mutated the pinned base .cases (augmented ${augmented_cases_hash} != raw ${raw_cases_hash})" >&2
            exit 1
          fi
          echo "benchmark: augmented golden base cases re-pinned to raw pinned golden (cases sha256 ${raw_cases_hash})"
          actual_hash="$(shasum -a 256 "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | awk '{print $1}')"
          actual_bytes="$(wc -c < "${MLXFAST_CORRECTNESS_GOLDEN_PATH}" | tr -d ' ')"
          export MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_SHA256="${actual_hash}"
          export MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_BYTES="${actual_bytes}"
          {
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_SHA256=${actual_hash}"
            echo "MLXFAST_EXPECTED_CORRECTNESS_GOLDEN_BYTES=${actual_bytes}"
          } >> "${GITHUB_ENV}"
          # Writes the golden.sha256/.bytes sidecars and exports the expected
          # case/step coverage (MLXFAST_EXPECTED_CORRECTNESS_{CASES,CHECKED_STEPS})
          # into GITHUB_ENV for the final artifact validation.
          .github/scripts/verify-correctness-golden.sh
          # Guard the augmented workspace copy against divergence from the
          # verified trusted copy (they must be byte-identical).
          ws_hash="$(shasum -a 256 "${MLXFAST_JOB_WS}/correctness_golden_ranked.json" | awk '{print $1}')"
          test "${ws_hash}" == "${actual_hash}"
          echo "benchmark: using private GPQA-augmented correctness golden ${actual_hash} bytes=${actual_bytes}"

      # TOCTOU guard before the first --official invocation: attach-gpqa-gates
      # and the public gate executed the binaries as bench since the last
      # check, so re-verify the trusted driver + binary and the participant
      # worker + metallib against their post-build pins. A replaced
      # benchmark.sh or binary here could otherwise forge the sealed gates
      # score.
      - name: Verify trusted harness before gates
        run: |
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # The single gates+base pass: ONE `mlxfast-swift benchmark` invocation
      # (via benchmark.sh --official) that teacher-forces the FULL 64-step
      # hidden base case AND runs the anchor/free-run/behavior/GPQA gates,
      # GPQA TTFT, and the semantic-answer capture, while SKIPPING the timed
      # benchmark (MLXFAST_BENCHMARK_SKIP_TIMED=1). This is the SERIAL decode
      # path on purpose: it is what proves the model is still sound. The DFlash
      # block-decode parity gate below is a separate, additional check, and the
      # timed DFlash measurement runs LAST behind measure-dflash-job's thermal
      # gate.
      - name: Correctness and gates (full base case + hidden gates, no timing)
        id: gates_run
        env:
          BENCH_JOB_ID: ranked-${{ github.run_id }}-${{ github.run_attempt }}-gates
          # Worker Seatbelt literal deny for the augmented hidden golden. Only
          # the harness PARENT (trusted control flow) may read it to drive
          # teacher forcing; the worker that executes submitted model code
          # cannot. Kept through sudo env_reset via the sudoers env_keep list.
          BENCH_GOLDEN_PATH: ${{ env.MLXFAST_JOB_WS }}/correctness_golden_ranked.json
          MLXFAST_NOTE: "ci ${{ github.event_name }} ${{ env.MLXFAST_CANDIDATE_SHA }} mode=single-machine-gates"
        run: |
          set -euo pipefail
          # Known, documented residual: the semantic-answer capture (which
          # embeds hidden reference answers) is written by the harness parent
          # into ${MLXFAST_JOB_WS}/private/ at the very END of this pass, after
          # every behavior verdict is already recorded; the bench-exec worker
          # template cannot subpath-deny it like the VM harness profile did.
          # The exposure window is the few seconds between that write and
          # worker teardown, gains nothing (all gate verdicts are final by
          # then), and the file is scrubbed by a trusted step before any later
          # phase spawns another worker.
          raw_stdout="${MLXFAST_PRIVATE_DIR}/gates-stdout.raw"
          gates_log="${MLXFAST_PRIVATE_DIR}/gates-private.log"
          started="${SECONDS}"
          status=0
          # shellcheck disable=SC2024  # trusted shell owns the capture files
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env \
              MJOB_WS="${MLXFAST_JOB_WS}" \
              MLXFAST_OFFICIAL_BENCHMARK_RUN=1 \
              MLXFAST_SKIP_TRANSFORM=1 \
              MLXFAST_VERIFY_TRANSFORM="${MLXFAST_VERIFY_TRANSFORM}" \
              MLXFAST_REFERENCE_DIR="${MLXFAST_REFERENCE_DIR}" \
              MLXFAST_WEIGHTS_PATH=weights \
              MLXFAST_CORRECTNESS_GOLDEN_PATH=correctness_golden_ranked.json \
              MLXFAST_BENCHMARK_CORRECTNESS_STEPS="${MLXFAST_EXPECTED_CORRECTNESS_STEPS}" \
              MLXFAST_BENCHMARK_CHECK_GATES=1 \
              MLXFAST_BENCHMARK_SKIP_TIMED=1 \
              MLXFAST_PRIVATE_DIR="${MLXFAST_JOB_WS}/private" \
              MLXFAST_SEMANTIC_GPQA_OUTPUT_PATH="${MLXFAST_JOB_WS}/private/semantic_gpqa_answers.json" \
              MLXFAST_SEMANTIC_GPQA_CASE_COUNT="${MLXFAST_SEMANTIC_GPQA_CASE_COUNT}" \
              MLXFAST_SEMANTIC_GPQA_MAX_NEW_TOKENS="${MLXFAST_SEMANTIC_GPQA_MAX_NEW_TOKENS}" \
              MLXFAST_SCORE_PATH=score.gates.json \
              MLXFAST_INTEGRITY_PATH=benchmark-integrity.gates.json \
              MLXFAST_NOTE="${MLXFAST_NOTE}" \
              MLXFAST_COMMIT_SHA="${MLXFAST_CANDIDATE_SHA}" \
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0=safe.directory \
              GIT_CONFIG_VALUE_0='*' \
              /bin/bash -c '
                set -u
                cd "${MJOB_WS}" || exit 97
                ./benchmark.sh --official 1>&2
                status=$?
                if [ -s "${MLXFAST_SCORE_PATH}" ]; then
                  cat "${MLXFAST_SCORE_PATH}"
                fi
                exit "${status}"
              ' > "${raw_stdout}" 2> "${gates_log}" &
          pid="$!"
          # ps -p, not kill -0: the backgrounded pid is a setuid sudo process,
          # so the runner user cannot signal it (kill -0 would EPERM and end
          # the heartbeat immediately) but can still see it in the process
          # table.
          while ps -p "${pid}" >/dev/null 2>&1; do
            sleep 60
            if ps -p "${pid}" >/dev/null 2>&1; then
              echo "benchmark: correctness+gates still running elapsed=$((SECONDS - started))s"
            fi
          done
          wait "${pid}" || status=$?
          # Submitted-process stderr stays private on submission branches; on
          # trusted branches replay it for operators.
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" != "1" ]]; then
            cat "${gates_log}" || true
          fi
          # SCORE SEALING (mirrors measure-job.sh and benchmark.sh): the score
          # payload is taken from the exec'd process's stdout, captured in THIS
          # trusted shell -- exactly one JSON object shaped like a score.
          # On-disk workspace files are untrusted after bench ran; the sealed
          # copy plus the integrity hash cross-check below discard any tamper.
          if [[ "$(jq -s 'length' "${raw_stdout}" 2>/dev/null)" != "1" ]] \
              || ! jq -e '(.passed | type == "boolean") and has("score") and (.metrics | type == "object")' \
                  "${raw_stdout}" >/dev/null 2>&1; then
            echo "::error::correctness+gates run did not emit a single valid score payload (exit=${status})" >&2
            exit 1
          fi
          # DEVIATION 3 from benchmark.yml: sealed as gates-score.json, NOT
          # score.json. This workflow's "Compute DFlash score and enforce floor"
          # owns score.json; sealing the gates pass there too would have the
          # timed score overwrite the validated gates score (or vice versa) and
          # silently publish a DFlash score whose correctness fields were never
          # validated.
          cp "${raw_stdout}" gates-score.json
          cp "${MLXFAST_JOB_WS}/benchmark-integrity.gates.json" benchmark-integrity.gates.json
          sealed_hash="$(shasum -a 256 gates-score.json | awk '{print $1}')"
          integrity_hash="$(jq -r '.score_sha256 // empty' benchmark-integrity.gates.json)"
          if [[ "${sealed_hash}" != "${integrity_hash}" ]]; then
            echo "::error::sealed gates score hash does not match harness integrity record (possible in-workspace tamper)" >&2
            exit 1
          fi
          # DEVIATION 2 from benchmark.yml: this track names the trusted
          # post-transform weights hash dflash-weights.sha256.
          trusted_weights_hash="$(tr -d '[:space:]' < dflash-weights.sha256)"
          gates_weights_hash="$(jq -r '.metrics.weights_hash // empty' gates-score.json)"
          integrity_weights_hash="$(jq -r '.weights_sha256 // empty' benchmark-integrity.gates.json)"
          if [[ "${gates_weights_hash}" != "${trusted_weights_hash}" \
              || "${integrity_weights_hash}" != "${trusted_weights_hash}" ]]; then
            echo "::error::transformed weights changed between trusted hashing and the gates run" >&2
            exit 1
          fi
          echo "benchmark: correctness+gates finished exit=${status} seconds=$((SECONDS - started))"
          exit "${status}"

      # On a real gates failure the score's error/token fields can carry hidden
      # values, so nothing downstream may consume an unvalidated score. Leak
      # fields only.
      - name: Validate sealed gates score
        run: |
          set -euo pipefail
          test -s gates-score.json
          jq -e '
            .passed == true
            and (.metrics.error == "")
            and (.metrics.first_failing_case == null)
            and (.metrics.first_failing_layer == null)
            and (.metrics.first_failing_step == null)
            and (.metrics.expected_token == null)
            and (.metrics.actual_token == null)
            and (.metrics.passed_correctness == true)
          ' gates-score.json >/dev/null

      # Semantic GPQA judge (Anthropic), trusted step: consumes the bench-
      # written answer capture, patches the sealed score's semantic fields and
      # overall verdict, and re-anchors the integrity hash. The API key never
      # crosses the bridge. This is the ONLY GPQA judge in the repository --
      # there is no DFlash-specific judge and no second threshold.
      - name: Semantic GPQA gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ORG_ANTHROPIC_API_KEY }}
          MLXFAST_SEMANTIC_GPQA_OUTPUT_PATH: ${{ env.MLXFAST_JOB_WS }}/private/semantic_gpqa_answers.json
          MLXFAST_SCORE_PATH: gates-score.json
          MLXFAST_INTEGRITY_PATH: benchmark-integrity.gates.json
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::semantic GPQA gate requires ORG_ANTHROPIC_API_KEY" >&2
            exit 1
          fi
          .github/scripts/run-semantic-gpqa-gate.sh

      # SINGLE-OCCUPANCY BRACKET for hidden goldens, and the reason the step
      # order above is load-bearing. BENCH_GOLDEN_PATH denies exactly ONE
      # literal path in the worker Seatbelt profile, so if the serial augmented
      # golden were still resident when the DFlash gate's worker runs, submitted
      # model code could read the other track's hidden golden -- a token oracle.
      # Remove the serial hidden material (and the semantic-answer capture,
      # which embeds hidden reference answers) BEFORE the DFlash golden is
      # installed. This is not the pre-timing allowlist scrub; that still runs
      # later and additionally backstops this.
      - name: Scrub serial hidden material before the DFlash gate
        run: |
          set -euo pipefail
          rm -f "${MLXFAST_JOB_WS}/correctness_golden_ranked.json"
          rm -rf "${MLXFAST_JOB_WS}/private"
          mkdir -p "${MLXFAST_JOB_WS}/private"
          chmod 700 "${MLXFAST_JOB_WS}/private"
          if [[ -e "${MLXFAST_JOB_WS}/correctness_golden_ranked.json" ]]; then
            echo "::error::could not remove the serial augmented hidden golden before the DFlash gate; refusing to run two hidden goldens in one workspace" >&2
            exit 1
          fi
          leftovers="$(find "${MLXFAST_JOB_WS}" -maxdepth 2 -name '*golden*' ! -path "*/correctness_prompts/*" | grep -v '^$' || true)"
          if [[ -n "${leftovers}" ]]; then
            echo "::error::serial hidden-material scrub left candidates behind: ${leftovers}" >&2
            exit 1
          fi
          echo "dflash-benchmark: serial hidden material scrubbed; workspace holds no hidden golden before the DFlash golden is installed"

      # Trusted download + pin of the hidden IT-target goldens. Raw bytes
      # live runner-private; only the correctness golden is installed into
      # the workspace (into the bench-NON-writable .dflash-ranked-src staging
      # dir, symlink-guarded), because the bench harness PARENT must read it
      # to drive the oracle. The worker Seatbelt profile denies it by
      # literal path (BENCH_GOLDEN_PATH). The benchmark golden never enters
      # the workspace here; measure-dflash-job installs and scrubs it per timed
      # side.
      # CONTRACT LAYER L6 (anti-lottery). A single frozen hidden prompt makes a
      # failed ranked run free to retry, which degrades every output-side gate
      # from "must be correct" into "must be correct often enough to eventually
      # pass" -- and lets a confidence threshold be tuned by submit-until-green.
      # The defense is to sample the timed target from a POOL, uniformly at
      # random per run, from entropy the participant cannot see or influence
      # (not the run id, which is visible and stable within a run). Tuning to
      # one member then buys a 1/N chance instead of a certainty.
      #
      # The pool is declared in the contract fixture
      # (fixtures/laguna_xs_2_1_dflash_track.json -> timed_prompt_pool[]), each
      # entry carrying r2_path + sha256 + bytes. This step fails CLOSED when the
      # pool is missing or empty, exactly like the entry-less weight manifests
      # did before they were regenerated on-box: the mechanism ships now, the
      # pool objects must be uploaded to R2 before the track can be enabled.
      # The chosen index is written to the PRIVATE audit dir only -- echoing it
      # into a participant-visible log would hand back the sampling.
      - name: Select hidden DFlash timed target from the pool
        id: select_dflash_target
        run: |
          set -euo pipefail
          contract="${MLXFAST_DFLASH_CONTRACT_PATH}"
          test -s "${contract}"
          pool_size="$(jq '(.timed_prompt_pool // []) | length' "${contract}")"
          if [[ "${pool_size}" -lt 1 ]]; then
            echo "::error::DFlash timed prompt pool is empty in ${contract}; upload the pool objects and pin them before enabling this track" >&2
            exit 1
          fi
          # Uniform selection over [0,pool_size) from kernel entropy, rejecting
          # the biased tail of the RNG range rather than using a plain modulo.
          limit=$(( (65536 / pool_size) * pool_size ))
          while :; do
            draw=$(( $(od -An -N2 -tu2 < /dev/urandom | tr -d ' ') ))
            if [[ "${draw}" -lt "${limit}" ]]; then break; fi
          done
          index=$(( draw % pool_size ))
          entry="$(jq -c --argjson i "${index}" '.timed_prompt_pool[$i]' "${contract}")"
          r2_path="$(jq -r '.r2_path' <<<"${entry}")"
          sha256="$(jq -r '.sha256' <<<"${entry}")"
          bytes="$(jq -r '.bytes' <<<"${entry}")"
          for field in "${r2_path}" "${sha256}" "${bytes}"; do
            if [[ -z "${field}" || "${field}" == "null" ]]; then
              echo "::error::DFlash timed prompt pool entry ${index} is incomplete" >&2
              exit 1
            fi
          done
          # Private audit record; never printed to the job log.
          jq -n --argjson i "${index}" --argjson n "${pool_size}" --arg p "${r2_path}" \
            '{selected_index:$i, pool_size:$n, r2_path:$p}' \
            > "${MLXFAST_PRIVATE_DIR}/dflash_timed_target_selection.json"
          {
            echo "r2_path=${r2_path}"
            echo "sha256=${sha256}"
            echo "bytes=${bytes}"
          } >> "${GITHUB_OUTPUT}"
          echo "dflash-benchmark: timed target sampled from a pool of ${pool_size} (selection recorded privately)"

      - name: Prepare hidden DFlash goldens
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET_ENDPOINT: ${{ secrets.R2_BUCKET_ENDPOINT }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Private object keys scoped to this trusted download step only. The
          # benchmark (timed) golden comes from the per-run pool selection; the
          # correctness golden stays fixed because it is an untimed gate and is
          # not what the lottery would target.
          MLXFAST_DFLASH_CORRECTNESS_GOLDEN_R2_PATH: correctness_prompts/dflash_correctness_golden_laguna_xs_2_1-v1.json
          MLXFAST_DFLASH_BENCH_GOLDEN_R2_PATH: ${{ steps.select_dflash_target.outputs.r2_path }}
          MLXFAST_DFLASH_BENCH_GOLDEN_SHA256_SELECTED: ${{ steps.select_dflash_target.outputs.sha256 }}
          MLXFAST_DFLASH_BENCH_GOLDEN_BYTES_SELECTED: ${{ steps.select_dflash_target.outputs.bytes }}
        run: |
          set -euo pipefail
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_DFLASH_CORRECTNESS_GOLDEN_R2_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/dflash_correctness_golden.json"
          correctness_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/dflash_correctness_golden.json" | awk '{print $1}')"
          correctness_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/dflash_correctness_golden.json" | tr -d ' ')"
          if [[ "${correctness_hash}" != "${MLXFAST_DFLASH_CORRECTNESS_GOLDEN_SHA256}" || "${correctness_bytes}" != "${MLXFAST_DFLASH_CORRECTNESS_GOLDEN_BYTES}" ]]; then
            echo "::error::hidden DFlash correctness golden pin mismatch" >&2
            exit 1
          fi
          .github/scripts/download-r2-object.sh \
            "${MLXFAST_DFLASH_BENCH_GOLDEN_R2_PATH}" \
            "${MLXFAST_PRIVATE_DIR}/dflash_benchmark_golden.json"
          bench_hash="$(shasum -a 256 "${MLXFAST_PRIVATE_DIR}/dflash_benchmark_golden.json" | awk '{print $1}')"
          bench_bytes="$(wc -c < "${MLXFAST_PRIVATE_DIR}/dflash_benchmark_golden.json" | tr -d ' ')"
          # Verified against the PER-RUN pool selection, not a fixed pin: the
          # pool entry carries its own sha256/bytes and both must match, so a
          # swapped or truncated object fails closed even though the object key
          # differs from run to run.
          if [[ "${bench_hash}" != "${MLXFAST_DFLASH_BENCH_GOLDEN_SHA256_SELECTED}" || "${bench_bytes}" != "${MLXFAST_DFLASH_BENCH_GOLDEN_BYTES_SELECTED}" ]]; then
            echo "::error::hidden DFlash timed golden pin mismatch for the sampled pool entry" >&2
            exit 1
          fi
          # FAIL-CLOSED ROW-COUNT PRECONDITION on the existing gate's input, run
          # on the runner-private copies before either golden is installed.
          #
          # The DFlash driver requires options.totalTokenCount <= golden.rows.
          # count (LagunaRuntimeDFlashDriver.swift). When that is violated the
          # run dies ~25 minutes in, inside the gate, with an argument error --
          # after build, transform, the public gate and the whole reused serial
          # gate leg have already been paid for. Checking it here turns that into
          # a second-30 diagnostic naming the actual fix.
          #
          # This is NOT a new gate and NOT a threshold: it is the driver's own
          # inequality, asserted early against the same two numbers. It MUST stay
          # a hard error -- never a warning, and never a clamp of the requested
          # token count, because silently lowering the token count would shorten
          # the correctness window and the scored decode window without anyone
          # deciding to.
          check_golden_rows() {
            local path="$1" wanted="$2" label="$3" rows
            rows="$(jq -r 'if (.rows | type) == "array" then (.rows | length) else "" end' "${path}")"
            if [[ ! "${rows}" =~ ^[0-9]+$ || "${rows}" -eq 0 ]]; then
              echo "::error::hidden DFlash ${label} golden has no usable .rows array (read '${rows}'); regenerate the golden (go-live runbook step B)" >&2
              exit 1
            fi
            if [[ "${rows}" -lt "${wanted}" ]]; then
              echo "::error::hidden DFlash golden carries ${rows} rows but ${wanted} tokens are requested; regenerate the golden (go-live runbook step B) or lower the token count" >&2
              exit 1
            fi
            echo "dflash-benchmark: ${label} golden carries ${rows} reference rows for ${wanted} requested tokens"
          }
          check_golden_rows \
            "${MLXFAST_PRIVATE_DIR}/dflash_correctness_golden.json" \
            "${MLXFAST_DFLASH_CORRECTNESS_TOKENS}" correctness
          check_golden_rows \
            "${MLXFAST_PRIVATE_DIR}/dflash_benchmark_golden.json" \
            "${MLXFAST_DFLASH_DECODE_TOKENS}" benchmark
          golden_dst="${MLXFAST_JOB_WS}/.dflash-ranked-src/dflash_correctness_golden.json"
          if [[ -e "${golden_dst}" || -L "${golden_dst}" ]]; then
            echo "::error::refusing to place hidden input over pre-existing path ${golden_dst}" >&2
            exit 1
          fi
          install -m 0444 "${MLXFAST_PRIVATE_DIR}/dflash_correctness_golden.json" "${golden_dst}"
          echo "dflash-benchmark: hidden goldens verified (correctness ${correctness_hash}, benchmark ${bench_hash})"

      # TOCTOU guard: the submitted transform ran with workspace write access
      # since the post-build pins.
      - name: Verify trusted harness before DFlash correctness gate
        run: |
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # The untimed DFlash correctness/parity gate: one full-length block-decode
      # pass over the hidden correctness golden. The trusted parent checks
      # every returned token against the serial oracle (a single divergence
      # fails), enforces the block protocol, and re-validates target and
      # assistant artifacts before and after load. Stdout (the diagnostic
      # report JSON) is sealed in this trusted shell; on-disk files are never
      # trusted. Ordered BEFORE the timed phase so a broken submission never
      # burns gated thermal time.
      - name: DFlash correctness and parity gate (untimed)
        env:
          BENCH_JOB_ID: dflash-ranked-${{ github.run_id }}-${{ github.run_attempt }}-gates
          # Worker Seatbelt literal deny for the hidden correctness golden:
          # only the harness parent may read it. Kept through sudo env_reset
          # via the sudoers env_keep list, exactly like the serial pipeline.
          BENCH_GOLDEN_PATH: ${{ env.MLXFAST_JOB_WS }}/.dflash-ranked-src/dflash_correctness_golden.json
        run: |
          set -euo pipefail
          raw_stdout="${MLXFAST_PRIVATE_DIR}/dflash-gates-stdout.raw"
          gates_log="${MLXFAST_PRIVATE_DIR}/dflash-gates-private.log"
          started="${SECONDS}"
          status=0
          # shellcheck disable=SC2024  # trusted shell owns the capture files
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env \
              MJOB_WS="${MLXFAST_JOB_WS}" \
              MLXFAST_DFLASH_TARGET_DIR="${MLXFAST_DFLASH_TARGET_DIR}" \
              MLXFAST_DFLASH_ASSISTANT_DIR="${MLXFAST_DFLASH_ASSISTANT_DIR}" \
              MLXFAST_DFLASH_CONTRACT_PATH="${MLXFAST_DFLASH_CONTRACT_PATH}" \
              MLXFAST_DFLASH_BLOCK_SIZE="${MLXFAST_DFLASH_BLOCK_SIZE}" \
              MLXFAST_DFLASH_CORRECTNESS_TOKENS="${MLXFAST_DFLASH_CORRECTNESS_TOKENS}" \
              /bin/bash -c '
                set -u
                cd "${MJOB_WS}" || exit 97
                # Flags audited against Sources/MLXFastCLI/main.swift. Five that
                # the restored MTP scaffolding passed do not exist on this CLI and
                # would abort the run on argument validation:
                #   --target-source            (only `transform` consumes a source tree)
                #   --assistant                (this CLI spells it --drafter)
                #   --contract                 (enforced by the workflow interlock and
                #                               the trusted parent, never a CLI flag)
                #   --target-verification      (superseded by Criterion E; the trusted
                #                               parent validates, the worker does not)
                #   --require-trained-assistant (the drafter is hash-pinned by its
                #                               manifest instead)
                exec .build/release/mlxfast-swift dflash-benchmark \
                  --weights weights \
                  --drafter "${MLXFAST_DFLASH_ASSISTANT_DIR}" \
                  --golden .dflash-ranked-src/dflash_correctness_golden.json \
                  --tokens "${MLXFAST_DFLASH_CORRECTNESS_TOKENS}" \
                  --block-size "${MLXFAST_DFLASH_BLOCK_SIZE}"
              ' > "${raw_stdout}" 2> "${gates_log}" || status=$?
          if [[ "${MLXFAST_IS_SUBMISSION_BRANCH}" != "1" ]]; then
            cat "${gates_log}" || true
          fi
          # Seal + validate: exactly one JSON object with the DFlash report
          # shape, every token matched, trained drafter in use, and no score
          # fields (this phase is a gate, not a measurement).
          if [[ "$(jq -s 'length' "${raw_stdout}" 2>/dev/null)" != "1" ]]; then
            echo "::error::DFlash correctness gate did not emit a single valid report payload (exit=${status})" >&2
            exit 1
          fi
          # BLOCKER FIX (2026-07-30). Two further conjuncts used to sit here: one
          # requiring an `experimental` boolean, one requiring a
          # target-verification-mode string of "exact-pair". runDFlashBenchmark's
          # payload (Sources/MLXFastCLI/main.swift) emits NEITHER field, so
          # `jq -e` failed and this step exited 1 on EVERY run -- the DFlash gate
          # could never pass, enabled or not.
          #
          # The ASSERTION was the stale half, not the payload: the flag audit
          # above records that --target-verification was superseded by Criterion E
          # (the trusted parent validates work-honesty; the worker declares
          # nothing), so those two conjuncts asserted a contract that no longer
          # exists. They are DELETED rather than papered over by adding two
          # decorative fields to the payload. Every conjunct that remains below
          # is verified to be emitted.
          jq -e \
            --arg track "${MLXFAST_DFLASH_TRACK_ID}" \
            --argjson tokens "${MLXFAST_DFLASH_CORRECTNESS_TOKENS}" \
            '
            .track_id == $track
            and .uses_trained_drafter == true
            and .decode_token_count == $tokens
            and .all_tokens_matched == true
            and .official_score_produced == false
            and (has("score") | not)
            and (has("speedup") | not)
            ' "${raw_stdout}" >/dev/null || {
              echo "::error::DFlash correctness gate report failed validation (exit=${status})" >&2
              exit 1
            }
          cp "${raw_stdout}" dflash-gates-report.json
          echo "dflash-benchmark: correctness/parity gate passed in $((SECONDS - started))s (exit=${status})"
          exit "${status}"

      # ---- correctness-only (run_benchmark=false) artifact path ------------
      - name: Stage DFlash correctness artifacts
        id: stage_dflash_correctness_artifacts
        if: ${{ !inputs.run_benchmark }}
        run: |
          set -euo pipefail
          test "$(cat candidate.sha)" = "${MLXFAST_CANDIDATE_SHA}"
          # public-gate-report.json and gates-score.json are the verdicts of the
          # reused serial gates; without them a correctness-only dispatch
          # publishes the DFlash parity report and no evidence that the model
          # itself is still sound. deny-private-artifacts.sh already name-denies
          # *correctness_golden*.json, *gpqa_reference_cases*.json and
          # *gpqa_ttft_results*.json, and "Validate sealed gates score" above has
          # already asserted the sealed score carries no hidden token fields.
          .github/scripts/deny-private-artifacts.sh \
            candidate.sha \
            public-gate-report.json \
            gates-score.json \
            dflash-gates-report.json \
            dflash-weights.sha256
          .github/scripts/stage-benchmark-artifacts.sh \
            "${MLXFAST_ARTIFACT_ROOT}/dflash-correctness-results" \
            candidate.sha=candidate.sha \
            public-gate-report.json=public-gate-report.json \
            gates-score.json=gates-score.json \
            dflash-gates-report.json=dflash-gates-report.json \
            dflash-weights.sha256=dflash-weights.sha256

      - name: Upload DFlash correctness artifacts
        if: always() && steps.stage_dflash_correctness_artifacts.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dflash-correctness-results-${{ github.run_id }}
          path: ${{ env.MLXFAST_ARTIFACT_ROOT }}/dflash-correctness-results
          if-no-files-found: error
          overwrite: true

      # ---- ranked path (run_benchmark=true) ---------------------------------
      # Restore the workspace to its pre-hidden snapshot BEFORE the timed
      # phase: remove the hidden correctness golden, purge bench scratch
      # through the bridge, allowlist-delete every gates-phase file, and
      # re-verify weights against its pinned hash.
      - name: Scrub hidden material from bench workspace
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          rm -f "${MLXFAST_JOB_WS}/.dflash-ranked-src/dflash_correctness_golden.json"
          # The serial augmented golden was already removed by "Scrub serial
          # hidden material before the DFlash gate". Repeat it explicitly here so
          # this scrub's own *golden* leftovers backstop below stays a backstop
          # rather than becoming the only thing that catches it.
          rm -f "${MLXFAST_JOB_WS}/correctness_golden_ranked.json"
          rm -rf "${MLXFAST_JOB_WS}/private"
          mkdir -p "${MLXFAST_JOB_WS}/private"
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /usr/bin/env MJOB_WS="${MLXFAST_JOB_WS}" /bin/bash -c '
              set -u
              if [ -d "${MJOB_WS}/tmp" ]; then
                find "${MJOB_WS}/tmp" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null || true
              fi
            '
          manifest="${MLXFAST_PRIVATE_DIR}/post-transform-manifest.nul"
          test -s "${manifest}"
          scrub_failed=0
          while IFS= read -r -d '' rel; do
            case "${rel}" in
              ./weights/*|./.build/*|./.build-worker/*|./correctness_prompts/*) continue ;;
              ./private/*) continue ;;
            esac
            if grep -zqxF -- "${rel}" "${manifest}"; then
              continue
            fi
            target="${MLXFAST_JOB_WS}/${rel#./}"
            rm -f -- "${target}" 2>/dev/null || true
            if [[ -e "${target}" || -L "${target}" ]]; then
              echo "::error::allowlist scrub could not remove gates-phase workspace file: ${rel}" >&2
              scrub_failed=1
            fi
          done < <(cd "${MLXFAST_JOB_WS}" && find . -mindepth 1 \( -type f -o -type l \) -print0 | LC_ALL=C sort -z)
          if [[ "${scrub_failed}" -ne 0 ]]; then
            echo "::error::allowlist scrub left gates-phase workspace files it could not delete" >&2
            exit 1
          fi
          test -s dflash-weights.sha256
          scrub_weights_hash="$(.github/scripts/hash-weights-directory.sh "${MLXFAST_JOB_WS}/weights")"
          trusted_weights_hash="$(tr -d '[:space:]' < dflash-weights.sha256)"
          if [[ "${scrub_weights_hash}" != "${trusted_weights_hash}" ]]; then
            echo "::error::transformed DFlash weights changed before timing (hash ${scrub_weights_hash} != ${trusted_weights_hash})" >&2
            exit 1
          fi
          leftovers="$(find "${MLXFAST_JOB_WS}" -maxdepth 2 -name '*golden*' ! -path "*/correctness_prompts/*" | grep -v '^$' || true)"
          if [[ -n "${leftovers}" ]]; then
            echo "::error::hidden-material scrub left candidates behind: ${leftovers}" >&2
            exit 1
          fi
          echo "dflash-benchmark: bench workspace restored to pre-hidden snapshot before timing"

      - name: Reap lingering bench processes before timing
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
            /bin/bash "${MLXFAST_JOB_WS}/.github/scripts/reap-bench-processes.sh"

      - name: Wait for quiescence before timing
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          waited=0
          while :; do
            load="$(sysctl -n vm.loadavg | awk '{print $2}')"
            util="$("${MLXFAST_MACMON}" pipe -s1 2>/dev/null | jq -r '.gpu_usage[1] // 1' || true)"
            [[ -n "${util}" ]] || util=1
            if [[ "$(echo "${load} < 2.0" | bc -l)" == "1" && "$(echo "${util} < 0.10" | bc -l)" == "1" ]]; then
              break
            fi
            sleep 15
            waited=$((waited + 15))
            if [[ "${waited}" -ge 900 ]]; then
              echo "::error::machine did not reach quiescence within 900s (load=${load} gpu_util=${util})" >&2
              exit 1
            fi
          done
          temp="$("${MLXFAST_MACMON}" pipe -s1 2>/dev/null | jq -r '.temp.gpu_temp_avg // "?"')"
          echo "dflash-benchmark: quiescent after ${waited}s (load=${load} gpu_util=${util} gpu_temp=${temp}C); thermal gate is enforced inside measure-dflash-job"

      - name: Verify trusted harness before timing
        if: ${{ inputs.run_benchmark }}
        run: |
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/trusted-harness.sha256" trusted
          .github/scripts/pin-trusted-harness.sh verify "${MLXFAST_JOB_WS}" "${MLXFAST_PRIVATE_DIR}/participant-worker.sha256" worker

      # THE TIMED DFLASH MEASUREMENT -- LAST, via the box-owned wrapper with the
      # fixed thermal contract. Per accepted pair, alternating order:
      #   baseline: pinned DFlash baseline tree, serial K=1 target decode
      #             (dflash-probe) over the hidden benchmark golden;
      #   candidate: this workspace, dflash-benchmark (exact-pair) over the
      #             SAME golden, same --tokens denominator.
      # measure-dflash-job enforces per-phase quiescence + the 40C gate + 2 Hz
      # telemetry acceptance, requires all_tokens_matched=true from every
      # run, checks the baseline calibration band, and seals results.json.
      - name: Timed paired DFlash benchmark (measure-dflash-job)
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          # RESOLVE the baseline symlink before handing it to the wrapper.
          # measure-dflash-job.sh clones the baseline with `cp -c -R`, and on a
          # symlink source that copies the SYMLINK, not its contents -- so the
          # clone under /Users/Shared/bench-jobs becomes a link pointing back into
          # /opt/bench-runner, and bench-exec.sh correctly refuses it: "workspace
          # ... is not under the allowed job root". Measured on M5-C 2026-07-30.
          # Passing the resolved path keeps `current` as the operator's indirection
          # while giving the wrapper a real directory to clone.
          MLXFAST_DFLASH_BASELINE_RESOLVED="$(readlink -f "${MLXFAST_DFLASH_BASELINE_WS}")"
          test -d "${MLXFAST_DFLASH_BASELINE_RESOLVED}/.build/release" \
            || { echo "::error::resolved baseline is not a built workspace: ${MLXFAST_DFLASH_BASELINE_RESOLVED}" >&2; exit 1; }
          MEASURE_STATE_DIR="${MLXFAST_MEASURE_STATE_DIR}" \
          BASELINE_WS="${MLXFAST_DFLASH_BASELINE_RESOLVED}" \
          BASELINE_CALIBRATION="${MLXFAST_DFLASH_BASELINE_CALIBRATION}" \
          DFLASH_TARGET_DIR="${MLXFAST_DFLASH_TARGET_DIR}" \
          DFLASH_DRAFTER_DIR="${MLXFAST_DFLASH_ASSISTANT_DIR}" \
          GPU_LOADED_UTIL=0.95 \
            "${MLXFAST_DFLASH_MEASURE_JOB}" \
              --candidate "${MLXFAST_JOB_WS}" \
              --baseline "${MLXFAST_DFLASH_BASELINE_RESOLVED}" \
              --golden "${MLXFAST_PRIVATE_DIR}/dflash_benchmark_golden.json" \
              --contract "${MLXFAST_DFLASH_CONTRACT_PATH}" \
              --tokens "${MLXFAST_DFLASH_DECODE_TOKENS}" \
              --block-size "${MLXFAST_DFLASH_BLOCK_SIZE}" \
              --min-pairs "${MLXFAST_DFLASH_MIN_ACCEPTED_PAIRS}" \
              --target-pairs "${MLXFAST_DFLASH_TARGET_PAIRS}" \
              --tag "dflash-ranked-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --out "${MLXFAST_MEASURE_OUT}"
          test -s "${MLXFAST_MEASURE_OUT}/results.json"
          jq -c '{mode, accepted_pair_count, parity_all_ok}' "${MLXFAST_MEASURE_OUT}/results.json"

      # Decode-only score contract (adopted 2026-07-14 memo), applied in the
      # trusted shell from the sealed paired results: hard bit-exact gate,
      # minimum accepted pairs, RATIO-OF-MEANS aggregation computed HERE from
      # the sealed per-side seconds/token means (never trusted from a
      # pre-aggregated field), and the 1.0 floor on that aggregate. The
      # published score.json carries the track id so the leaderboard can
      # verify that this is the DFlash track rather than the legacy serial
      # track.
      - name: Compute DFlash score and enforce floor
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          results="${MLXFAST_MEASURE_OUT}/results.json"
          test -s "${results}"
          jq -e \
            --arg track "${MLXFAST_DFLASH_TRACK_ID}" \
            --argjson min_pairs "${MLXFAST_DFLASH_MIN_ACCEPTED_PAIRS}" \
            '
            .track_id == $track
            and .parity_all_ok == true
            and (.accepted_pair_count >= $min_pairs)
            and ((.pairs | type) == "array")
            and ((.pairs | length) == .accepted_pair_count)
            and (.aggregate.baseline_serial_seconds_per_token_mean | type == "number" and . > 0)
            and (.aggregate.candidate_dflash_seconds_per_token_mean | type == "number" and . > 0)
            and (.aggregate.dflash_decode_speedup_median | type == "number")
            and (.aggregate.dflash_decode_speedup_min | type == "number")
            ' "${results}" >/dev/null || {
              echo "::error::paired DFlash results failed validation (bit-exact gate, pair count, or schema)" >&2
              exit 1
            }
          # Ratio-of-means: mean serial s/tok over accepted pairs divided by
          # mean DFlash s/tok over the same pairs (equivalently total serial
          # decode time / total DFlash decode time for the fixed token total).
          speedup="$(jq -r '.aggregate.baseline_serial_seconds_per_token_mean / .aggregate.candidate_dflash_seconds_per_token_mean' "${results}")"
          floor_ok="$(echo "${speedup} >= ${MLXFAST_DFLASH_DECODE_SPEEDUP_FLOOR}" | bc -l)"
          if [[ "${floor_ok}" != "1" ]]; then
            echo "::error::dflash_decode_speedup (ratio-of-means) ${speedup} is below the ${MLXFAST_DFLASH_DECODE_SPEEDUP_FLOOR} floor; block decode itself costs ~16% on realistic prose, so this floor is the unmodified-candidate score (~0.87) with room for variation, NOT parity with serial decode" >&2
            exit 1
          fi
          jq -n \
            --arg track "${MLXFAST_DFLASH_TRACK_ID}" \
            --arg commit "${MLXFAST_CANDIDATE_SHA}" \
            --arg weights_hash "$(tr -d '[:space:]' < dflash-weights.sha256)" \
            --argjson score "${speedup}" \
            --argjson floor "${MLXFAST_DFLASH_DECODE_SPEEDUP_FLOOR}" \
            --argjson decode_tokens "${MLXFAST_DFLASH_DECODE_TOKENS}" \
            --argjson target_pairs "${MLXFAST_DFLASH_TARGET_PAIRS}" \
            --slurpfile results "${results}" \
            '
            {
              score: $score,
              passed: true,
              track_id: $track,
              metrics: {
                mode: "dflash-paired-decode-only",
                aggregation: "ratio_of_means",
                commit: $commit,
                decode_tokens: $decode_tokens,
                decode_speedup_floor: $floor,
                accepted_pair_count: $results[0].accepted_pair_count,
                target_pair_count: $target_pairs,
                parity_all_ok: $results[0].parity_all_ok,
                dflash_decode_speedup_ratio_of_means: $score,
                dflash_decode_speedup_median: $results[0].aggregate.dflash_decode_speedup_median,
                dflash_decode_speedup_min: $results[0].aggregate.dflash_decode_speedup_min,
                baseline_serial_seconds_per_token_mean: $results[0].aggregate.baseline_serial_seconds_per_token_mean,
                candidate_dflash_seconds_per_token_mean: $results[0].aggregate.candidate_dflash_seconds_per_token_mean,
                dflash_weights_hash: $weights_hash
              }
            }
            ' > score.json
          shasum -a 256 score.json | awk '{print $1}' > score.json.sha256
          jq -c '{track_id, score, passed}' score.json

      - name: Check DFlash benchmark artifact paths
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          test "$(cat candidate.sha)" = "${MLXFAST_CANDIDATE_SHA}"
          .github/scripts/deny-private-artifacts.sh \
            candidate.sha \
            score.json \
            score.json.sha256 \
            public-gate-report.json \
            gates-score.json \
            dflash-gates-report.json \
            dflash-weights.sha256

      - name: Stage DFlash benchmark artifacts
        id: stage_dflash_benchmark_artifacts
        if: ${{ inputs.run_benchmark }}
        run: |
          set -euo pipefail
          .github/scripts/stage-benchmark-artifacts.sh \
            "${MLXFAST_ARTIFACT_ROOT}/benchmark-results" \
            candidate.sha=candidate.sha \
            score.json=score.json \
            score.sha256=score.json.sha256 \
            public-gate-report.json=public-gate-report.json \
            gates-score.json=gates-score.json \
            dflash-gates-report.json=dflash-gates-report.json \
            dflash-weights.sha256=dflash-weights.sha256

      - name: Upload DFlash benchmark artifacts
        if: ${{ inputs.run_benchmark && steps.stage_dflash_benchmark_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-results-${{ github.run_id }}
          path: ${{ env.MLXFAST_ARTIFACT_ROOT }}/benchmark-results
          if-no-files-found: error
          overwrite: true

      # Timing provenance for audit/disputes: sealed paired results (paths,
      # commit ids, timings, telemetry aggregates only) and the measure
      # verdict. Content-vetted by deny-private-artifacts.
      - name: Stage DFlash audit artifacts
        id: stage_dflash_audit_artifacts
        if: ${{ always() && inputs.run_benchmark }}
        run: |
          set -euo pipefail
          staged=()
          if [[ -s "${MLXFAST_MEASURE_OUT}/results.json" ]]; then
            cp "${MLXFAST_MEASURE_OUT}/results.json" dflash-paired-results.json
            staged+=(dflash-paired-results.json=dflash-paired-results.json)
          fi
          if [[ -s "${MLXFAST_MEASURE_OUT}/verdict.txt" ]]; then
            cp "${MLXFAST_MEASURE_OUT}/verdict.txt" dflash-measure-verdict.txt
            staged+=(dflash-measure-verdict.txt=dflash-measure-verdict.txt)
          fi
          if [[ -s dflash-weights.sha256 ]]; then
            staged+=(dflash-weights.sha256=dflash-weights.sha256)
          fi
          if [[ "${#staged[@]}" -eq 0 ]]; then
            echo "dflash-benchmark: no audit artifacts to stage"
            exit 0
          fi
          .github/scripts/stage-benchmark-artifacts.sh \
            "${MLXFAST_ARTIFACT_ROOT}/dflash-benchmark-audit" \
            "${staged[@]}"

      - name: Upload DFlash audit artifacts
        if: ${{ always() && inputs.run_benchmark && steps.stage_dflash_audit_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dflash-benchmark-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MLXFAST_ARTIFACT_ROOT }}/dflash-benchmark-audit
          if-no-files-found: ignore
          retention-days: 90

      # Failure reporting for this track must never echo reference material.
      # The trusted parent authors "DFlash contract violation: <kind>" messages
      # that carry no reference token ids and no reference logit values, and this
      # script maps the KIND to an opaque category and drops the detail text --
      # the pair of them is contract layer L6 (a validator that surfaced golden
      # tokens would be a query oracle on the frozen hidden prompt).
      - name: Redact DFlash benchmark failure
        id: redact_dflash_failure
        if: ${{ failure() && inputs.run_benchmark }}
        env:
          MLXFAST_BENCHMARK_MODE: dflash-paired
        run: |
          set -euo pipefail
          # Give the redactor a score file it can actually categorise from. It
          # derives every category from a score's .metrics.error, and this
          # workflow's score.json does not exist until AFTER timing -- so on any
          # earlier failure the redactor was handed nothing and collapsed every
          # cause into the opaque "no_score". Prefer the timed score when it
          # exists, otherwise the sealed serial gates score (which carries
          # .metrics.error and the passed_correctness / semantic-GPQA verdicts,
          # and has already been leak-validated by "Validate sealed gates
          # score"). The third argument is the public gate report, which un-deadens
          # the public_gate_* categories. No new categories are introduced.
          redact_score="gates-score.json"
          if [[ -s score.json ]]; then
            redact_score="score.json"
          fi
          .github/scripts/redact-benchmark-failure.sh \
            benchmark-failure.json \
            "${redact_score}" \
            public-gate-report.json
          .github/scripts/deny-private-artifacts.sh benchmark-failure.json

      # Charge the branch's rate-limit budget ONLY for failures the participant
      # is responsible for. The redaction step above has already reduced the
      # failure to an opaque category; infra categories (a judge API outage, a
      # thermal reject, a nondeterministic reference) are operator faults and
      # must be re-dispatchable at no cost, otherwise the rate limit itself
      # becomes a denial-of-service against honest submitters.
      - name: Record attributable DFlash ranked failure
        if: ${{ failure() && steps.redact_dflash_failure.outcome == 'success' && startsWith(github.ref, 'refs/heads/submissions/') }}
        run: |
          set -euo pipefail
          test -s benchmark-failure.json || exit 0
          # redact-benchmark-failure.sh emits `failure_category`, never
          # `category`. Reading the wrong key made this rate limiter INERT: the
          # empty string fell through to the "not participant-attributable" arm
          # on every failure, so no branch ever consumed its budget and contract
          # layer L6's second half did nothing.
          category="$(jq -r '.failure_category // ""' benchmark-failure.json)"
          case "${category}" in
            dflash_*|floor_failed|correctness_failed|prefill_token_mismatch|decode_seed_token_mismatch|decode_token_mismatch)
              ;;
            *)
              echo "dflash-benchmark: category '${category}' is not participant-attributable; rate-limit budget untouched"
              exit 0
              ;;
          esac
          counts_dir="${MLXFAST_MEASURE_STATE_DIR}/failure-counts"
          mkdir -p "${counts_dir}"
          branch_key="$(printf '%s' "${GITHUB_REF}" | shasum -a 256 | awk '{print $1}')"
          counter="${counts_dir}/${branch_key}.count"
          used=0
          if [[ -s "${counter}" ]]; then
            used="$(tr -dc '0-9' < "${counter}")"
            used="${used:-0}"
          fi
          printf '%s\n' "$((used + 1))" > "${counter}.tmp"
          mv "${counter}.tmp" "${counter}"
          echo "dflash-benchmark: recorded attributable failure ($((used + 1))/${MLXFAST_DFLASH_MAX_RANKED_FAILURES}) for category ${category}"

      - name: Upload redacted DFlash failure
        if: ${{ failure() && steps.redact_dflash_failure.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dflash-benchmark-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-failure.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup bench workspace
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "${MLXFAST_JOB_WS}" ]]; then
            sudo -n "${MLXFAST_BENCH_EXEC}" "${MLXFAST_JOB_WS}" \
              /bin/sh -c 'find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + 2>/dev/null; true' || true
            rm -rf "${MLXFAST_JOB_WS}" || true
            if [[ -d "${MLXFAST_JOB_WS}" ]]; then
              echo "::warning::bench workspace residue left at ${MLXFAST_JOB_WS}"
            fi
          fi
          private_cleanup_failed=0
          for private_path in \
            "${MLXFAST_PRIVATE_DIR}" \
            "${MLXFAST_MEASURE_OUT}" \
            "${MLXFAST_ARTIFACT_ROOT}"; do
            if ! rm -rf -- "${private_path}"; then
              echo "::error::could not remove runner-private artifact path: ${private_path}" >&2
              private_cleanup_failed=1
              continue
            fi
            if [[ -e "${private_path}" || -L "${private_path}" ]]; then
              echo "::error::runner-private artifact cleanup failed: ${private_path}" >&2
              private_cleanup_failed=1
            fi
          done
          exit "${private_cleanup_failed}"

      - name: Janitor reset and integrity audit
        if: always()
        run: |
          set -euo pipefail
          sudo -n "${MLXFAST_JANITOR}"
          if [[ -e "${MLXFAST_QUARANTINE_FLAG}" ]]; then
            echo "::error::janitor quarantined the box after this run" >&2
            exit 1
          fi
          echo "dflash-benchmark: janitor reset + integrity audit clean"
