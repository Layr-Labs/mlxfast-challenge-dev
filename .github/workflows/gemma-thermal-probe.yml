name: gemma-thermal-probe

# Ad-hoc: is the ~17-min periodic 2x throttle actually THERMAL? Sample the SoC
# throttle state (pmset CPU_Speed_Limit, powermetrics GPU active frequency) while
# running --local-iterate windows, timestamped, then correlate: if slow windows
# coincide with a dropped GPU frequency / CPU speed limit, it is thermal
# limit-cycling. If telemetry is unavailable in the VM (sensors hidden), the
# capability step will show that and we fall back to a behavioral cooldown test.
#
# Baked Gemma cache => no re-download. NOT part of CI or scoring.
on:
  # Dispatch-only now; fullbench-characterize owns the push trigger.
  workflow_dispatch:
    inputs:
      machines:
        description: 'JSON array of machine indices, e.g. "[1]".'
        required: false
        default: "[1]"
        type: string
      passes:
        description: 'Windows per machine (~5 min each; 8 spans ~2 thermal periods).'
        required: false
        default: "8"
        type: string

concurrency:
  group: gemma-thermal-probe-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    name: "thermal machine ${{ matrix.machine }}"
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(inputs.machines || '[1]') }}
    runs-on: tenki-macos-latest-xlarge
    timeout-minutes: 120
    env:
      MLXFAST_PUBLIC_CORRECTNESS_GOLDEN_PATH: correctness_prompts/public_longcopy_gate_english_512_256.json
      MLXFAST_REFERENCE_MANIFEST_PATH: fixtures/reference_gemma_4_31b_4bit.sha256
      MLXFAST_REFERENCE_DIR: /Users/runner/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-4bit/snapshots/main
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Thermal telemetry capability
        run: |
          set -uo pipefail
          echo "== pmset -g therm (CPU_Speed_Limit; no sudo) =="
          pmset -g therm 2>&1 | head -20 || true
          echo "== sudo -n powermetrics gpu_power,thermal (needs sudo) =="
          sudo -n powermetrics -n 1 -i 500 --samplers gpu_power,thermal 2>&1 | head -60 || echo "powermetrics unavailable (no passwordless sudo or sensor hidden)"
          echo "== sysctl thermal/xcpm =="
          sysctl -a 2>/dev/null | grep -iE 'thermal|xcpm.*(limit|level)' | head -20 || true

      - name: Restore SwiftPM cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Swift harness and reference checkpoint
        env:
          MLXFAST_REFERENCE_BASE_URL: https://huggingface.co/mlx-community/gemma-4-31b-4bit/resolve/main
          MLXFAST_REFERENCE_DOWNLOAD_JOBS: "12"
          MLXFAST_REFERENCE_MIN_FREE_GIB: "40"
          MLXFAST_REFERENCE_POST_DOWNLOAD_FULL_VERIFY: "0"
          MLXFAST_REFERENCE_HASH_VERIFY: "0"
        run: |
          set -euo pipefail
          if [[ ! -f "${MLXFAST_REFERENCE_DIR}/config.json" ]]; then
            echo "::error::baked Gemma checkpoint missing at ${MLXFAST_REFERENCE_DIR}; refusing to download" >&2
            exit 1
          fi
          ./setup.sh

      - name: Transform reference checkpoint
        run: |
          set -euo pipefail
          mkdir -p weights
          MLXFAST_OFFLINE_WRITABLE_PATHS="${PWD}/weights" \
            .github/scripts/run-offline.sh .build/release/mlxfast-swift transform \
            --reference "${MLXFAST_REFERENCE_DIR}" \
            --output weights

      - name: Run windows with continuous thermal sampling
        env:
          MLXFAST_OFFICIAL_BENCHMARK_RUN: "1"
          MLXFAST_SKIP_TRANSFORM: "1"
          MLXFAST_WEIGHTS_PATH: weights
          PASSES: ${{ inputs.passes || '8' }}
        run: |
          set -uo pipefail
          M="${{ matrix.machine }}"

          # The VM hides /arm-io/pmgr (GPU freq / CPU speed-limit unreadable), but
          # `powermetrics --samplers thermal` DOES report "Current pressure level".
          # That is the one thermal signal available in the guest. Capture it.
          read_thermal() {
            local pl
            pl=$(sudo -n powermetrics -n 1 -i 300 --samplers thermal 2>/dev/null \
                   | grep -i 'Current pressure level' | sed 's/.*: *//' | tr -d ' \r' )
            echo "${pl:-NA}"
          }

          # continuous background sampler (epoch pressure_level) every ~10s
          : > "thermal-${M}.log"
          ( while :; do t=$(date +%s); r=$(read_thermal); echo "${t} ${r}" >> "thermal-${M}.log"; sleep 10; done ) &
          SMP=$!
          trap 'kill "${SMP}" 2>/dev/null || true' EXIT

          # per-window: index wstart wend pressure_at_start prefill decode
          : > "samples-${M}.txt"
          for i in $(seq 1 "${PASSES}"); do
            wstart=$(date +%s)
            r0=$(read_thermal)         # thermal pressure just before the timed window
            ./benchmark.sh --local-iterate >/dev/null 2>&1 || true
            wend=$(date +%s)
            read -r dec pre < <(python3 - <<'PY'
          import json
          try:
              m = json.load(open("score.local-iterate.json"))["metrics"]
              print(m.get("decode_seconds_per_token",""), m.get("prefill_seconds_per_token",""))
          except Exception:
              print("", "")
          PY
          )
            echo "${i} ${wstart} ${wend} ${r0} ${pre} ${dec}" | tee -a "samples-${M}.txt"
          done
          kill "${SMP}" 2>/dev/null || true
          echo "== thermal pressure level distribution over the run =="
          awk '{print $2}' "thermal-${M}.log" | sort | uniq -c

      - name: Upload machine artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-thermal-probe-${{ github.run_id }}-machine-${{ matrix.machine }}
          path: |
            samples-${{ matrix.machine }}.txt
            thermal-${{ matrix.machine }}.log
          if-no-files-found: error
          retention-days: 14

  combine:
    name: combine
    needs: [sample]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: gemma-thermal-probe-${{ github.run_id }}-machine-*
          path: samples
          merge-multiple: false
      - name: Correlate throttle state with slow windows
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${GITHUB_STEP_SUMMARY}"
          import glob, os, re, statistics as st
          def num(x):
              try: return float(x)
              except Exception: return None

          print("## Thermal probe: does macOS thermal pressure rise when windows go slow?")
          print()
          print("The VM hides GPU-freq/CPU-speed-limit (/arm-io/pmgr absent), but")
          print("`powermetrics --samplers thermal` reports **Current pressure level** in the")
          print("guest. If it leaves Nominal exactly when prefill doubles, the slowdown is")
          print("guest-visible thermal throttling. If it stays Nominal while prefill doubles,")
          print("the slowdown is NOT guest thermal (points to host/hypervisor GPU scheduling).")
          print()
          # pressure-level time series
          for tp in sorted(glob.glob("samples/**/thermal-*.log", recursive=True)):
              m = re.sub(r"^thermal-(.+)\.log$", r"\1", os.path.basename(tp))
              levels = [p.split()[1] for p in open(tp) if len(p.split()) >= 2]
              from collections import Counter
              c = Counter(levels)
              print(f"### machine {m} — pressure level over the whole run")
              print(f"- {dict(c)}  (n={len(levels)})")
              non_nominal = sum(v for k, v in c.items() if k not in ('Nominal', 'NA'))
              print(f"- non-Nominal samples: **{non_nominal}/{len(levels)}**")
              print()

          # per-window: pressure at start vs prefill (cool ~0.011 vs hot ~0.02-0.036)
          for sp in sorted(glob.glob("samples/**/samples-*.txt", recursive=True)):
              m = re.sub(r"^samples-(.+)\.txt$", r"\1", os.path.basename(sp))
              rows = []
              for line in open(sp):
                  p = line.split()
                  # idx wstart wend pressure prefill decode
                  if len(p) < 6: continue
                  rows.append((int(p[0]), p[3], num(p[4]), num(p[5])))
              if not rows: continue
              print(f"### machine {m} — per-window (pressure AT window start)")
              print("| win | pressure level | prefill s/tok | hot? |")
              print("|---|---|---|---|")
              pre = [r[2] for r in rows if r[2] is not None]
              thr = (min(pre) + max(pre)) / 2 if pre else None   # split cool vs hot
              for idx, pl, prv, dcv in rows:
                  hot = "HOT" if (prv is not None and thr is not None and prv > thr) else "cool"
                  print(f"| {idx} | {pl} | {prv if prv is not None else 'NA'} | {hot} |")
              # verdict: are the HOT windows the ones with non-Nominal pressure?
              hot_pls = [pl for _, pl, prv, _ in rows if prv is not None and thr is not None and prv > thr]
              cool_pls = [pl for _, pl, prv, _ in rows if prv is not None and thr is not None and prv <= thr]
              hot_nonnom = sum(1 for x in hot_pls if x not in ('Nominal', 'NA'))
              print()
              print(f"- HOT (slow) windows pressure: {hot_pls}")
              print(f"- cool (fast) windows pressure: {cool_pls}")
              if hot_pls:
                  if hot_nonnom >= max(1, len(hot_pls)//2):
                      print("- **THERMAL CONFIRMED: slow windows carry non-Nominal thermal pressure.**")
                  else:
                      print("- **NOT guest-thermal: prefill doubles while pressure stays Nominal "
                            "=> host/hypervisor GPU scheduling, not SoC thermal throttling the guest sees.**")
              print()
          PY
      - name: Upload combined
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gemma-thermal-probe-${{ github.run_id }}-combined
          path: samples
          if-no-files-found: warn
          retention-days: 14
